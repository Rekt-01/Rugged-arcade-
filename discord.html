<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugged Orphans - Socials & Info</title>
  <!-- Retro Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d061a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      padding: 20px;
    }

    .social-container {
      background: rgba(13, 6, 26, 0.95);
      border: 3px solid #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.6), 6px 6px 0px #00ffff;
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 14px;
      color: #00ffff;
      text-shadow: 2px 2px 0px #ff00ff;
      line-height: 1.6;
      margin-bottom: 5px;
    }

    p {
      font-size: 8px;
      color: #b3a4c9;
      line-height: 1.5;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1a0b36;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 14px 18px;
      text-decoration: none;
      font-size: 9px;
      box-shadow: 3px 3px 0px #ff00ff;
      transition: all 0.15s ease;
    }

    .social-btn:hover {
      background: #ff00ff;
      color: #0d061a;
      border-color: #00ffff;
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px #00ffff;
    }

    .social-icon {
      font-size: 12px;
    }

    .return-btn {
      margin-top: 15px;
      background: #00ffff;
      border: 2px solid #ff00ff;
      color: #0d061a;
      padding: 12px;
      text-decoration: none;
      font-size: 9px;
      box-shadow: 3px 3px 0px #ff00ff;
      transition: all 0.15s ease;
      font-weight: bold;
    }

    .return-btn:hover {
      background: #ff00ff;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px #00ffff;
    }
  </style>
</head>
<body>

  <div class="social-container">
    <h1>COMMUNITY & LINKS</h1>
    <p>Connect with the rugged orphans degen ecosystem below!</p>

    <div class="links-list">
      <!-- X / Twitter Link -->
      <a href="https://x.com/rugged_orphans?s=11" target="_blank" class="social-btn">
        <span class="social-icon">✖</span>
        <span>X (TWITTER)</span>
      </a>

      <!-- Discord Link -->
      <a href="YOUR_DISCORD_INVITE_LINK_HERE" target="_blank" class="social-btn">
        <span class="social-icon">💬</span>
        <span>DISCORD</span>
      </a>

      <!-- OpenSea Main Page Link -->
      <a href="YOUR_OPENSEA_COLLECTION_LINK_HERE" target="_blank" class="social-btn">
        <span class="social-icon">⚓</span>
        <span>OPENSEA (WEN DROP)</span>
      </a>
    </div>

    <!-- Return to Arcade Button -->
    <a href="main.html" class="return-btn">◀ RETURN TO ARCADE</a>
  </div>

</body>
</html>
