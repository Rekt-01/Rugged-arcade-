<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
  <title>The Rugged Bar v14.2 - Restroom</title>
  <!-- Childlike Crayon / Marker Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewport {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene-container {
      position: absolute; top: 50%; left: 50%;
      width: 100vw; height: 177.78vw;
      max-height: 100vh; max-width: 56.25vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: url('toilet.JPG') center center / cover no-repeat;
    }

    @media (min-aspect-ratio: 9/16) {
      .scene-container { width: 56.25vh; height: 100vh; }
    }

    /* --- INTERACTIVE HOTSPOTS --- */
    .hotspot {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background 0.2s ease;
    }

    .stall-lock-hotspot {
      top: 42%;
      right: 23%;
      width: 15%;
      height: 8%;
    }
    .stall-lock-hotspot:hover, .stall-lock-hotspot:active {
      background: rgba(0, 255, 102, 0.2);
      border-radius: 6px;
    }

    .roadmap-hotspot {
      top: 56%;
      left: 3%;
      width: 12%;
      height: 7%;
    }
    .roadmap-hotspot:hover, .roadmap-hotspot:active {
      background: rgba(255, 0, 122, 0.25);
      border-radius: 4px;
    }

    /* --- PULSING ARROW & TEXT POINTER FOR ROAD MAP --- */
    .roadmap-pointer {
      position: absolute;
      top: 55%;
      left: 15%;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      animation: bounceArrow 1.2s infinite ease-in-out;
    }

    .roadmap-arrow-icon {
      color: #ff007a;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 0, 122, 0.8);
    }

    .roadmap-pointer-text {
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      border: 1px solid #ff007a;
      border-radius: 4px;
      padding: 3px 6px;
      font-family: monospace;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.6);
      box-shadow: 0 0 10px rgba(255, 0, 122, 0.4);
      white-space: nowrap;
    }

    @keyframes bounceArrow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-5px); }
    }

    /* --- TOILET PAPER ROLL MODAL --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      z-index: 20;
      justify-content: center;
      align-items: center;
      padding: 15px;
      backdrop-filter: blur(6px);
    }

    .modal-content {
      position: relative;
      background: linear-gradient(135deg, #fbfbf8 0%, #f0eee6 50%, #e6e3d8 100%);
      color: #2b2b2b;
      border-radius: 4px 4px 12px 12px;
      padding: 28px 14px 18px 14px;
      width: 94vw;
      max-width: 450px;
      max-height: 88vh;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(200, 195, 180, 0.6);
      border-top: 6px dashed #dcd8cc;
      border-bottom: 6px dashed #dcd8cc;
    }

    .close-btn {
      position: absolute;
      top: 4px; right: 12px;
      color: #777;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
    .close-btn:hover { color: #d90429; }

    .roadmap-image-container {
      max-height: 68vh;
      overflow-y: auto;
      overflow-x: hidden;
      margin-bottom: 12px;
      border: 2px dashed #c7c2b4;
      border-radius: 4px;
      background: #faf8f0;
    }

    .roadmap-image-container svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .roadmap-image-container::-webkit-scrollbar { width: 6px; }
    .roadmap-image-container::-webkit-scrollbar-thumb {
      background: #bbb6a8;
      border-radius: 4px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .modal-action-btn {
      background: #2b2b2b;
      color: #fbfbf8;
      border: none;
      border-radius: 15px;
      padding: 9px 14px;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      flex: 1;
      transition: background 0.2s ease;
    }
    .modal-action-btn:hover { background: #d90429; }
    .modal-action-btn.download-btn { background: #1d6f42; }
    .modal-action-btn.download-btn:hover { background: #145230; }
  </style>
</head>

  <script>
    function openRoadmapModal() {
      document.getElementById('roadmapModal').style.display = 'flex';
    }

    function closeRoadmapModal() {
      document.getElementById('roadmapModal').style.display = 'none';
    }

    // Converts the Crayon SVG artwork into a high-res roadmap.png file download
    function downloadRoadmapPng() {
      const svgEl = document.getElementById('crayonRoadmapSvg');
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgEl);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1960;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'roadmap.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };
      img.src = url;
    }
  </script>
