<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>RUG PINBALL - DEGEN ARCADE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #040307;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
            font-variant-numeric: tabular-nums;
        }
        #app-wrapper {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: env(safe-area-inset-top, 6px) 8px env(safe-area-inset-bottom, 8px) 8px;
            gap: 6px;
        }
        #canvas-container {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: 100%;
            aspect-ratio: 420 / 720;
            display: block;
            background: #08040c;
            border: 2px solid #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.35), inset 0 0 20px rgba(0, 0, 0, 0.9);
            border-radius: 16px;
        }
        .mk-panel {
            background: rgba(15, 10, 18, 0.95);
            border: 1.5px solid rgba(220, 38, 38, 0.75);
            box-shadow: 0 0 18px rgba(220, 38, 38, 0.25);
        }
        .mk-btn {
            background: linear-gradient(180deg, rgba(185, 28, 28, 0.55), rgba(69, 10, 10, 0.85));
            border: 2px solid rgba(248, 113, 113, 0.85);
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.05s, background 0.1s;
        }
        .mk-btn:active, .touch-active {
            transform: scale(0.94);
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.9), rgba(153, 27, 27, 0.95));
            box-shadow: 0 0 22px rgba(251, 191, 36, 0.75);
        }
        .mk-plunger {
            background: linear-gradient(180deg, rgba(217, 119, 6, 0.6), rgba(120, 53, 15, 0.85));
            border: 2px solid #fbbf24;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.4);
        }
        .mk-plunger:active, .plunger-active {
            transform: scale(0.94);
            background: rgba(245, 158, 11, 0.95);
            box-shadow: 0 0 26px rgba(251, 191, 36, 0.9);
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="app-wrapper">

            <div class="h-6 w-[1px] bg-red-900/60"></div>

    <!-- PINBALL MACHINE PLAYFIELD -->

    <!-- BOTTOM ARCADE CONTROLS -->

        <button id="btnLeft" type="button" class="col-span-5 mk-btn py-3.5 rounded-2xl flex flex-col items-center justify-center">
            <span class="font-orbitron font-black text-sm sm:text-base text-white tracking-wide">LEFT FLIP</span>
            <span class="text-[10px] text-rose-300 font-semibold">[A / LEFT]</span>
        </button>
        <button id="btnLaunch" type="button" class="col-span-2 mk-plunger py-3.5 rounded-2xl flex flex-col items-center justify-center">
            <span id="launchLabel" class="font-orbitron font-black text-[11px] text-amber-200">LAUNCH</span>
            <span class="text-[9px] text-amber-100 font-semibold">[SPACE]</span>

        <button id="btnRight" type="button" class="col-span-5 mk-btn py-3.5 rounded-2xl flex flex-col items-center justify-center">
            <span class="font-orbitron font-black text-sm sm:text-base text-white tracking-wide">RIGHT FLIP</span>
            <span class="text-[10px] text-rose-300 font-semibold">[D / RIGHT]</span>
        </button>
    </footer>
</div>

<script>
/* ============================================================================
   PIXEL ART CHARACTER SPRITES (Captain Otter, Chad, Princess Hailey)
   ============================================================================ */
const PALETTE = {
    'K': '#090a0f', // Black outline
    'W': '#ffffff', // Pure white
    'Y': '#facc15', // Gold / Anchor / Crown
    'V': '#172554', // Dark navy cap band
    'N': '#6b4226', // Otter brown / Hailey hair
    'C': '#0ea5e9', // Otter blue eyes / 3D lens
    'M': '#f5deb3', // Otter cream muzzle
    'B': '#1d4ed8', // USA flag blue
    'R': '#ef4444', // USA flag red / 3D lens / Cloak
    'S': '#eac096', // Chad / Hailey skin
    'T': '#c49668', // Skin shading
    'G': '#94a3b8', // Sunglasses glare / Smoke
    'D': '#1e293b', // Dark shades frame
    'P': '#db2777', // Lip pink
    'O': '#f97316', // Hoodie strings / Cigarette filter
    'A': '#cbd5e1'  // Fur spots
};

// 1. CAPTAIN OTTER (16x16 Pixel Portrait)
const OTTER_SPRITE = [
    "....KKKKKKKK....",
    "..KKWWWWWWWWKK..",
    ".KWWWWWWYWWWWWK.",
    ".KWWWWWYYYWWWWK.",
    ".KVVVVVYYYVVVVK.",
    ".KYYYYYYYYYYYYK.",
    "KKNNNNKKKKKKKKKK",
    "KNNNNNCCKNNNCCK.",
    ".KNNNNNNMMNNNNK.",
    ".KNNNMMMMMMMMMK.",
    ".KNNMMKKMMKKMMK.",
    "..KNNNNMMMMMMMK.",
    "..KNNNMMMMMMMK..",
    ".KNNNNMMMMMMMNK.",
    "KNNNNNMMMMMMMNNK",
    "KNNNNNMMMMMMMNNK"
];

// 2. CHAD (16x16 Pixel Portrait)
const CHAD_SPRITE = [
    ".....KKKKKK.....",
    "...KKBBBBWWKK...",
    "..KBWBBWBWRRRK..",
    ".KBBWBWBWBRWWRK.",
    "KKKBBBBBBBBRRRRK",
    "KWWKSSSSSSSSSSK.",
    "KRRKKKKKKKKKKKK.",
    ".KKKSSKKGGKKGGKK",
    "..KTSSKKGGKKGGKK",
    "..KTSSKKKKKKSSK.",
    "...KSSSSSSPPSSK.",
    "..KKRKKKKKKKKRKK",
    ".KRRRRKSSSSKRRRR",
    ".KBBBBKORWROKWRW",
    ".KBBBBKORRROKRRR",
    ".KBBBBKOWWWOKWWW"
];

// 3. PRINCESS HAILEY (16x16 Pixel Portrait w/ 3D Glasses & Cigarette)
const HAILEY_SPRITE = [
    "....KKKKKKKK....",
    "..KKNNNNNNNNKK..",
    ".KNNYNNNNNNNNNK.",
    "KNNNYNNNNNNNNNNK",
    "KNNNKSSSSSSSSSK.",
    "KNNNKWWWWWWWWWWK",
    "KNNNKTWWCCWWRRWK",
    "KNNNKSSWWWWWWWWK",
    ".KNNKSSSSSSSSSKG",
    ".KNNKSSSSPPPOOWR",
    "..KKKSSSSSSKKK..",
    ".KWWAKKKKKKAWWK.",
    "KWAWWKYYYYKWWAK.",
    "KRRRRKYKKYKRRRRK",
    "KRRRRKYYYYKRRRRK",
    "KRRRRKYKKYKRRRRK"
];

function buildSpriteCanvas(grid, scale = 3) {
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = 16 * scale;
    const ctx = c.getContext('2d');
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

/* ============================================================================
   WEB AUDIO SYNTHESIZER (Retro Pinball Arcade SFX)
   ============================================================================ */
class PinballAudio {
    constructor() {
        this.ctx = null;
    }
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        } catch (e) {}
    }
    tone(freq, endFreq, dur, type = 'square', vol = 0.14, delay = 0) {
        if (!this.ctx) return;
        try {
            const start = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), start + dur);
            gain.gain.setValueAtTime(vol, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + dur);
        } catch (e) {}
    }
    flipper() {
        this.tone(180, 320, 0.055, 'triangle', 0.16);
    }
    launch() {
        this.tone(130, 680, 0.22, 'sawtooth', 0.18);
    }
    bumper(pitch = 1) {
        this.tone(360 * pitch, 780 * pitch, 0.09, 'square', 0.16);
        this.tone(180 * pitch, 90, 0.11, 'sawtooth', 0.12);
    }
    slingshot() {
        this.tone(520, 240, 0.08, 'sawtooth', 0.15);
    }
    rollover() {
        this.tone(660, 990, 0.08, 'sine', 0.13);
    }
    targetHit() {
        this.tone(440, 880, 0.1, 'triangle', 0.16);
    }
    jackpot() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => {
            this.tone(f, f * 1.15, 0.14, 'square', 0.16, i * 0.07);
        });
    }
    shieldSave() {
        this.tone(300, 900, 0.18, 'sawtooth', 0.18);
    }
    drain() {
        [240, 190, 140, 95].forEach((f, i) => {
            this.tone(f, f * 0.75, 0.18, 'sawtooth', 0.16, i * 0.09);
        });
    }
}

/* ============================================================================
   MAIN PINBALL ENGINE (Fixed 420x720 Virtual Table Coordinates)
   ============================================================================ */
class RugPinballMachine {
    constructor() {
        this.canvas = document.getElementById('pinballCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.W = 420;
        this.H = 720;
        this.sfx = new PinballAudio();

        // Pre-render Character Pixel Art
        this.sprites = {
            otter: buildSpriteCanvas(OTTER_SPRITE, 3),
            chad: buildSpriteCanvas(CHAD_SPRITE, 3),
            hailey: buildSpriteCanvas(HAILEY_SPRITE, 3)
        };

        // Persistent High Score
        this.bestScore = 0;
        try {
            this.bestScore = parseInt(localStorage.getItem('rugPinballBest') || '0', 10) || 0;
        } catch (e) {}

        // Game State
        this.score = 0;
        this.multiplier = 1;
        this.ballNumber = 1;
        this.maxBalls = 3;
        this.jackpotMeter = 0; // 0 to 100
        this.jackpotLit = true;
        this.shieldTimer = 0;
        this.shake = 0;
        this.gameState = 'PLAYING'; // PLAYING, GAMEOVER

        // Plunger State
        this.plungerCharge = 0;
        this.plungerPulling = false;

        // Input State
        this.leftHeld = false;
        this.rightHeld = false;

        // Flippers (Positioned for clean shots & center gap)
        this.flippers = [
            {
                side: 'left',
                x: 112, y: 632,
                length: 68, radius: 8,
                restAngle: 0.46,
                activeAngle: -0.52,
                angle: 0.46,
                prevAngle: 0.46,
                omega: 0
            },
            {
                side: 'right',
                x: 268, y: 632,
                length: 68, radius: 8,
                restAngle: Math.PI - 0.46,
                activeAngle: Math.PI + 0.52,
                angle: Math.PI - 0.46,
                prevAngle: Math.PI - 0.46,
                omega: 0
            }
        ];

        // Character Pop Bumpers
        this.bumpers = [
            {
                id: 'otter',
                name: 'CAPTAIN OTTER',
                callout: 'ANCHOR SMASH!',
                x: 190, y: 210, r: 34,
                color: '#38bdf8', ringColor: '#facc15',
                points: 500, pitch: 1.0,
                pulse: 0
            },
            {
                id: 'chad',
                name: 'CHAD',
                callout: 'GIGA PUMP!',
                x: 118, y: 292, r: 30,
                color: '#ef4444', ringColor: '#3b82f6',
                points: 400, pitch: 1.2,
                pulse: 0
            },
            {
                id: 'hailey',
                name: 'PRINCESS HAILEY',
                callout: '3D SMOKE!',
                x: 262, y: 292, r: 30,
                color: '#ec4899', ringColor: '#facc15',
                points: 400, pitch: 1.35,
                pulse: 0
            }
        ];

        // Upper "W-A-G-M-I" Rollover Lanes
        this.wagmiLanes = [
            { letter: 'W', x: 96,  y: 96, r: 13, lit: false },
            { letter: 'A', x: 143, y: 84, r: 13, lit: false },
            { letter: 'G', x: 190, y: 80, r: 13, lit: false },
            { letter: 'M', x: 237, y: 84, r: 13, lit: false },
            { letter: 'I', x: 284, y: 96, r: 13, lit: false }
        ];

        // "R-U-G" Drop Targets (Left Upper Bank guarding Jackpot)
        this.dropTargets = [
            { label: 'R', x1: 38, y1: 185, x2: 52, y2: 155, hit: false, flash: 0 },
            { label: 'U', x1: 55, y1: 150, x2: 72, y2: 124, hit: false, flash: 0 },
            { label: 'G', x1: 75, y1: 120, x2: 96, y2: 98,  hit: false, flash: 0 }
        ];

        // Neon Vortex / Jackpot Pocket (Upper Right-Mid Pocket)
        this.vortex = { x: 326, y: 175, r: 20, spin: 0 };

        // Static Walls & Slingshots
        this.walls = [];
        this.posts = [];
        this.buildTableGeometry();

        // Active Pinballs, Particles, Floating Text
        this.balls = [];
        this.particles = [];
        this.popups = [];
        this.banner = { text: 'PULL LAUNCH TO SHOOT!', sub: 'LIGHT W-A-G-M-I FOR MULTIBALL', timer: 3.5 };

        this.spawnPlungerBall();
        this.updateHUD();
        this.bindEvents();

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    buildTableGeometry() {
        this.walls = [];
        this.posts = [];

        const addWall = (x1, y1, x2, y2, bounce = 0.75, color = '#dc2626', isSlingshot = false, points = 0) => {
            this.walls.push({ x1, y1, x2, y2, bounce, color, isSlingshot, points, flash: 0 });
        };

        // 1. Top Curved Arch (Smoothly guides ball from right shooter lane `x=408` over the top to `x=16`)
        const archCx = 212;
        const archCy = 205;
        const archRx = 196;
        const archRy = 188;
        const steps = 28;
        for (let i = 0; i < steps; i++) {
            const a1 = Math.PI + (i / steps) * Math.PI;
            const a2 = Math.PI + ((i + 1) / steps) * Math.PI;
            const x1 = archCx + Math.cos(a1) * archRx;
            const y1 = archCy + Math.sin(a1) * archRy;
            const x2 = archCx + Math.cos(a2) * archRx;
            const y2 = archCy + Math.sin(a2) * archRy;
            addWall(x1, y1, x2, y2, 0.8, '#ef4444');
        }

        // 2. Outer Left Wall & Outer Right Shooter Wall
        addWall(16, 205, 16, 545, 0.75, '#ef4444');
        addWall(408, 205, 408, 675, 0.75, '#ef4444');
        // Shooter Lane Bottom Floor
        addWall(374, 675, 408, 675, 0.5, '#fbbf24');

        // 3. Shooter Lane Inner Divider Wall (with top opening above y=125)
        addWall(374, 130, 374, 675, 0.75, '#b91c1c');

        // 4. Right Playfield Guide Wall (keeps ball inside main table once it exits shooter lane)
        addWall(374, 130, 358, 215, 0.8, '#ef4444');
        addWall(358, 215, 364, 545, 0.75, '#ef4444');

        // 5. Left & Right Inlane Guides (Feed ball directly to the flippers!)
        // Left Inlane funnel
        addWall(16, 545, 112, 632, 0.65, '#f59e0b');
        addWall(48, 445, 48, 535, 0.75, '#ef4444');
        addWall(48, 535, 112, 592, 0.65, '#ef4444');

        // Right Inlane funnel
        addWall(364, 545, 268, 632, 0.65, '#f59e0b');
        addWall(332, 445, 332, 535, 0.75, '#ef4444');
        addWall(332, 535, 268, 592, 0.65, '#ef4444');

        // 6. Left Triangular Slingshot (High-energy kicker above left flipper)
        addWall(72, 445, 72, 530, 0.85, '#ec4899');
        addWall(72, 530, 122, 568, 0.85, '#ec4899');
        addWall(72, 445, 122, 568, 1.55, '#38bdf8', true, 250); // Kicker face!

        // 7. Right Triangular Slingshot (High-energy kicker above right flipper)
        addWall(308, 445, 308, 530, 0.85, '#ec4899');
        addWall(308, 530, 258, 568, 0.85, '#ec4899');
        addWall(308, 445, 258, 568, 1.55, '#38bdf8', true, 250); // Kicker face!

        // 8. Upper Left & Right Side Bumpers / Deflectors
        addWall(16, 330, 46, 375, 1.15, '#a855f7', true, 150);
        addWall(360, 330, 334, 375, 1.15, '#a855f7', true, 150);

        // 9. Corner Posts (Prevent ball from sticking on sharp vertices)
        const postCoords = [
            { x: 374, y: 130, r: 5 },
            { x: 48,  y: 445, r: 5 },
            { x: 332, y: 445, r: 5 },
            { x: 72,  y: 445, r: 6 },
            { x: 72,  y: 530, r: 6 },
            { x: 122, y: 568, r: 6 },
            { x: 308, y: 445, r: 6 },
            { x: 308, y: 530, r: 6 },
            { x: 258, y: 568, r: 6 },
            // WAGMI lane divider pegs
            { x: 119, y: 88,  r: 5 },
            { x: 166, y: 80,  r: 5 },
            { x: 214, y: 80,  r: 5 },
            { x: 261, y: 88,  r: 5 }
        ];
        this.posts = postCoords;
    }

    spawnPlungerBall() {
        this.balls.push({
            x: 391,
            y: 645,
            vx: 0,
            vy: 0,
            r: 10.5,
            inShooter: true,
            trail: []
        });
        document.getElementById('launchLabel').textContent = 'LAUNCH';
    }

    spawnMultiball() {
        if (this.balls.length >= 3) return;
        this.balls.push({
            x: 190 + (Math.random() - 0.5) * 30,
            y: 125,
            vx: (Math.random() - 0.5) * 260,
            vy: 150,
            r: 10.5,
            inShooter: false,
            trail: []
        });
        this.shieldTimer = Math.max(this.shieldTimer, 10);
    }

    restartGame() {
        this.score = 0;
        this.multiplier = 1;
        this.ballNumber = 1;
        this.jackpotMeter = 0;
        this.jackpotLit = true;
        this.shieldTimer = 0;
        this.gameState = 'PLAYING';
        this.balls = [];
        this.particles = [];
        this.popups = [];
        this.wagmiLanes.forEach(l => l.lit = false);
        this.dropTargets.forEach(t => t.hit = false);
        this.spawnPlungerBall();
        this.showBanner('NEW GAME!', 'HOLD LAUNCH TO FIRE', 2.5);
        this.updateHUD();
    }

    showBanner(text, sub = '', dur = 2.0) {
        this.banner = { text, sub, timer: dur };
    }

    addScore(pts, x, y, color = '#fde047') {
        const total = pts * this.multiplier;
        this.score += total;
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            try { localStorage.setItem('rugPinballBest', String(this.bestScore)); } catch (e) {}
        }
        if (x !== undefined && y !== undefined) {
            this.popups.push({
                x, y,
                text: `+${total.toLocaleString()}`,
                color,
                alpha: 1.0,
                vy: -45
            });
        }
        this.updateHUD();
    }

    spawnSparks(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 50 + Math.random() * 190;
            this.particles.push({
                x, y,
                vx: Math.cos(a) * spd,
                vy: Math.sin(a) * spd,
                color,
                alpha: 1,
                size: 2.5 + Math.random() * 3.5
            });
        }
    }

    updateHUD() {
        document.getElementById('scoreVal').textContent = this.score.toLocaleString();
        document.getElementById('bestVal').textContent = this.bestScore.toLocaleString();
        document.getElementById('multVal').textContent = `${this.multiplier}X`;
        document.getElementById('ballVal').textContent = `${this.ballNumber}/${this.maxBalls}`;
    }

    bindEvents() {
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnLaunch = document.getElementById('btnLaunch');
        const btnRestart = document.getElementById('btnRestart');

        const setLeft = (state) => {
            if (state && !this.leftHeld) this.sfx.flipper();
            this.leftHeld = state;
            btnLeft.classList.toggle('touch-active', state);
        };

        const setRight = (state) => {
            if (state && !this.rightHeld) this.sfx.flipper();
            this.rightHeld = state;
            btnRight.classList.toggle('touch-active', state);
        };

        const startLaunch = () => {
            this.sfx.init();
            if (this.gameState === 'GAMEOVER') {
                this.restartGame();
                return;
            }
            const shooterBall = this.balls.find(b => b.x > 372 && b.y > 560);
            if (shooterBall) {
                this.plungerPulling = true;
                btnLaunch.classList.add('plunger-active');
            } else {
                // Table Nudge when ball is already in play!
                this.shake = 0.18;
                this.balls.forEach(b => {
                    b.vx += (Math.random() - 0.5) * 110;
                    b.vy -= 55;
                });
                this.showBanner('TABLE NUDGE!', '', 0.7);
            }
        };

        const releaseLaunch = () => {
            btnLaunch.classList.remove('plunger-active');
            if (!this.plungerPulling) return;
            this.plungerPulling = false;

            const shooterBall = this.balls.find(b => b.x > 372 && b.y > 540);
            if (shooterBall) {
                const power = Math.max(0.45, this.plungerCharge);
                shooterBall.vy = -(760 + power * 480);
                shooterBall.vx = (Math.random() - 0.5) * 15;
                this.sfx.launch();
                this.shieldTimer = Math.max(this.shieldTimer, 10.0); // 10s Rug Shield Ball Saver
                document.getElementById('launchLabel').textContent = 'NUDGE';
            }
            this.plungerCharge = 0;
        };

        // Button Touch & Mouse Listeners
        const bindHold = (el, onDown, onUp) => {
            el.addEventListener('touchstart', (e) => {
                if (e.cancelable) e.preventDefault();
                this.sfx.init();
                onDown();
            }, { passive: false });
            el.addEventListener('touchend', (e) => {
                if (e.cancelable) e.preventDefault();
                onUp();
            }, { passive: false });
            el.addEventListener('touchcancel', () => onUp());
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                this.sfx.init();
                onDown();
            });
            window.addEventListener('mouseup', () => onUp());
        };

        bindHold(btnLeft, () => setLeft(true), () => setLeft(false));
        bindHold(btnRight, () => setRight(true), () => setRight(false));
        bindHold(btnLaunch, startLaunch, releaseLaunch);

        // Also allow tapping Left/Right side of the Canvas directly!
        this.canvas.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            this.sfx.init();
            if (this.gameState === 'GAMEOVER') {
                this.restartGame();
                return;
            }
            const rect = this.canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const relX = (t.clientX - rect.left) / rect.width;
                const relY = (t.clientY - rect.top) / rect.height;
                if (relX > 0.84 && relY > 0.65) {
                    startLaunch();
                } else if (relX < 0.5) {
                    setLeft(true);
                } else {
                    setRight(true);
                }
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            if (e.cancelable) e.preventDefault();
            if (this.plungerPulling) releaseLaunch();
            if (e.touches.length === 0) {
                setLeft(false);
                setRight(false);
            }
        }, { passive: false });

        this.canvas.addEventListener('click', () => {
            if (this.gameState === 'GAMEOVER') {
                this.sfx.init();
                this.restartGame();
            }
        });

        btnRestart.addEventListener('click', () => {
            this.sfx.init();
            this.restartGame();
        });

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            this.sfx.init();
            if (['KeyA', 'ArrowLeft'].includes(e.code)) setLeft(true);
            if (['KeyD', 'ArrowRight'].includes(e.code)) setRight(true);
            if (['Space', 'ArrowDown', 'Enter'].includes(e.code) && !e.repeat) startLaunch();
        });
        window.addEventListener('keyup', (e) => {
            if (['KeyA', 'ArrowLeft'].includes(e.code)) setLeft(false);
            if (['KeyD', 'ArrowRight'].includes(e.code)) setRight(false);
            if (['Space', 'ArrowDown', 'Enter'].includes(e.code)) releaseLaunch();
        });
    }

    /* ========================================================================
       PHYSICS & COLLISION ENGINE (12 Substeps per Frame)
       ======================================================================== */
    update(dt) {
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
        if (this.banner.timer > 0) this.banner.timer = Math.max(0, this.banner.timer - dt);
        if (this.shieldTimer > 0) this.shieldTimer = Math.max(0, this.shieldTimer - dt);

        this.vortex.spin += dt * 4.5;
        this.bumpers.forEach(b => { if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - dt * 5); });
        this.walls.forEach(w => { if (w.flash > 0) w.flash = Math.max(0, w.flash - dt * 5); });
        this.dropTargets.forEach(t => { if (t.flash > 0) t.flash = Math.max(0, t.flash - dt * 5); });

        // Update Plunger Pull
        if (this.plungerPulling) {
            this.plungerCharge = Math.min(1.0, this.plungerCharge + dt * 1.35);
        }

        if (this.gameState !== 'PLAYING') return;

        // Sub-stepped Physics
        const SUBSTEPS = 12;
        const sdt = dt / SUBSTEPS;
        const GRAVITY = 560;

        for (let step = 0; step < SUBSTEPS; step++) {
            // 1. Update Flippers
            this.flippers.forEach(f => {
                f.prevAngle = f.angle;
                const pressed = (f.side === 'left') ? this.leftHeld : this.rightHeld;
                const target = pressed ? f.activeAngle : f.restAngle;
                const speed = pressed ? 26 : 16;
                const diff = target - f.angle;
                const stepAngle = Math.sign(diff) * Math.min(Math.abs(diff), speed * sdt);
                f.angle += stepAngle;
                f.omega = (f.angle - f.prevAngle) / sdt;
            });

            // 2. Update Balls
            for (let bIdx = this.balls.length - 1; bIdx >= 0; bIdx--) {
                const ball = this.balls[bIdx];

                // Gravity & Damping
                ball.vy += GRAVITY * sdt;
                ball.vx *= Math.pow(0.996, sdt * 60);
                ball.vy *= Math.pow(0.996, sdt * 60);

                // Cap max speed so it stays readable and never tunnels
                const maxSpd = 1280;
                const curSpd = Math.hypot(ball.vx, ball.vy);
                if (curSpd > maxSpd) {
                    ball.vx = (ball.vx / curSpd) * maxSpd;
                    ball.vy = (ball.vy / curSpd) * maxSpd;
                }

                ball.x += ball.vx * sdt;
                ball.y += ball.vy * sdt;

                // Track if ball has exited shooter lane into main playfield
                if (ball.inShooter && ball.x < 362) {
                    ball.inShooter = false;
                }

                // One-Way Gate at Top of Shooter Lane (Prevents ball from going back into shooter lane)
                if (!ball.inShooter && ball.x > 362 && ball.y < 145 && ball.vx > 0) {
                    ball.x = 362;
                    ball.vx = -Math.abs(ball.vx) * 0.7;
                }

                // A. Collide with Static Walls & Slingshots
                for (let i = 0; i < this.walls.length; i++) {
                    const w = this.walls[i];
                    this.resolveLineCollision(ball, w);
                }

                // B. Collide with Active Drop Targets ("R-U-G")
                for (let i = 0; i < this.dropTargets.length; i++) {
                    const t = this.dropTargets[i];
                    if (!t.hit && this.resolveLineCollision(ball, { x1: t.x1, y1: t.y1, x2: t.x2, y2: t.y2, bounce: 1.15 })) {
                        t.hit = true;
                        t.flash = 1.0;
                        this.sfx.targetHit();
                        this.addScore(750, (t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, '#facc15');
                        this.spawnSparks((t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, '#facc15', 14);

                        // Check if all R-U-G targets are knocked down
                        if (this.dropTargets.every(dt => dt.hit)) {
                            this.jackpotLit = true;
                            this.shieldTimer = Math.max(this.shieldTimer, 12.0);
                            this.addScore(5000, 90, 140, '#4ade80');
                            this.showBanner('R-U-G CLEARED!', 'JACKPOT LIT + RUG SHIELD!', 2.2);
                            this.sfx.jackpot();
                            setTimeout(() => {
                                this.dropTargets.forEach(dt => dt.hit = false);
                            }, 1200);
                        }
                    }
                }

                // C. Collide with Corner Posts
                for (let i = 0; i < this.posts.length; i++) {
                    const p = this.posts[i];
                    this.resolveCircleCollision(ball, p.x, p.y, p.r, 0.8);
                }

                // D. Center Rug Shield Post (Between Flippers when active!)
                if (this.shieldTimer > 0) {
                    if (this.resolveCircleCollision(ball, 190, 646, 13, 1.45)) {
                        ball.vy = -Math.max(460, Math.abs(ball.vy));
                        this.sfx.shieldSave();
                        this.spawnSparks(190, 646, '#22d3ee', 12);
                        this.addScore(250, 190, 625, '#22d3ee');
                    }
                }

                // E. Collide with Character Pop Bumpers (Otter, Chad, Hailey)
                for (let i = 0; i < this.bumpers.length; i++) {
                    const b = this.bumpers[i];
                    const dx = ball.x - b.x;
                    const dy = ball.y - b.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = ball.r + b.r;
                    if (dist < minDist) {
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);
                        ball.x = b.x + nx * (minDist + 1);
                        ball.y = b.y + ny * (minDist + 1);

                        // High-energy pop bumper kick
                        const kickSpeed = 520;
                        ball.vx = nx * kickSpeed + (Math.random() - 0.5) * 60;
                        ball.vy = ny * kickSpeed + (Math.random() - 0.5) * 60;

                        b.pulse = 1.0;
                        this.shake = 0.14;
                        this.sfx.bumper(b.pitch);
                        this.addScore(b.points, b.x, b.y - b.r, b.ringColor);
                        this.spawnSparks(ball.x, ball.y, b.color, 15);
                        this.showBanner(b.callout, `${b.name} +${b.points * this.multiplier}`, 1.1);

                        // Charge Jackpot Meter
                        this.jackpotMeter = Math.min(100, this.jackpotMeter + 12);
                        if (this.jackpotMeter >= 100 && !this.jackpotLit) {
                            this.jackpotLit = true;
                            this.showBanner('JACKPOT READY!', 'HIT THE TOP RIGHT VORTEX!', 2.0);
                        }
                    }
                }

                // F. Collide with Flippers
                for (let i = 0; i < this.flippers.length; i++) {
                    this.resolveFlipperCollision(ball, this.flippers[i]);
                }
            }
        }

        // Sensor Checks (Once per frame per ball)
        for (let bIdx = this.balls.length - 1; bIdx >= 0; bIdx--) {
            const ball = this.balls[bIdx];

            // Record Trail
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 8) ball.trail.shift();

            // 1. W-A-G-M-I Rollover Lanes
            this.wagmiLanes.forEach(lane => {
                if (Math.hypot(ball.x - lane.x, ball.y - lane.y) < ball.r + lane.r) {
                    if (!lane.lit) {
                        lane.lit = true;
                        this.sfx.rollover();
                        this.addScore(300, lane.x, lane.y, '#38bdf8');
                        this.spawnSparks(lane.x, lane.y, '#38bdf8', 10);

                        if (this.wagmiLanes.every(l => l.lit)) {
                            this.multiplier = Math.min(10, this.multiplier + 1);
                            this.shieldTimer = Math.max(this.shieldTimer, 12.0);
                            this.addScore(3500, 190, 95, '#facc15');
                            this.sfx.jackpot();
                            this.showBanner(`WAGMI MULTIBALL!`, `MULTIPLIER UP TO ${this.multiplier}X!`, 2.6);
                            this.spawnMultiball();
                            setTimeout(() => {
                                this.wagmiLanes.forEach(l => l.lit = false);
                            }, 900);
                        }
                    }
                }
            });

            // 2. Jackpot Vortex Sensor
            if (Math.hypot(ball.x - this.vortex.x, ball.y - this.vortex.y) < ball.r + this.vortex.r * 0.75) {
                if (this.jackpotLit) {
                    this.jackpotLit = false;
                    this.jackpotMeter = 0;
                    this.sfx.jackpot();
                    this.shake = 0.35;
                    this.addScore(10000, this.vortex.x, this.vortex.y, '#4ade80');
                    this.spawnSparks(this.vortex.x, this.vortex.y, '#4ade80', 26);
                    this.showBanner('MEGA RUG JACKPOT!', '10,000 PTS + MULTIBALL!', 2.5);
                    this.spawnMultiball();
                } else {
                    this.sfx.rollover();
                    this.addScore(1000, this.vortex.x, this.vortex.y, '#a855f7');
                }
                // Eject ball out of vortex
                ball.x = this.vortex.x - 18;
                ball.y = this.vortex.y + 18;
                ball.vx = -320;
                ball.vy = 260;
            }

            // 3. Bottom Drain Check
            if (ball.y > this.H + 20) {
                if (this.shieldTimer > 0 && this.balls.length === 1) {
                    // Auto-Save Ball!
                    ball.x = 391;
                    ball.y = 580;
                    ball.vx = (Math.random() - 0.5) * 20;
                    ball.vy = -1080;
                    ball.inShooter = true;
                    this.sfx.shieldSave();
                    this.showBanner('RUG SHIELD SAVE!', 'BALL AUTO-LAUNCHED!', 1.8);
                } else {
                    this.balls.splice(bIdx, 1);
                    if (this.balls.length === 0) {
                        this.sfx.drain();
                        if (this.ballNumber < this.maxBalls) {
                            this.ballNumber++;
                            this.spawnPlungerBall();
                            this.showBanner(`BALL ${this.ballNumber}`, 'PULL LAUNCH TO SHOOT', 2.0);
                            this.updateHUD();
                        } else {
                            this.gameState = 'GAMEOVER';
                            this.updateHUD();
                        }
                    }
                }
            }
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha -= dt * 1.9;
            if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        // Update Score Popups
        for (let i = this.popups.length - 1; i >= 0; i--) {
            const pop = this.popups[i];
            pop.y += pop.vy * dt;
            pop.alpha -= dt * 1.1;
            if (pop.alpha <= 0) this.popups.splice(i, 1);
        }
    }

    resolveLineCollision(ball, w) {
        const abx = w.x2 - w.x1;
        const aby = w.y2 - w.y1;
        const apx = ball.x - w.x1;
        const apy = ball.y - w.y1;
        const abLenSq = abx * abx + aby * aby;
        if (abLenSq === 0) return false;

        let t = (apx * abx + apy * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));

        const closestX = w.x1 + t * abx;
        const closestY = w.y1 + t * aby;

        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.r) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            // Push ball out of wall
            ball.x = closestX + nx * (ball.r + 0.4);
            ball.y = closestY + ny * (ball.r + 0.4);

            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                const restitution = w.bounce || 0.75;
                ball.vx -= (1 + restitution) * vn * nx;
                ball.vy -= (1 + restitution) * vn * ny;

                if (w.isSlingshot) {
                    // Extra slingshot kick boost
                    ball.vx += nx * 210;
                    ball.vy += ny * 210;
                    w.flash = 1.0;
                    this.sfx.slingshot();
                    this.addScore(w.points || 200, closestX, closestY, '#38bdf8');
                    this.spawnSparks(closestX, closestY, w.color, 8);
                }
            }
            return true;
        }
        return false;
    }

    resolveCircleCollision(ball, cx, cy, cr, bounce = 0.8) {
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.r + cr;
        if (dist < minDist) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            ball.x = cx + nx * (minDist + 0.4);
            ball.y = cy + ny * (minDist + 0.4);
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                ball.vx -= (1 + bounce) * vn * nx;
                ball.vy -= (1 + bounce) * vn * ny;
            }
            return true;
        }
        return false;
    }

    resolveFlipperCollision(ball, f) {
        const cos = Math.cos(f.angle);
        const sin = Math.sin(f.angle);
        const tipX = f.x + cos * f.length;
        const tipY = f.y + sin * f.length;

        const abx = tipX - f.x;
        const aby = tipY - f.y;
        const apx = ball.x - f.x;
        const apy = ball.y - f.y;
        const abLenSq = abx * abx + aby * aby;

        let t = (apx * abx + apy * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));

        const closestX = f.x + t * abx;
        const closestY = f.y + t * aby;

        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.r + f.radius;

        if (dist < minDist) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            ball.x = closestX + nx * (minDist + 0.6);
            ball.y = closestY + ny * (minDist + 0.6);

            // Tangential velocity of flipper at contact point (r = t * f.length)
            const r = t * f.length;
            const flpVx = -sin * (f.omega * r);
            const flpVy =  cos * (f.omega * r);

            const relVx = ball.vx - flpVx;
            const relVy = ball.vy - flpVy;
            const relVn = relVx * nx + relVy * ny;

            if (relVn < 0) {
                const bounce = 0.55;
                ball.vx -= (1 + bounce) * relVn * nx;
                ball.vy -= (1 + bounce) * relVn * ny;

                // If flipper is actively swinging up, transfer crisp arcade shot impulse
                if (Math.abs(f.omega) > 1.5) {
                    ball.vx += flpVx * 0.55 + (f.side === 'left' ? 45 : -45);
                    ball.vy += flpVy * 0.55 - 260 * (0.45 + 0.55 * t);
                }
            }
        }
    }

    /* ========================================================================
       RENDER PLAYFIELD, PIXEL ART BUMPERS, EFFECTS & UI
       ======================================================================== */
    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.W, this.H);

        ctx.save();
        if (this.shake > 0) {
            ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
        }

        // 1. Cyber Arcade Grid Background
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.07)';
        ctx.lineWidth = 1;
        for (let x = 20; x < this.W; x += 28) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.H); ctx.stroke();
        }
        for (let y = 20; y < this.H; y += 28) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.W, y); ctx.stroke();
        }

        // 2. Center Table Art & Jackpot Progress Ring
        ctx.save();
        ctx.translate(190, 445);
        ctx.beginPath();
        ctx.arc(0, 0, 52, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 10, 24, 0.85)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.35)';
        ctx.stroke();

        // Jackpot Meter Arc
        ctx.beginPath();
        ctx.arc(0, 0, 52, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2) * (this.jackpotLit ? 1 : this.jackpotMeter / 100));
        ctx.strokeStyle = this.jackpotLit ? '#4ade80' : '#facc15';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = '900 13px Orbitron';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText('RUG ARENA', 0, -8);
        ctx.font = '700 10px Orbitron';
        ctx.fillStyle = this.jackpotLit ? '#4ade80' : '#f43f5e';
        ctx.fillText(this.jackpotLit ? 'JACKPOT LIT!' : `METER ${this.jackpotMeter}%`, 0, 8);
        ctx.font = '900 12px Orbitron';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`${this.multiplier}X MULT`, 0, 26);
        ctx.restore();

        // 3. Draw Upper "W-A-G-M-I" Rollover Lanes
        this.wagmiLanes.forEach(lane => {
            ctx.save();
            ctx.translate(lane.x, lane.y);
            ctx.beginPath();
            ctx.arc(0, 0, lane.r, 0, Math.PI * 2);
            ctx.fillStyle = lane.lit ? 'rgba(56, 189, 248, 0.3)' : 'rgba(15, 23, 42, 0.85)';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = lane.lit ? '#38bdf8' : '#475569';
            ctx.stroke();

            ctx.font = '900 12px Orbitron';
            ctx.fillStyle = lane.lit ? '#ffffff' : '#64748b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(lane.letter, 0, 1);
            ctx.restore();
        });

        // 4. Draw Jackpot Vortex (Upper Right)
        ctx.save();
        ctx.translate(this.vortex.x, this.vortex.y);
        ctx.rotate(this.vortex.spin);
        ctx.beginPath();
        ctx.arc(0, 0, this.vortex.r, 0, Math.PI * 2);
        ctx.fillStyle = this.jackpotLit ? 'rgba(74, 222, 128, 0.22)' : 'rgba(168, 85, 247, 0.18)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 5]);
        ctx.strokeStyle = this.jackpotLit ? '#4ade80' : '#a855f7';
        ctx.stroke();
        ctx.restore();

        ctx.font = '900 9px Orbitron';
        ctx.fillStyle = this.jackpotLit ? '#4ade80' : '#c084fc';
        ctx.textAlign = 'center';
        ctx.fillText(this.jackpotLit ? 'JACKPOT!' : 'VORTEX', this.vortex.x, this.vortex.y + 3);

        // 5. Draw "R-U-G" Drop Targets
        this.dropTargets.forEach(t => {
            ctx.save();
            ctx.lineWidth = t.hit ? 2 : 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = t.hit ? 'rgba(100, 116, 139, 0.35)' : (t.flash > 0 ? '#ffffff' : '#facc15');
            ctx.beginPath();
            ctx.moveTo(t.x1, t.y1);
            ctx.lineTo(t.x2, t.y2);
            ctx.stroke();

            const mx = (t.x1 + t.x2) / 2 + 12;
            const my = (t.y1 + t.y2) / 2 + 6;
            ctx.font = '900 10px Orbitron';
            ctx.fillStyle = t.hit ? '#475569' : '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText(t.label, mx, my);
            ctx.restore();
        });

        // 6. Draw Static Walls & Slingshots
        this.walls.forEach(w => {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(w.x1, w.y1);
            ctx.lineTo(w.x2, w.y2);
            ctx.lineWidth = w.isSlingshot ? 4.5 : 3.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = w.flash > 0 ? '#ffffff' : w.color;
            if (w.isSlingshot || w.flash > 0) {
                ctx.shadowColor = w.color;
                ctx.shadowBlur = 10;
            }
            ctx.stroke();
            ctx.restore();
        });

        // 7. Draw Posts
        this.posts.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = '#f87171';
            ctx.fill();
        });

        // 8. Draw Center "RUG SHIELD" Ball Saver Post (Between Flippers)
        ctx.save();
        ctx.translate(190, 646);
        const shieldActive = this.shieldTimer > 0;
        const blink = shieldActive && (this.shieldTimer > 3 || Math.floor(this.shieldTimer * 6) % 2 === 0);
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fillStyle = blink ? 'rgba(34, 211, 238, 0.3)' : 'rgba(30, 41, 59, 0.5)';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = blink ? '#22d3ee' : '#334155';
        ctx.stroke();
        ctx.font = '900 7px Orbitron';
        ctx.fillStyle = blink ? '#67e8f9' : '#475569';
        ctx.textAlign = 'center';
        ctx.fillText(shieldActive ? 'SHIELD' : 'OFF', 0, 2.5);
        ctx.restore();

        // 9. Draw THE 3 CHARACTER PIXEL-ART POP BUMPERS (Otter, Chad, Hailey)
        this.bumpers.forEach(b => {
            ctx.save();
            const scale = 1 + b.pulse * 0.18;
            ctx.translate(b.x, b.y);
            ctx.scale(scale, scale);

            // Outer Glowing Arcade Ring
            ctx.beginPath();
            ctx.arc(0, 0, b.r, 0, Math.PI * 2);
            ctx.fillStyle = '#090d16';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = b.pulse > 0 ? '#ffffff' : b.ringColor;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = b.pulse > 0 ? 22 : 12;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Clip Circular Portrait & Draw Crisp Pixel Art Sprite
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, b.r - 3, 0, Math.PI * 2);
            ctx.clip();

            // Character Background Tint
            ctx.fillStyle = b.id === 'otter' ? '#bae6fd' : (b.id === 'chad' ? '#ffffff' : '#ea580c');
            ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);

            const spr = this.sprites[b.id];
            if (spr) {
                const drawSize = (b.r - 2) * 1.85;
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(spr, -drawSize / 2, -drawSize / 2 + 2, drawSize, drawSize);
            }
            ctx.restore();

            // Character Name Tag Pill
            ctx.fillStyle = 'rgba(9, 10, 15, 0.9)';
            ctx.strokeStyle = b.color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(-28, b.r - 7, 56, 13, 4);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 7.5px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.id.toUpperCase(), 0, b.r - 0.5);

            ctx.restore();
        });

        // 10. Draw Plunger Spring in Shooter Lane
        const pullOffset = this.plungerCharge * 38;
        ctx.save();
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(381, 656 + pullOffset * 0.4, 20, 6);
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(391, 662 + pullOffset * 0.4);
        ctx.lineTo(391, 675);
        ctx.stroke();
        ctx.restore();

        // 11. Draw Flippers
        this.flippers.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.angle);

            ctx.fillStyle = '#facc15';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.roundRect(-f.radius, -f.radius, f.length + f.radius * 1.8, f.radius * 2, f.radius);
            ctx.fill();
            ctx.stroke();

            // Pivot Cap
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#090a0f';
            ctx.fill();
            ctx.restore();
        });

        // 12. Draw Pinballs & Motion Trails
        this.balls.forEach(ball => {
            for (let i = 0; i < ball.trail.length; i++) {
                const tr = ball.trail[i];
                const ratio = (i + 1) / ball.trail.length;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, ball.r * ratio * 0.75, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(56, 189, 248, ${ratio * 0.28})`;
                ctx.fill();
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 2, ball.x, ball.y, ball.r);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.6, '#e2e8f0');
            grad.addColorStop(1, '#64748b');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.restore();
        });

        // 13. Draw Sparks & Floating Score Popups
        this.particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1;

        this.popups.forEach(pop => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, pop.alpha);
            ctx.font = '900 12px Orbitron';
            ctx.fillStyle = pop.color;
            ctx.textAlign = 'center';
            ctx.fillText(pop.text, pop.x, pop.y);
            ctx.restore();
        });

        // 14. Dynamic Callout Banner
        if (this.banner.timer > 0 && this.gameState === 'PLAYING') {
            ctx.save();
            ctx.fillStyle = 'rgba(9, 10, 15, 0.85)';
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(55, 345, 270, 44, 10);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 13px Orbitron';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText(this.banner.text, 190, 365);

            if (this.banner.sub) {
                ctx.font = '700 10px Rajdhani';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(this.banner.sub, 190, 381);
            }
            ctx.restore();
        }

        // 15. Game Over Overlay
        if (this.gameState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.88)';
            ctx.fillRect(0, 0, this.W, this.H);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(20, 10, 18, 0.96)';
            ctx.beginPath();
            ctx.roundRect(45, 250, 330, 210, 18);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 26px Orbitron';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', this.W / 2, 305);

            ctx.font = '700 15px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`SCORE: ${this.score.toLocaleString()}`, this.W / 2, 348);

            ctx.font = '700 13px Orbitron';
            ctx.fillStyle = '#facc15';
            ctx.fillText(`BEST: ${this.bestScore.toLocaleString()}`, this.W / 2, 376);

            ctx.font = '900 13px Orbitron';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('TAP TABLE OR LAUNCH TO PLAY AGAIN', this.W / 2, 425);
        }

        ctx.restore();
    }

    loop(now) {
        const dt = Math.min(0.04, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.addEventListener('DOMContentLoaded', () => {
    window.pinballGame = new RugPinballMachine();
});
</script>
