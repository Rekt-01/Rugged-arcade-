<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RUG PINBALL - ARCADE EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #050508;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        .mk-panel {
            background: rgba(15, 10, 15, 0.92);
            border: 2px solid rgba(220, 38, 38, 0.75);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }
        .mk-btn {
            background: linear-gradient(135deg, rgba(153, 27, 27, 0.55), rgba(69, 10, 10, 0.75));
            border: 2px solid rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.06s, background 0.12s;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .mk-btn:active, .touch-active {
            transform: scale(0.93);
            background: rgba(220, 38, 38, 0.9);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
        }
        .mk-launch-btn {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.65), rgba(120, 53, 15, 0.85));
            border: 2px solid #fbbf24;
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.45);
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .mk-launch-btn:active, .launch-active {
            transform: scale(0.93);
            background: rgba(245, 158, 11, 0.95);
            box-shadow: 0 0 28px rgba(251, 191, 36, 0.95);
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="app-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP HUD BAR -->
    <header id="topHud" class="relative z-10 w-full max-w-xl px-3 pt-2 pointer-events-none">
        <div class="flex items-center justify-between gap-2 mk-panel rounded-xl px-3 py-2 pointer-events-auto">
            <div class="flex items-center gap-3">
                <div>
                    <div class="text-[9px] text-slate-400 font-bold leading-none">SCORE</div>
                    <div id="scoreText" class="font-orbitron text-sm sm:text-base font-black text-amber-400">0</div>
                </div>
                <div>
                    <div class="text-[9px] text-slate-400 font-bold leading-none">BEST</div>
                    <div id="bestText" class="font-orbitron text-xs sm:text-sm font-black text-rose-400">0</div>
                </div>
                <div class="bg-slate-950 border border-cyan-500/60 rounded px-2 py-0.5 text-center">
                    <div class="text-[8px] text-cyan-300 font-bold leading-none">MULT</div>
                    <div id="multText" class="font-orbitron text-xs font-black text-cyan-400">1X</div>
                </div>
                <div class="bg-slate-950 border border-amber-500/60 rounded px-2 py-0.5 text-center">
                    <div class="text-[8px] text-amber-300 font-bold leading-none">BALL</div>
                    <div id="ballText" class="font-orbitron text-xs font-black text-amber-300">1/3</div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <a href="main.html" class="mk-btn rounded-lg px-2.5 py-1.5 font-orbitron text-[10px] font-black text-rose-200 no-underline">
                    EXIT
                </a>
                <button id="btnReset" type="button" class="mk-btn rounded-lg px-2.5 py-1.5 font-orbitron text-[10px] font-black text-amber-200">
                    RESET
                </button>
            </div>
        </div>
    </header>

    <!-- BOTTOM FLIPPER & LAUNCH CONTROLS -->
    <footer id="bottomHud" class="relative z-10 w-full max-w-xl px-3 pb-3 pt-1 flex items-center justify-between gap-2.5 pointer-events-none">
        <button id="btnLeft" type="button" class="mk-btn flex-1 h-14 sm:h-16 rounded-2xl flex flex-col items-center justify-center pointer-events-auto">
            <span class="font-orbitron text-sm sm:text-base font-black text-white">&#9664; LEFT FLIP</span>
            <span class="text-[10px] text-rose-300 font-bold">TAP / HOLD</span>
        </button>

        <button id="btnLaunch" type="button" class="mk-launch-btn w-28 sm:w-32 h-14 sm:h-16 rounded-2xl flex flex-col items-center justify-center pointer-events-auto">
            <span id="launchText" class="font-orbitron text-xs sm:text-sm font-black text-amber-200">FIRE BALL</span>
            <span class="text-[9px] text-amber-100 font-bold">TAP OR HOLD</span>
        </button>

        <button id="btnRight" type="button" class="mk-btn flex-1 h-14 sm:h-16 rounded-2xl flex flex-col items-center justify-center pointer-events-auto">
            <span class="font-orbitron text-sm sm:text-base font-black text-white">RIGHT FLIP &#9654;</span>
            <span class="text-[10px] text-rose-300 font-bold">TAP / HOLD</span>
        </button>
    </footer>
</div>

<script>
function drawBox(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
}

const PALETTE = {
    'K': '#090a0f', 'W': '#ffffff', 'Y': '#facc15', 'V': '#172554',
    'N': '#6b4226', 'C': '#0ea5e9', 'M': '#f5deb3', 'B': '#1d4ed8',
    'R': '#ef4444', 'S': '#eac096', 'T': '#c49668', 'G': '#94a3b8',
    'P': '#db2777', 'O': '#f97316', 'A': '#cbd5e1'
};

const OTTER_GRID = [
    "....KKKKKKKK....",
    "..KKWWWWWWWWKK..",
    ".KWWWWWWYWWWWWK.",
    ".KWWWWWYYYWWWWK.",
    ".KVVVVVYYYVVVVK.",
    ".KYYYYYYYYYYYYK.",
    "KKNNNNKKKKKKKKKK",
    "KNNNNNCCKNNNCCK.",
    ".KNNNNNNMMNNNNK.",
    ".KNNNMMMMMMMMMK.",
    ".KNNMMKKMMKKMMK.",
    "..KNNNNMMMMMMMK.",
    "..KNNNMMMMMMMK..",
    ".KNNNNMMMMMMMNK.",
    "KNNNNNMMMMMMMNNK",
    "KNNNNNMMMMMMMNNK"
];

const CHAD_GRID = [
    ".....KKKKKK.....",
    "...KKBBBBWWKK...",
    "..KBWBBWBWRRRK..",
    ".KBBWBWBWBRWWRK.",
    "KKKBBBBBBBBRRRRK",
    "KWWKSSSSSSSSSSK.",
    "KRRKKKKKKKKKKKK.",
    ".KKKSSKKGGKKGGKK",
    "..KTSSKKGGKKGGKK",
    "..KTSSKKKKKKSSK.",
    "...KSSSSSSPPSSK.",
    "..KKRKKKKKKKKRKK",
    ".KRRRRKSSSSKRRRR",
    ".KBBBBKORWROKWRW",
    ".KBBBBKORRROKRRR",
    ".KBBBBKOWWWOKWWW"
];

const HAILEY_GRID = [
    "....KKKKKKKK....",
    "..KKNNNNNNNNKK..",
    ".KNNYNNNNNNNNNK.",
    "KNNNYNNNNNNNNNNK",
    "KNNNKSSSSSSSSSK.",
    "KNNNKWWWWWWWWWWK",
    "KNNNKTWWCCWWRRWK",
    "KNNNKSSWWWWWWWWK",
    ".KNNKSSSSSSSSSKG",
    ".KNNKSSSSPPPOOWR",
    "..KKKSSSSSSKKK..",
    ".KWWAKKKKKKAWWK.",
    "KWAWWKYYYYKWWAK.",
    "KRRRRKYKKYKRRRRK",
    "KRRRRKYYYYKRRRRK",
    "KRRRRKYKKYKRRRRK"
];

function createPixelSprite(grid, scale = 3) {
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = 16 * scale;
    const ctx = c.getContext('2d');
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        for (let col = 0; col < row.length; col++) {
            const color = PALETTE[row[col]];
            if (color) {
                ctx.fillStyle = color;
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    tone(freq, endFreq, dur, type = 'square', vol = 0.14, delay = 0) {
        if (!this.ctx) return;
        try {
            const t0 = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + dur);
            g.gain.setValueAtTime(vol, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur);
        } catch (e) {}
    }
    flip() { this.tone(190, 340, 0.055, 'triangle', 0.15); }
    launch() { this.tone(140, 720, 0.22, 'sawtooth', 0.18); }
    bumper(p = 1) {
        this.tone(350 * p, 760 * p, 0.09, 'square', 0.16);
        this.tone(160 * p, 80, 0.1, 'sawtooth', 0.12);
    }
    sling() { this.tone(520, 240, 0.08, 'sawtooth', 0.14); }
    lane() { this.tone(680, 1020, 0.08, 'sine', 0.13); }
    jackpot() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => {
            this.tone(f, f * 1.12, 0.13, 'square', 0.15, i * 0.065);
        });
    }
    drain() {
        [240, 180, 130, 85].forEach((f, i) => {
            this.tone(f, f * 0.75, 0.18, 'sawtooth', 0.16, i * 0.09);
        });
    }
}

class RugPinballGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        this.TW = 420;
        this.TH = 690;

        this.sprites = {
            otter: createPixelSprite(OTTER_GRID, 3),
            chad: createPixelSprite(CHAD_GRID, 3),
            hailey: createPixelSprite(HAILEY_GRID, 3)
        };

        this.bestScore = 0;
        try {
            this.bestScore = parseInt(localStorage.getItem('rugPinballBestV3') || '0', 10) || 0;
        } catch (e) {}

        this.score = 0;
        this.multiplier = 1;
        this.ballNum = 1;
        this.maxBalls = 3;
        this.jackpotMeter = 0;
        this.jackpotLit = true;
        this.shieldTimer = 0;
        this.shake = 0;
        this.gameState = 'PLAYING';

        this.leftHeld = false;
        this.rightHeld = false;
        this.plungerPulling = false;
        this.plungerCharge = 0;

        this.flippers = [
            { side: 'left',  x: 112, y: 612, length: 68, r: 8, rest: 0.44, active: -0.52, angle: 0.44, omega: 0 },
            { side: 'right', x: 272, y: 612, length: 68, r: 8, rest: Math.PI - 0.44, active: Math.PI + 0.52, angle: Math.PI - 0.44, omega: 0 }
        ];

        this.bumpers = [
            { id: 'otter',  name: 'CAPTAIN OTTER',   callout: 'ANCHOR SMASH!', x: 192, y: 205, r: 34, color: '#38bdf8', ring: '#facc15', pts: 500, pitch: 1.0,  pulse: 0 },
            { id: 'chad',   name: 'CHAD',            callout: 'GIGA PUMP!',    x: 118, y: 292, r: 30, color: '#ef4444', ring: '#3b82f6', pts: 400, pitch: 1.2,  pulse: 0 },
            { id: 'hailey', name: 'PRINCESS HAILEY', callout: '3D SMOKE!',     x: 266, y: 292, r: 30, color: '#ec4899', ring: '#facc15', pts: 400, pitch: 1.35, pulse: 0 }
        ];

        this.wagmi = [
            { ch: 'W', x: 96,  y: 78, r: 13, lit: false },
            { ch: 'A', x: 144, y: 64, r: 13, lit: false },
            { ch: 'G', x: 192, y: 58, r: 13, lit: false },
            { ch: 'M', x: 240, y: 64, r: 13, lit: false },
            { ch: 'I', x: 288, y: 78, r: 13, lit: false }
        ];

        this.targets = [
            { ch: 'R', x1: 34, y1: 210, x2: 46, y2: 178, hit: false, flash: 0 },
            { ch: 'U', x1: 50, y1: 172, x2: 66, y2: 142, hit: false, flash: 0 },
            { ch: 'G', x1: 70, y1: 136, x2: 90, y2: 110, hit: false, flash: 0 }
        ];

        this.vortex = { x: 322, y: 185, r: 20, spin: 0 };

        this.walls = [];
        this.posts = [];
        this.balls = [];
        this.particles = [];
        this.popups = [];
        this.banner = { text: 'TAP FIRE BALL TO SHOOT!', sub: 'LIGHT W-A-G-M-I FOR MULTIBALL', timer: 4.0 };

        this.buildWalls();
        this.spawnBallInShooter();
        this.handleResize();
        this.updateHUD();
        this.bindControls();

        window.addEventListener('resize', () => this.handleResize());

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    handleResize() {
        this.screenW = window.innerWidth;
        this.screenH = window.innerHeight;
        this.canvas.width = this.screenW;
        this.canvas.height = this.screenH;
    }

    buildWalls() {
        this.walls = [];
        const add = (x1, y1, x2, y2, bounce = 0.75, color = '#ef4444', sling = false, pts = 0) => {
            this.walls.push({ x1, y1, x2, y2, bounce, color, sling, pts, flash: 0 });
        };

        // 1. High Top Curved Arch: starts at y=140 and rises all the way to y=14!
        // This leaves a huge 100px+ opening above the shooter lane divider (y=185)
        const cx = 210, cy = 140, rx = 196, ry = 126, steps = 28;
        for (let i = 0; i < steps; i++) {
            const a1 = Math.PI + (i / steps) * Math.PI;
            const a2 = Math.PI + ((i + 1) / steps) * Math.PI;
            add(
                cx + Math.cos(a1) * rx, cy + Math.sin(a1) * ry,
                cx + Math.cos(a2) * rx, cy + Math.sin(a2) * ry,
                0.8, '#ef4444'
            );
        }

        // 2. Outer Left Wall & Outer Right Shooter Wall
        add(14, 140, 14, 530, 0.75, '#ef4444');
        add(406, 140, 406, 655, 0.75, '#ef4444');
        add(370, 655, 406, 655, 0.5, '#fbbf24'); // Plunger floor

        // 3. Single Clean Shooter Lane Inner Wall (Stops at y=185 so top is wide open!)
        add(370, 185, 370, 655, 0.75, '#b91c1c');

        // 4. Wide Left & Right Inlane Ramps (Feed directly to Left & Right Flippers)
        add(14, 530, 112, 612, 0.65, '#f59e0b');
        add(370, 530, 272, 612, 0.65, '#f59e0b');

        // 5. Left Triangular Slingshot (Leaves a wide 44px lane on the left)
        add(58, 445, 58, 515, 0.85, '#ec4899');
        add(58, 515, 114, 560, 0.85, '#ec4899');
        add(58, 445, 114, 560, 1.5, '#38bdf8', true, 250);

        // 6. Right Triangular Slingshot (Leaves a wide 44px lane on the right)
        add(326, 445, 326, 515, 0.85, '#ec4899');
        add(326, 515, 270, 560, 0.85, '#ec4899');
        add(326, 445, 270, 560, 1.5, '#38bdf8', true, 250);

        // 7. Mid-Side Neon Kickers
        add(14, 320, 42, 365, 1.2, '#a855f7', true, 150);
        add(370, 320, 342, 365, 1.2, '#a855f7', true, 150);

        // Corner Posts
        this.posts = [
            { x: 370, y: 185, r: 5 },
            { x: 58,  y: 445, r: 5 },
            { x: 58,  y: 515, r: 5 },
            { x: 114, y: 560, r: 5 },
            { x: 326, y: 445, r: 5 },
            { x: 326, y: 515, r: 5 },
            { x: 270, y: 560, r: 5 }
        ];
    }

    spawnBallInShooter() {
        this.balls.push({
            x: 388,
            y: 625,
            vx: 0,
            vy: 0,
            r: 10,
            inShooter: true,
            stallTimer: 0,
            trail: []
        });
        const lbl = document.getElementById('launchText');
        if (lbl) lbl.textContent = 'FIRE BALL';
    }

    spawnMultiball() {
        if (this.balls.length >= 3) return;
        this.balls.push({
            x: 192 + (Math.random() - 0.5) * 35,
            y: 120,
            vx: (Math.random() - 0.5) * 280,
            vy: 160,
            r: 10,
            inShooter: false,
            stallTimer: 0,
            trail: []
        });
        this.shieldTimer = Math.max(this.shieldTimer, 10);
    }

    firePlunger() {
        const shooterBall = this.balls.find(b => b.inShooter || (b.x > 368 && b.y > 500));
        if (shooterBall) {
            const pwr = Math.max(0.75, this.plungerCharge);
            // Strong upward launch velocity guaranteed to reach the top arch
            shooterBall.x = 388;
            shooterBall.vy = -(960 + pwr * 320);
            shooterBall.vx = 0;
            this.sfx.launch();
            this.shieldTimer = Math.max(this.shieldTimer, 10.0);
            const lbl = document.getElementById('launchText');
            if (lbl) lbl.textContent = 'NUDGE';
        }
        this.plungerPulling = false;
        this.plungerCharge = 0;
    }

    restartMatch() {
        this.score = 0;
        this.multiplier = 1;
        this.ballNum = 1;
        this.jackpotMeter = 0;
        this.jackpotLit = true;
        this.shieldTimer = 0;
        this.gameState = 'PLAYING';
        this.balls = [];
        this.particles = [];
        this.popups = [];
        this.wagmi.forEach(w => w.lit = false);
        this.targets.forEach(t => t.hit = false);
        this.spawnBallInShooter();
        this.showBanner('NEW GAME!', 'TAP FIRE BALL TO SHOOT', 2.5);
        this.updateHUD();
    }

    showBanner(text, sub = '', dur = 2.0) {
        this.banner = { text, sub, timer: dur };
    }

    addScore(pts, x, y, color = '#fde047') {
        const gain = pts * this.multiplier;
        this.score += gain;
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            try { localStorage.setItem('rugPinballBestV3', String(this.bestScore)); } catch (e) {}
        }
        if (x !== undefined && y !== undefined) {
            this.popups.push({ x, y, text: `+${gain.toLocaleString()}`, color, alpha: 1.0, vy: -45 });
        }
        this.updateHUD();
    }

    spawnSparks(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 50 + Math.random() * 190;
            this.particles.push({
                x, y,
                vx: Math.cos(a) * spd,
                vy: Math.sin(a) * spd,
                color,
                alpha: 1,
                size: 2.5 + Math.random() * 3.5
            });
        }
    }

    updateHUD() {
        document.getElementById('scoreText').textContent = this.score.toLocaleString();
        document.getElementById('bestText').textContent = this.bestScore.toLocaleString();
        document.getElementById('multText').textContent = `${this.multiplier}X`;
        document.getElementById('ballText').textContent = `${this.ballNum}/${this.maxBalls}`;
    }

    bindControls() {
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnLaunch = document.getElementById('btnLaunch');
        const btnReset = document.getElementById('btnReset');

        const setLeft = (val) => {
            if (val && !this.leftHeld) this.sfx.flip();
            this.leftHeld = val;
            btnLeft.classList.toggle('touch-active', val);
        };
        const setRight = (val) => {
            if (val && !this.rightHeld) this.sfx.flip();
            this.rightHeld = val;
            btnRight.classList.toggle('touch-active', val);
        };

        const startLaunch = () => {
            this.sfx.init();
            if (this.gameState === 'GAMEOVER') {
                this.restartMatch();
                return;
            }
            const shooterBall = this.balls.find(b => b.inShooter || (b.x > 368 && b.y > 500));
            if (shooterBall) {
                this.plungerPulling = true;
                this.plungerCharge = 0.8;
                btnLaunch.classList.add('launch-active');
            } else {
                this.shake = 0.18;
                this.balls.forEach(b => {
                    b.vx += (Math.random() - 0.5) * 120;
                    b.vy -= 65;
                });
                this.showBanner('TABLE NUDGE!', '', 0.7);
            }
        };

        const endLaunch = () => {
            btnLaunch.classList.remove('launch-active');
            if (this.plungerPulling) {
                this.firePlunger();
            }
        };

        const bindBtn = (el, down, up) => {
            el.addEventListener('touchstart', (e) => {
                if (e.cancelable) e.preventDefault();
                this.sfx.init();
                down();
            }, { passive: false });
            el.addEventListener('touchend', (e) => {
                if (e.cancelable) e.preventDefault();
                up();
            }, { passive: false });
            el.addEventListener('touchcancel', () => up());
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                this.sfx.init();
                down();
            });
            el.addEventListener('mouseup', () => up());
        };

        bindBtn(btnLeft, () => setLeft(true), () => setLeft(false));
        bindBtn(btnRight, () => setRight(true), () => setRight(false));
        bindBtn(btnLaunch, startLaunch, endLaunch);

        this.canvas.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            this.sfx.init();
            if (this.gameState === 'GAMEOVER') {
                this.restartMatch();
                return;
            }
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const shooterBall = this.balls.find(b => b.inShooter || (b.x > 368 && b.y > 500));
                if (shooterBall && t.clientX > this.screenW * 0.72) {
                    startLaunch();
                } else if (t.clientX < this.screenW * 0.5) {
                    setLeft(true);
                } else {
                    setRight(true);
                }
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            if (e.cancelable) e.preventDefault();
            if (this.plungerPulling) endLaunch();
            if (e.touches.length === 0) {
                setLeft(false);
                setRight(false);
            }
        }, { passive: false });

        this.canvas.addEventListener('click', () => {
            if (this.gameState === 'GAMEOVER') {
                this.sfx.init();
                this.restartMatch();
            }
        });

        btnReset.addEventListener('click', () => {
            this.sfx.init();
            this.restartMatch();
        });

        window.addEventListener('keydown', (e) => {
            this.sfx.init();
            if (['ArrowLeft', 'KeyA'].includes(e.code)) setLeft(true);
            if (['ArrowRight', 'KeyD'].includes(e.code)) setRight(true);
            if (['Space', 'ArrowDown', 'Enter'].includes(e.code) && !e.repeat) startLaunch();
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) setLeft(false);
            if (['ArrowRight', 'KeyD'].includes(e.code)) setRight(false);
            if (['Space', 'ArrowDown', 'Enter'].includes(e.code)) endLaunch();
        });
    }

    update(dt) {
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
        if (this.banner.timer > 0) this.banner.timer = Math.max(0, this.banner.timer - dt);
        if (this.shieldTimer > 0) this.shieldTimer = Math.max(0, this.shieldTimer - dt);

        this.vortex.spin += dt * 4.5;
        this.bumpers.forEach(b => { if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - dt * 5); });
        this.walls.forEach(w => { if (w.flash > 0) w.flash = Math.max(0, w.flash - dt * 5); });
        this.targets.forEach(t => { if (t.flash > 0) t.flash = Math.max(0, t.flash - dt * 5); });

        if (this.plungerPulling) {
            this.plungerCharge = Math.min(1.0, this.plungerCharge + dt * 1.2);
        }

        if (this.gameState !== 'PLAYING') return;

        const SUBSTEPS = 12;
        const sdt = dt / SUBSTEPS;
        const GRAVITY = 520;

        for (let step = 0; step < SUBSTEPS; step++) {
            // Flippers
            this.flippers.forEach(f => {
                const prev = f.angle;
                const pressed = (f.side === 'left') ? this.leftHeld : this.rightHeld;
                const target = pressed ? f.active : f.rest;
                const speed = pressed ? 26 : 16;
                const diff = target - f.angle;
                f.angle += Math.sign(diff) * Math.min(Math.abs(diff), speed * sdt);
                f.omega = (f.angle - prev) / sdt;
            });

            // Balls
            for (let bIdx = this.balls.length - 1; bIdx >= 0; bIdx--) {
                const ball = this.balls[bIdx];

                ball.vy += GRAVITY * sdt;
                ball.vx *= Math.pow(0.997, sdt * 60);
                ball.vy *= Math.pow(0.997, sdt * 60);

                const spd = Math.hypot(ball.vx, ball.vy);
                if (spd > 1300) {
                    ball.vx = (ball.vx / spd) * 1300;
                    ball.vy = (ball.vy / spd) * 1300;
                }

                ball.x += ball.vx * sdt;
                ball.y += ball.vy * sdt;

                // GUARANTEED SHOOTER LANE EXIT CURVE:
                // As soon as the launched ball reaches the top of the shooter chute (y < 155),
                // smoothly curve it left out of the chute across the top arch!
                if (ball.inShooter && ball.y < 155) {
                    ball.vx = -380 - Math.random() * 90;
                    ball.vy = -140;
                    ball.x = 355;
                    ball.inShooter = false;
                }

                if (ball.inShooter && ball.x < 362) {
                    ball.inShooter = false;
                }

                // ONE-WAY GATE: Once in playfield, ball can never re-enter the shooter lane (x > 360)
                if (!ball.inShooter && ball.x > 360 - ball.r) {
                    ball.x = 360 - ball.r;
                    if (ball.vx > 0) {
                        ball.vx = -Math.abs(ball.vx) * 0.75;
                    }
                }

                // Walls & Slingshots
                for (let i = 0; i < this.walls.length; i++) {
                    this.collideLine(ball, this.walls[i]);
                }

                // R-U-G Drop Targets
                for (let i = 0; i < this.targets.length; i++) {
                    const t = this.targets[i];
                    if (!t.hit && this.collideLine(ball, { x1: t.x1, y1: t.y1, x2: t.x2, y2: t.y2, bounce: 1.15 })) {
                        t.hit = true;
                        t.flash = 1.0;
                        this.sfx.lane();
                        this.addScore(750, (t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, '#facc15');
                        this.spawnSparks((t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2, '#facc15', 14);

                        if (this.targets.every(tg => tg.hit)) {
                            this.jackpotLit = true;
                            this.shieldTimer = Math.max(this.shieldTimer, 12.0);
                            this.addScore(5000, 90, 140, '#4ade80');
                            this.showBanner('R-U-G CLEARED!', 'JACKPOT LIT + RUG SHIELD!', 2.2);
                            this.sfx.jackpot();
                            setTimeout(() => { this.targets.forEach(tg => tg.hit = false); }, 1200);
                        }
                    }
                }

                // Posts
                for (let i = 0; i < this.posts.length; i++) {
                    const p = this.posts[i];
                    this.collideCircle(ball, p.x, p.y, p.r, 0.8);
                }

                // Center Shield Post
                if (this.shieldTimer > 0) {
                    if (this.collideCircle(ball, 192, 626, 13, 1.45)) {
                        ball.vy = -Math.max(480, Math.abs(ball.vy));
                        this.sfx.lane();
                        this.spawnSparks(192, 626, '#22d3ee', 12);
                        this.addScore(250, 192, 605, '#22d3ee');
                    }
                }

                // Character Pop Bumpers
                for (let i = 0; i < this.bumpers.length; i++) {
                    const b = this.bumpers[i];
                    const dx = ball.x - b.x;
                    const dy = ball.y - b.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = ball.r + b.r;
                    if (dist < minDist) {
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);
                        ball.x = b.x + nx * (minDist + 1);
                        ball.y = b.y + ny * (minDist + 1);

                        ball.vx = nx * 520 + (Math.random() - 0.5) * 60;
                        ball.vy = ny * 520 + (Math.random() - 0.5) * 60;

                        b.pulse = 1.0;
                        this.shake = 0.14;
                        this.sfx.bumper(b.pitch);
                        this.addScore(b.pts, b.x, b.y - b.r, b.ring);
                        this.spawnSparks(ball.x, ball.y, b.color, 15);
                        this.showBanner(b.callout, `${b.name} +${b.pts * this.multiplier}`, 1.1);

                        this.jackpotMeter = Math.min(100, this.jackpotMeter + 12);
                        if (this.jackpotMeter >= 100 && !this.jackpotLit) {
                            this.jackpotLit = true;
                            this.showBanner('JACKPOT READY!', 'SHOOT THE RIGHT VORTEX!', 2.0);
                        }
                    }
                }

                // Flippers
                for (let i = 0; i < this.flippers.length; i++) {
                    this.collideFlipper(ball, this.flippers[i]);
                }
            }
        }

        // Sensors, Anti-Stall & Drain Check
        for (let bIdx = this.balls.length - 1; bIdx >= 0; bIdx--) {
            const ball = this.balls[bIdx];

            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 8) ball.trail.shift();

            // Anti-Stall Protection: if ball ever stops moving on playfield, kick it free
            if (!ball.inShooter && Math.hypot(ball.vx, ball.vy) < 25) {
                ball.stallTimer = (ball.stallTimer || 0) + dt;
                if (ball.stallTimer > 0.35) {
                    ball.vx = (Math.random() - 0.5) * 240;
                    ball.vy = -260;
                    ball.stallTimer = 0;
                }
            } else {
                ball.stallTimer = 0;
            }

            // WAGMI Top Rollovers
            this.wagmi.forEach(lane => {
                if (Math.hypot(ball.x - lane.x, ball.y - lane.y) < ball.r + lane.r) {
                    if (!lane.lit) {
                        lane.lit = true;
                        this.sfx.lane();
                        this.addScore(300, lane.x, lane.y, '#38bdf8');
                        this.spawnSparks(lane.x, lane.y, '#38bdf8', 10);

                        if (this.wagmi.every(l => l.lit)) {
                            this.multiplier = Math.min(10, this.multiplier + 1);
                            this.shieldTimer = Math.max(this.shieldTimer, 12.0);
                            this.addScore(3500, 192, 85, '#facc15');
                            this.sfx.jackpot();
                            this.showBanner('WAGMI MULTIBALL!', `MULTIPLIER UP TO ${this.multiplier}X!`, 2.6);
                            this.spawnMultiball();
                            setTimeout(() => { this.wagmi.forEach(l => l.lit = false); }, 900);
                        }
                    }
                }
            });

            // Vortex Pocket
            if (Math.hypot(ball.x - this.vortex.x, ball.y - this.vortex.y) < ball.r + this.vortex.r * 0.75) {
                if (this.jackpotLit) {
                    this.jackpotLit = false;
                    this.jackpotMeter = 0;
                    this.sfx.jackpot();
                    this.shake = 0.35;
                    this.addScore(10000, this.vortex.x, this.vortex.y, '#4ade80');
                    this.spawnSparks(this.vortex.x, this.vortex.y, '#4ade80', 26);
                    this.showBanner('MEGA RUG JACKPOT!', '10,000 PTS + MULTIBALL!', 2.5);
                    this.spawnMultiball();
                } else {
                    this.sfx.lane();
                    this.addScore(1000, this.vortex.x, this.vortex.y, '#a855f7');
                }
                ball.x = this.vortex.x - 20;
                ball.y = this.vortex.y + 20;
                ball.vx = -320;
                ball.vy = 260;
            }

            // Bottom Drain
            if (ball.y > this.TH + 15) {
                if (this.shieldTimer > 0 && this.balls.length === 1) {
                    ball.x = 192;
                    ball.y = 580;
                    ball.vx = (Math.random() - 0.5) * 220;
                    ball.vy = -780;
                    ball.inShooter = false;
                    this.sfx.launch();
                    this.showBanner('RUG SHIELD SAVE!', 'BALL SAVED!', 1.8);
                } else {
                    this.balls.splice(bIdx, 1);
                    if (this.balls.length === 0) {
                        this.sfx.drain();
                        if (this.ballNum < this.maxBalls) {
                            this.ballNum++;
                            this.spawnBallInShooter();
                            this.showBanner(`BALL ${this.ballNum}`, 'TAP FIRE BALL TO SHOOT', 2.0);
                            this.updateHUD();
                        } else {
                            this.gameState = 'GAMEOVER';
                            this.updateHUD();
                        }
                    }
                }
            }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha -= dt * 1.9;
            if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.popups.length - 1; i >= 0; i--) {
            const pop = this.popups[i];
            pop.y += pop.vy * dt;
            pop.alpha -= dt * 1.1;
            if (pop.alpha <= 0) this.popups.splice(i, 1);
        }
    }

    collideLine(ball, w) {
        const abx = w.x2 - w.x1;
        const aby = w.y2 - w.y1;
        const apx = ball.x - w.x1;
        const apy = ball.y - w.y1;
        const abLenSq = abx * abx + aby * aby;
        if (abLenSq === 0) return false;

        let t = (apx * abx + apy * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = w.x1 + t * abx;
        const cy = w.y1 + t * aby;
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.r) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            ball.x = cx + nx * (ball.r + 0.5);
            ball.y = cy + ny * (ball.r + 0.5);

            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                const bounce = w.bounce || 0.75;
                ball.vx -= (1 + bounce) * vn * nx;
                ball.vy -= (1 + bounce) * vn * ny;

                if (w.sling) {
                    ball.vx += nx * 220;
                    ball.vy += ny * 220;
                    w.flash = 1.0;
                    this.sfx.sling();
                    this.addScore(w.pts || 200, cx, cy, '#38bdf8');
                    this.spawnSparks(cx, cy, w.color, 8);
                }
            }
            return true;
        }
        return false;
    }

    collideCircle(ball, cx, cy, cr, bounce = 0.8) {
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.r + cr;
        if (dist < minDist) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            ball.x = cx + nx * (minDist + 0.5);
            ball.y = cy + ny * (minDist + 0.5);
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
                ball.vx -= (1 + bounce) * vn * nx;
                ball.vy -= (1 + bounce) * vn * ny;
            }
            return true;
        }
        return false;
    }

    collideFlipper(ball, f) {
        const cos = Math.cos(f.angle);
        const sin = Math.sin(f.angle);
        const tipX = f.x + cos * f.length;
        const tipY = f.y + sin * f.length;

        const abx = tipX - f.x;
        const aby = tipY - f.y;
        const apx = ball.x - f.x;
        const apy = ball.y - f.y;
        const abLenSq = abx * abx + aby * aby;

        let t = (apx * abx + apy * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = f.x + t * abx;
        const cy = f.y + t * aby;
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.r + f.r;

        if (dist < minDist) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            ball.x = cx + nx * (minDist + 0.6);
            ball.y = cy + ny * (minDist + 0.6);

            const r = t * f.length;
            const flpVx = -sin * (f.omega * r);
            const flpVy =  cos * (f.omega * r);

            const relVx = ball.vx - flpVx;
            const relVy = ball.vy - flpVy;
            const relVn = relVx * nx + relVy * ny;

            if (relVn < 0) {
                ball.vx -= 1.55 * relVn * nx;
                ball.vy -= 1.55 * relVn * ny;
                if (Math.abs(f.omega) > 1.5) {
                    ball.vx += flpVx * 0.55 + (f.side === 'left' ? 45 : -45);
                    ball.vy += flpVy * 0.55 - 280 * (0.45 + 0.55 * t);
                }
            }
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, this.screenW, this.screenH);

        const topEl = document.getElementById('topHud');
        const botEl = document.getElementById('bottomHud');
        const topH = topEl ? topEl.offsetHeight + 6 : 64;
        const botH = botEl ? botEl.offsetHeight + 6 : 78;

        const availW = Math.max(200, this.screenW - 16);
        const availH = Math.max(200, this.screenH - topH - botH);

        const scale = Math.min(availW / this.TW, availH / this.TH);
        const offsetX = (this.screenW - this.TW * scale) / 2;
        const offsetY = topH + (availH - this.TH * scale) / 2;

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        if (this.shake > 0) {
            ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
        }

        // 1. Table Playfield Base
        ctx.fillStyle = '#09040e';
        drawBox(ctx, 4, 4, this.TW - 8, this.TH - 8, 22);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
        ctx.stroke();

        // Grid
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.08)';
        ctx.lineWidth = 1;
        for (let x = 28; x < this.TW - 20; x += 28) {
            ctx.beginPath(); ctx.moveTo(x, 16); ctx.lineTo(x, this.TH - 16); ctx.stroke();
        }
        for (let y = 28; y < this.TH - 20; y += 28) {
            ctx.beginPath(); ctx.moveTo(16, y); ctx.lineTo(this.TW - 16, y); ctx.stroke();
        }

        // 2. Center Jackpot Ring
        ctx.save();
        ctx.translate(192, 430);
        ctx.beginPath();
        ctx.arc(0, 0, 50, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 10, 24, 0.9)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.35)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 50, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2) * (this.jackpotLit ? 1 : this.jackpotMeter / 100));
        ctx.strokeStyle = this.jackpotLit ? '#4ade80' : '#facc15';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = '900 12px Orbitron';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText('RUG PINBALL', 0, -8);
        ctx.font = '700 10px Orbitron';
        ctx.fillStyle = this.jackpotLit ? '#4ade80' : '#f43f5e';
        ctx.fillText(this.jackpotLit ? 'JACKPOT LIT!' : `METER ${this.jackpotMeter}%`, 0, 8);
        ctx.font = '900 12px Orbitron';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`${this.multiplier}X MULT`, 0, 25);
        ctx.restore();

        // 3. WAGMI Top Lanes
        this.wagmi.forEach(lane => {
            ctx.save();
            ctx.translate(lane.x, lane.y);
            ctx.beginPath();
            ctx.arc(0, 0, lane.r, 0, Math.PI * 2);
            ctx.fillStyle = lane.lit ? 'rgba(56, 189, 248, 0.32)' : 'rgba(15, 23, 42, 0.85)';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = lane.lit ? '#38bdf8' : '#475569';
            ctx.stroke();

            ctx.font = '900 12px Orbitron';
            ctx.fillStyle = lane.lit ? '#ffffff' : '#64748b';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(lane.ch, 0, 1);
            ctx.restore();
        });

        // 4. Jackpot Vortex
        ctx.save();
        ctx.translate(this.vortex.x, this.vortex.y);
        ctx.rotate(this.vortex.spin);
        ctx.beginPath();
        ctx.arc(0, 0, this.vortex.r, 0, Math.PI * 2);
        ctx.fillStyle = this.jackpotLit ? 'rgba(74, 222, 128, 0.24)' : 'rgba(168, 85, 247, 0.18)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 5]);
        ctx.strokeStyle = this.jackpotLit ? '#4ade80' : '#a855f7';
        ctx.stroke();
        ctx.restore();

        ctx.font = '900 9px Orbitron';
        ctx.fillStyle = this.jackpotLit ? '#4ade80' : '#c084fc';
        ctx.textAlign = 'center';
        ctx.fillText(this.jackpotLit ? 'JACKPOT!' : 'VORTEX', this.vortex.x, this.vortex.y + 3);

        // 5. R-U-G Drop Targets
        this.targets.forEach(t => {
            ctx.save();
            ctx.lineWidth = t.hit ? 2 : 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = t.hit ? 'rgba(100, 116, 139, 0.35)' : (t.flash > 0 ? '#ffffff' : '#facc15');
            ctx.beginPath();
            ctx.moveTo(t.x1, t.y1);
            ctx.lineTo(t.x2, t.y2);
            ctx.stroke();

            ctx.font = '900 10px Orbitron';
            ctx.fillStyle = t.hit ? '#475569' : '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText(t.ch, (t.x1 + t.x2) / 2 + 12, (t.y1 + t.y2) / 2 + 6);
            ctx.restore();
        });

        // 6. Table Walls & Slingshots
        this.walls.forEach(w => {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(w.x1, w.y1);
            ctx.lineTo(w.x2, w.y2);
            ctx.lineWidth = w.sling ? 4.5 : 3.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = w.flash > 0 ? '#ffffff' : w.color;
            ctx.stroke();
            ctx.restore();
        });

        // 7. Posts
        this.posts.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = '#f87171';
            ctx.fill();
        });

        // 8. Center Rug Shield Post
        ctx.save();
        ctx.translate(192, 626);
        const shieldOn = this.shieldTimer > 0;
        const blink = shieldOn && (this.shieldTimer > 3 || Math.floor(this.shieldTimer * 6) % 2 === 0);
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fillStyle = blink ? 'rgba(34, 211, 238, 0.3)' : 'rgba(30, 41, 59, 0.5)';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = blink ? '#22d3ee' : '#334155';
        ctx.stroke();
        ctx.font = '900 7px Orbitron';
        ctx.fillStyle = blink ? '#67e8f9' : '#475569';
        ctx.textAlign = 'center';
        ctx.fillText(shieldOn ? 'SHIELD' : 'OFF', 0, 2.5);
        ctx.restore();

        // 9. Character Pop Bumpers (Captain Otter, Chad, Princess Hailey)
        this.bumpers.forEach(b => {
            ctx.save();
            const sc = 1 + b.pulse * 0.18;
            ctx.translate(b.x, b.y);
            ctx.scale(sc, sc);

            ctx.beginPath();
            ctx.arc(0, 0, b.r, 0, Math.PI * 2);
            ctx.fillStyle = '#090d16';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = b.pulse > 0 ? '#ffffff' : b.ring;
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, b.r - 3, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = b.id === 'otter' ? '#bae6fd' : (b.id === 'chad' ? '#ffffff' : '#ea580c');
            ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);

            const spr = this.sprites[b.id];
            if (spr) {
                const sz = (b.r - 2) * 1.85;
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(spr, -sz / 2, -sz / 2 + 2, sz, sz);
            }
            ctx.restore();

            ctx.fillStyle = 'rgba(9, 10, 15, 0.92)';
            ctx.strokeStyle = b.color;
            ctx.lineWidth = 1.5;
            drawBox(ctx, -28, b.r - 7, 56, 13, 4);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 7.5px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.id.toUpperCase(), 0, b.r - 0.5);
            ctx.restore();
        });

        // 10. Plunger Spring
        const pull = this.plungerCharge * 32;
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(378, 636 + pull * 0.4, 20, 6);
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(388, 642 + pull * 0.4);
        ctx.lineTo(388, 655);
        ctx.stroke();

        // 11. Flippers
        this.flippers.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.angle);

            ctx.fillStyle = '#facc15';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            drawBox(ctx, -f.r, -f.r, f.length + f.r * 1.8, f.r * 2, f.r);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#090a0f';
            ctx.fill();
            ctx.restore();
        });

        // 12. Pinballs
        this.balls.forEach(ball => {
            for (let i = 0; i < ball.trail.length; i++) {
                const tr = ball.trail[i];
                const ratio = (i + 1) / ball.trail.length;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, ball.r * ratio * 0.75, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(56, 189, 248, ${ratio * 0.28})`;
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();
        });

        // 13. Particles & Popups
        this.particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1;

        this.popups.forEach(pop => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, pop.alpha);
            ctx.font = '900 12px Orbitron';
            ctx.fillStyle = pop.color;
            ctx.textAlign = 'center';
            ctx.fillText(pop.text, pop.x, pop.y);
            ctx.restore();
        });

        // 14. Status Callout Banner
        if (this.banner.timer > 0 && this.gameState === 'PLAYING') {
            ctx.save();
            ctx.fillStyle = 'rgba(9, 10, 15, 0.88)';
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            drawBox(ctx, 57, 338, 270, 44, 10);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 13px Orbitron';
            ctx.fillStyle = '#fde047';
            ctx.textAlign = 'center';
            ctx.fillText(this.banner.text, 192, 358);

            if (this.banner.sub) {
                ctx.font = '700 10px Rajdhani';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(this.banner.sub, 192, 374);
            }
            ctx.restore();
        }

        // 15. Game Over Overlay
        if (this.gameState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.88)';
            ctx.fillRect(0, 0, this.TW, this.TH);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(20, 10, 18, 0.96)';
            drawBox(ctx, 45, 240, 330, 210, 18);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 26px Orbitron';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', this.TW / 2, 295);

            ctx.font = '700 15px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`SCORE: ${this.score.toLocaleString()}`, this.TW / 2, 338);

            ctx.font = '700 13px Orbitron';
            ctx.fillStyle = '#facc15';
            ctx.fillText(`BEST: ${this.bestScore.toLocaleString()}`, this.TW / 2, 366);

            ctx.font = '900 13px Orbitron';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('TAP SCREEN OR FIRE BALL TO RETRY', this.TW / 2, 415);
        }

        ctx.restore();
    }

    loop(now) {
        const dt = Math.min(0.04, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.onload = () => new RugPinballGame();
</script>
