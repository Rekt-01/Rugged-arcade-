<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RUG PINBALL - ARCADE EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #050508;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 6px;
        }
        canvas {
            display: block;
            background: #090a0f;
            border: 2px solid rgba(220, 38, 38, 0.6);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.25);
            border-radius: 12px;
            image-rendering: pixelated;
        }
        #orientation-warning {
            position: fixed;
            inset: 0;
            background: #050508;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
        .mk-panel {
            background: rgba(15, 10, 15, 0.95);
            border: 2px solid rgba(185, 28, 28, 0.7);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
            backdrop-filter: blur(8px);
        }
        .mk-btn {
            background: linear-gradient(135deg, rgba(153, 27, 27, 0.5), rgba(69, 10, 10, 0.7));
            border: 2px solid rgba(239, 68, 68, 0.85);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.06s;
        }
        .mk-btn:active, .touch-active {
            transform: scale(0.92);
            background: rgba(220, 38, 38, 0.9);
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="orientation-warning">
    <div class="font-orbitron text-2xl sm:text-4xl font-black text-rose-500 mb-3 tracking-wider">ROTATE DEVICE TO LANDSCAPE</div>
    <p class="text-slate-300 text-sm sm:text-base max-w-md">Rug Pinball requires landscape orientation to view the full arcade table.</p>
</div>

<div id="app-wrapper">
    <!-- TOP HUD BAR -->
    <header class="w-full max-w-2xl px-2 pt-1 flex items-center justify-between mk-panel rounded-xl py-1.5 z-10">
        <div class="flex items-center gap-3 text-xs font-orbitron font-black text-amber-400">
            <div>SCORE: <span id="scoreVal" class="text-white">0</span></div>
            <div>MULT: <span id="multVal" class="text-rose-400">1x</span></div>
            <div>BALL: <span id="ballVal" class="text-amber-200">1/3</span></div>
        </div>
        <div class="flex items-center gap-2">
            <a href="main.html" class="mk-btn rounded-lg px-3 py-1 font-orbitron text-[10px] font-black text-rose-200 tracking-wider">EXIT</a>
            <button id="btnNew" type="button" class="mk-btn rounded-lg px-3 py-1 font-orbitron text-[10px] font-black text-amber-200 tracking-wider">NEW GAME</button>
        </div>
    </header>

    <!-- PINBALL CANVAS AREA -->
    <div class="relative flex-1 flex items-center justify-center w-full overflow-hidden my-1">
        <canvas id="pinballCanvas"></canvas>
    </div>

    <!-- BOTTOM ARCADE FLIPPER CONTROLS -->
    <footer class="w-full max-w-2xl px-2 pb-1 flex items-center justify-between gap-4 z-10">
        <button id="btnLeft" type="button" class="mk-btn flex-1 py-3 rounded-2xl flex flex-col items-center justify-center font-orbitron font-black text-white text-sm">
            <span>LEFT FLIPPER</span>
            <span class="text-[10px] text-amber-400 font-normal">[ A / LEFT ]</span>
        </button>
        <button id="btnLaunch" type="button" class="mk-btn w-32 py-3 rounded-2xl flex flex-col items-center justify-center font-orbitron font-black text-amber-300 text-xs border-amber-500">
            <span>PLUNGER</span>
            <span class="text-[9px] text-slate-300 font-normal">[ HOLD SPACE ]</span>
        </button>
        <button id="btnRight" type="button" class="mk-btn flex-1 py-3 rounded-2xl flex flex-col items-center justify-center font-orbitron font-black text-white text-sm">
            <span>RIGHT FLIPPER</span>
            <span class="text-[10px] text-amber-400 font-normal">[ D / RIGHT ]</span>
        </button>
    </footer>
</div>

<script>
class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    tone(freq, endFreq, dur, type = 'square', vol = 0.12) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        } catch (e) {}
    }
    bumper() { this.tone(440, 880, 0.1, 'sawtooth', 0.15); }
    flip() { this.tone(150, 80, 0.06, 'sine', 0.1); }
    score() { this.tone(587, 880, 0.08, 'triangle', 0.1); }
    drain() { this.tone(120, 40, 0.4, 'sawtooth', 0.2); }
}

class RugPinballGame {
    constructor() {
        this.canvas = document.getElementById('pinballCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Game stats
        this.score = 0;
        this.multiplier = 1;
        this.ballCount = 3;
        this.gameState = 'READY'; // READY, PLAYING, GAMEOVER

        // Ball physics object
        this.ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, active: false };

        // Plunger spring power
        this.plungerPower = 0;
        this.plungerCharging = false;

        // Flipper states
        this.leftFlipperAngle = 0.45;  // Resting angle (radians)
        this.rightFlipperAngle = Math.PI - 0.45;
        this.leftPressed = false;
        this.rightPressed = false;

        // Bumpers (Captain Otter, Chad, Hailey)
        this.bumpers = [
            { x: 0, y: 0, r: 28, name: 'CAPTAIN OTTER', color: '#1ca3ec', score: 500, flash: 0 },
            { x: 0, y: 0, r: 24, name: 'CHAD', color: '#ef4444', score: 350, flash: 0 },
            { x: 0, y: 0, r: 24, name: 'HAILEY', color: '#eac096', score: 350, flash: 0 }
        ];

        this.bindControls();
        this.resetBall();

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
        // Fit canvas neatly inside available height between HUD & Footer
        const wrapper = document.getElementById('app-wrapper');
        const availH = window.innerHeight - 120;
        const availW = window.innerWidth - 16;

        // Standard vertical pinball aspect ratio (~1:2)
        let targetH = Math.min(availH, 700);
        let targetW = targetH * 0.52;
        if (targetW > availW) {
            targetW = availW;
            targetH = targetW / 0.52;
        }

        this.width = Math.round(targetW);
        this.height = Math.round(targetH);
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        // Position bumpers relative to table dimensions
        if (this.bumpers) {
            this.bumpers[0].x = this.width * 0.5;
            this.bumpers[0].y = this.height * 0.28;

            this.bumpers[1].x = this.width * 0.3;
            this.bumpers[1].y = this.height * 0.42;

            this.bumpers[2].x = this.width * 0.7;
            this.bumpers[2].y = this.height * 0.42;
        }

        if (!this.ball.active && this.gameState === 'READY') {
            this.resetBall();
        }
    }

    resetBall() {
        this.ball.x = this.width - 20;
        this.ball.y = this.height - 100;
        this.ball.vx = 0;
        this.ball.vy = 0;
        this.ball.active = false;
        this.plungerPower = 0;
    }

    bindControls() {
        const setLeft = (val) => { this.leftPressed = val; if (val) this.sfx.flip(); };
        const setRight = (val) => { this.rightPressed = val; if (val) this.sfx.flip(); };

        // Touch & Mouse buttons
        const bindBtn = (id, onDown, onUp) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { if(e.cancelable) e.preventDefault(); this.sfx.init(); onDown(); el.classList.add('touch-active'); }, {passive: false});
            el.addEventListener('touchend', (e) => { if(e.cancelable) e.preventDefault(); onUp(); el.classList.remove('touch-active'); }, {passive: false});
            el.addEventListener('mousedown', () => { this.sfx.init(); onDown(); });
            el.addEventListener('mouseup', () => onUp());
        };

        bindBtn('btnLeft', () => setLeft(true), () => setLeft(false));
        bindBtn('btnRight', () => setRight(true), () => setRight(false));

        const launchBtn = document.getElementById('btnLaunch');
        const startCharge = (e) => {
            if(e.cancelable) e.preventDefault();
            this.sfx.init();
            if (!this.ball.active && this.gameState !== 'GAMEOVER') {
                this.plungerCharging = true;
            } else {
                // Table nudge if ball is in play
                this.ball.vx += (Math.random() - 0.5) * 6;
                this.ball.vy -= 4;
            }
        };
        const releaseCharge = (e) => {
            if(e.cancelable) e.preventDefault();
            if (this.plungerCharging) {
                this.plungerCharging = false;
                this.ball.active = true;
                this.ball.vy = -this.plungerPower;
                this.plungerPower = 0;
                this.gameState = 'PLAYING';
            }
        };

        launchBtn.addEventListener('touchstart', startCharge, {passive: false});
        launchBtn.addEventListener('touchend', releaseCharge, {passive: false});
        launchBtn.addEventListener('mousedown', startCharge);
        launchBtn.addEventListener('mouseup', releaseCharge);

        document.getElementById('btnNew').addEventListener('click', () => {
            this.sfx.init();
            this.score = 0;
            this.multiplier = 1;
            this.ballCount = 3;
            this.gameState = 'READY';
            this.resetBall();
            this.updateHUD();
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            this.sfx.init();
            if (['KeyA', 'ArrowLeft'].includes(e.code)) setLeft(true);
            if (['KeyD', 'ArrowRight'].includes(e.code)) setRight(true);
            if (['Space', 'ArrowDown'].includes(e.code)) {
                if (!this.ball.active && this.gameState !== 'GAMEOVER') {
                    this.plungerCharging = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['KeyA', 'ArrowLeft'].includes(e.code)) setLeft(false);
            if (['KeyD', 'ArrowRight'].includes(e.code)) setRight(false);
            if (['Space', 'ArrowDown'].includes(e.code)) {
                if (this.plungerCharging) {
                    this.plungerCharging = false;
                    this.ball.active = true;
                    this.ball.vy = -this.plungerPower;
                    this.plungerPower = 0;
                    this.gameState = 'PLAYING';
                }
            }
        });
    }

    updateHUD() {
        document.getElementById('scoreVal').textContent = this.score;
        document.getElementById('multVal').textContent = this.multiplier + 'x';
        document.getElementById('ballVal').textContent = this.ballCount + '/3';
    }

    update(dt) {
        if (this.plungerCharging) {
            this.plungerPower = Math.min(22, this.plungerPower + dt * 25);
        }

        // Flipper rotation physics
        const targetLeftAngle = this.leftPressed ? -0.45 : 0.45;
        this.leftFlipperAngle += (targetLeftAngle - this.leftFlipperAngle) * 0.35;

        const targetRightAngle = this.rightPressed ? Math.PI + 0.45 : Math.PI - 0.45;
        this.rightFlipperAngle += (targetRightAngle - this.rightFlipperAngle) * 0.35;

        if (!this.ball.active) {
            if (!this.plungerCharging) {
                this.ball.x = this.width - 20;
                this.ball.y = this.height - 100;
            }
            return;
        }

        // Sub-stepped physics for precise collision detection
        const substeps = 6;
        const sdt = dt / substeps;

        for (let step = 0; step < substeps; step++) {
            // Gravity & friction
            this.ball.vy += 350 * sdt;
            this.ball.vx *= 0.992;
            this.ball.vy *= 0.992;

            this.ball.x += this.ball.vx * sdt;
            this.ball.y += this.ball.vy * sdt;

            // Wall bounds (Left, Right, Top)
            const margin = this.ball.r + 8;
            const rightWall = this.width - 28; // Shooter lane separator

            if (this.ball.x < margin) {
                this.ball.x = margin;
                this.ball.vx *= -0.75;
            }
            if (this.ball.x > rightWall && this.ball.y > 60 && this.ball.y < this.height - 120) {
                this.ball.x = rightWall;
                this.ball.vx *= -0.75;
            }
            if (this.ball.x > this.width - margin) {
                this.ball.x = this.width - margin;
                this.ball.vx *= -0.75;
            }
            if (this.ball.y < margin + 20) {
                this.ball.y = margin + 20;
                this.ball.vy *= -0.75;
            }

            // Circular Bumpers Collision
            this.bumpers.forEach(b => {
                if (b.flash > 0) b.flash -= sdt * 4;
                const dx = this.ball.x - b.x;
                const dy = this.ball.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist < b.r + this.ball.r) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = (b.r + this.ball.r) - dist;
                    this.ball.x += nx * overlap;
                    this.ball.y += ny * overlap;

                    const dot = this.ball.vx * nx + this.ball.vy * ny;
                    this.ball.vx = (this.ball.vx - 2 * dot * nx) * 1.35 + (Math.random() - 0.5) * 40;
                    this.ball.vy = (this.ball.vy - 2 * dot * ny) * 1.35 + (Math.random() - 0.5) * 40;

                    b.flash = 1;
                    this.score += b.score * this.multiplier;
                    this.sfx.bumper();
                    this.updateHUD();
                }
            });

            // Flippers Collision
            const fLen = 54;
            const leftPivot = { x: this.width * 0.34, y: this.height - 75 };
            const rightPivot = { x: this.width * 0.66, y: this.height - 75 };

            const checkFlipper = (pivot, angle, isLeft) => {
                const tipX = pivot.x + Math.cos(angle) * fLen;
                const tipY = pivot.y + Math.sin(angle) * fLen;

                // Simple segment distance check
                const baX = tipX - pivot.x;
                const baY = tipY - pivot.y;
                const paX = this.ball.x - pivot.x;
                const paY = this.ball.y - pivot.y;

                const baLenSq = baX * baX + baY * baY;
                let t = (paX * baX + paY * baY) / baLenSq;
                t = Math.max(0, Math.min(1, t));

                const closestX = pivot.x + t * baX;
                const closestY = pivot.y + t * baY;

                const dist = Math.hypot(this.ball.x - closestX, this.ball.y - closestY);
                if (dist < this.ball.r + 6) {
                    // Push ball out
                    const nx = (this.ball.x - closestX) / (dist || 1);
                    const ny = (this.ball.y - closestY) / (dist || 1);
                    this.ball.x = closestX + nx * (this.ball.r + 6);
                    this.ball.y = closestY + ny * (this.ball.r + 6);

                    // Flipper velocity boost when swinging
                    const swingSpeed = isLeft ? (this.leftPressed ? -18 : 0) : (this.rightPressed ? 18 : 0);
                    this.ball.vx = nx * 320 + swingSpeed * 15;
                    this.ball.vy = ny * 320 - 180;
                    this.sfx.flip();
                }
            };

            checkFlipper(leftPivot, this.leftFlipperAngle, true);
            checkFlipper(rightPivot, this.rightFlipperAngle, false);

            // Drain check (Bottom outlane)
            if (this.ball.y > this.height - 35) {
                if (this.ball.x < this.width - 35 || this.ball.x > this.width - 15) {
                    this.sfx.drain();
                    this.ballCount--;
                    if (this.ballCount <= 0) {
                        this.gameState = 'GAMEOVER';
                    }
                    this.resetBall();
                    this.updateHUD();
                    break;
                }
            }
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        // Table Background
        ctx.fillStyle = '#0f050d';
        ctx.fillRect(0, 0, this.width, this.height);

        // Outer Border Neon Glow
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 12;
        ctx.strokeRect(10, 10, this.width - 20, this.height - 20);
        ctx.shadowBlur = 0;

        // Shooter Lane Divider
        ctx.strokeStyle = '#331111';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.width - 28, 60);
        ctx.lineTo(this.width - 28, this.height - 110);
        ctx.stroke();

        // Draw Bumpers (Captain Otter, Chad, Hailey)
        this.bumpers.forEach((b, idx) => {
            ctx.save();
            ctx.translate(b.x, b.y);

            // Outer glow ring
            ctx.beginPath();
            ctx.arc(0, 0, b.r + (b.flash > 0 ? 8 : 0), 0, Math.PI * 2);
            ctx.fillStyle = b.flash > 0 ? '#ffffff' : b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 15;
            ctx.fill();

            // Inner core
            ctx.beginPath();
            ctx.arc(0, 0, b.r * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = '#090a0f';
            ctx.fill();

            // Character Label
            ctx.font = '900 8px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(idx === 0 ? 'OTTER' : (idx === 1 ? 'CHAD' : 'HAILEY'), 0, 0);

            ctx.restore();
        });

        // Draw Flippers
        const drawFlipper = (pivot, angle, isLeft) => {
            ctx.save();
            ctx.translate(pivot.x, pivot.y);
            ctx.rotate(angle);
            ctx.fillStyle = '#f5c71a';
            ctx.shadowColor = '#f5c71a';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(0, -8, 54, 16, 8);
            ctx.fill();
            ctx.restore();
        };

        drawFlipper({ x: this.width * 0.34, y: this.height - 75 }, this.leftFlipperAngle, true);
        drawFlipper({ x: this.width * 0.66, y: this.height - 75 }, this.rightFlipperAngle, false);

        // Draw Ball
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();

        // Plunger Spring Indicator
        if (!this.ball.active && this.gameState !== 'GAMEOVER') {
            ctx.strokeStyle = '#f5c71a';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(this.width - 20, this.height - 110);
            ctx.lineTo(this.width - 20, this.height - 110 + this.plungerPower * 3);
            ctx.stroke();
        }

        // Game Over Banner
        if (this.gameState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
            ctx.fillRect(0, this.height * 0.35, this.width, 90);
            ctx.font = '900 22px Orbitron';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', this.width / 2, this.height * 0.35 + 35);
            ctx.font = '700 12px Rajdhani';
            ctx.fillStyle = '#fde047';
            ctx.fillText('TAP NEW GAME TO RETRY', this.width / 2, this.height * 0.35 + 65);
        }
    }

    loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.onload = () => new RugPinballGame();
</script>
</body>
</html>
