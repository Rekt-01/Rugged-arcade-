<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rugged Orphans — Rugged Arcade</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="description" content="Rugged Orphans. A concept by Rugged Arcade.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #0d0d0f;
      color: #ededec;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* TOP NAVIGATION */

    header {
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8e8e93;
      transition: color 0.15s ease;
    }

    .site-name:hover {
      color: #ededec;
    }

    .back-link {
      font-size: 13px;
      color: #8e8e93;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #ededec;
    }

    /* CENTER SHOWCASE */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      text-align: center;
    }

    .artwork-wrap {
      width: 100%;
      max-width: 340px;
      margin-bottom: 36px;
    }

    .pack-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    h1 {
      font-size: clamp(24px, 3.5vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ededec;
    }

    .subtitle {
      margin-top: 10px;
      max-width: 380px;
      font-size: 15px;
      line-height: 1.5;
      color: #7c7c82;
    }

    /* FOOTER */

    footer {
      padding: 24px 40px;
      text-align: center;
      font-size: 12px;
      color: #4a4a50;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        padding: 20px 24px;
      }

      .artwork-wrap {
        max-width: 280px;
        margin-bottom: 28px;
      }

      footer {
        padding: 20px 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="main.html" class="site-name">Rugged Arcade</a>
    <a href="main.html" class="back-link">← Back to Arcade</a>
  </header>

  <main>
    <div class="artwork-wrap">
      <img
        class="pack-image"
        src="./Pack.png"
        alt="Rugged Orphans concept artwork"
        fetchpriority="high"
        onerror="this.onerror=null; this.alt='Place Pack.png in this folder'; this.style.minHeight='360px'; this.style.background='#16161a'; this.style.display='grid'; this.style.placeItems='center'; this.style.color='#666'; this.style.fontSize='13px';"
      >
    </div>

    <h1>Rugged Orphans</h1>
    <p class="subtitle">An early concept from Rugged Arcade.</p>
  </main>

  <footer>
    Rugged Arcade
  </footer>

</body>
</html>
