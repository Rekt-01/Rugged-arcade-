<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Rugged Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f12;
      color: #e8e8e8;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #222;
    }

    .chain {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    .connect {
      background: #fff;
      color: #000;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .connect:hover {
      background: #eee;
    }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .center h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .center p {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .back {
      display: block;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }

    .back:hover {
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="chain">APECHAIN</div>
    <button class="connect" onclick="alert('Wallet connection coming soon')">Connect Wallet</button>
  </div>

  <div class="center">
    <div>
      <h1>Coming Soon</h1>
      <p>Rugged Arcade Shop</p>
    </div>
  </div>

  <a href="main.html" class="back">← Back to Arcade</a>
</body>
</html>
