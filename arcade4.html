<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rug Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Arial Black', Impact, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 960px;
  }
  #gameCanvas {
    width: 100%;
    height: auto;
    display: block;
    border: 4px solid #8B0000;
    box-shadow: 0 0 40px #ff0000;
    background: #111;
  }
  #ui {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 20px;
    pointer-events: none; z-index: 10;
  }
  .health-container { width: 42%; }
  .name { font-size: clamp(14px, 3.5vw, 22px); text-shadow: 2px 2px #000; margin-bottom: 4px; letter-spacing: 1px; color: #ffcc00; }
  .health-bar { height: 22px; background: #222; border: 3px solid #fff; position: relative; border-radius: 3px; overflow: hidden; }
  .health-fill { height: 100%; background: linear-gradient(90deg, #aa0000, #ff5500); width: 100%; transition: width 0.1s; }
  
  #exitBtn {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(139, 0, 0, 0.85); border: 2px solid #fff; color: #fff;
    padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
    border-radius: 6px; z-index: 25; text-decoration: none; box-shadow: 0 2px 5px #000;
  }
  #exitBtn:hover { background: #ff0000; }

  #finishBtn {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(28px, 8vw, 56px); padding: 15px 30px;
    background: linear-gradient(#aa0000, #440000); color: #ffcc00;
    border: 5px solid #ffcc00; cursor: pointer; display: none; z-index: 100;
    text-shadow: 3px 3px #000; animation: pulse 0.4s infinite alternate;
    letter-spacing: 2px; border-radius: 8px;
  }
  @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.08); } }

  /* Transparent overlay controls pinned at bottom edges to keep gameplay clear */
  #controls {
    position: absolute; bottom: 8px; left: 15px; right: 15px;
    display: flex; justify-content: space-between; z-index: 20; pointer-events: none;
  }
  .btn-group { display: flex; gap: 10px; pointer-events: auto; }
  .ctrl-btn {
    width: 60px; height: 60px; background: rgba(30, 0, 0, 0.65); border: 2px solid rgba(255,255,255,0.8);
    color: #fff; font-size: 22px; font-weight: bold; border-radius: 12px;
    touch-action: none; user-select: none; box-shadow: 0 3px 6px rgba(0,0,0,0.5);
  }
  .ctrl-btn:active { background: rgba(200,0,0,0.85); transform: translateY(2px); }
  #instructions { margin: 8px 0; font-size: 12px; text-align: center; opacity: 0.8; max-width: 95%; }
</style>
</head>
<body>

<div id="gameWrap">
  <a href="main.html" id="exitBtn">EXIT</a>
  <div id="ui">
    <div class="health-container">
      <div class="name">CHAD</div>
      <div class="health-bar"><div class="health-fill" id="chadHealth"></div></div>
    </div>
    <div class="health-container">
      <div class="name" style="text-align:right">CAPTAIN OTTER</div>
      <div class="health-bar"><div class="health-fill" id="otterHealth" style="float:right"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="900" height="460"></canvas>
  <button id="finishBtn">FINISH HIM!</button>

  <div id="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="btnPunch">P</button>
      <button class="ctrl-btn" id="btnKick">K</button>
    </div>
  </div>
</div>

<div id="instructions">
  Desktop: ← → Move &nbsp;|&nbsp; Z: Punch &nbsp;|&nbsp; X: Kick &nbsp;|&nbsp; Mobile: Clean bottom-edge buttons
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const finishBtn = document.getElementById("finishBtn");

// Assets from your project reference
const arenaImg = new Image();
arenaImg.crossOrigin = "anonymous";
arenaImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/arena.png";

const chadImg = new Image();
chadImg.crossOrigin = "anonymous";
chadImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/image_2.png"; // Chad

const otterImg = new Image();
otterImg.crossOrigin = "anonymous";
otterImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/image_3.png"; // Captain Otter

let assetsLoaded = 0;
function checkLoad() {
  assetsLoaded++;
  if (assetsLoaded >= 3) gameLoop();
}
arenaImg.onload = checkLoad;
chadImg.onload = checkLoad;
otterImg.onload = checkLoad;
arenaImg.onerror = checkLoad;
chadImg.onerror = checkLoad;
otterImg.onerror = checkLoad;

// Game State
let chad = { x: 180, y: 220, vx: 0, health: 100, maxHealth: 100, width: 110, height: 110, state: "idle", facing: 1 };
let otter = { x: 600, y: 225, vx: 0, health: 100, maxHealth: 100, width: 110, height: 110, state: "idle", facing: -1, aiTimer: 0 };
let finishing = false;
let finished = false;
let bloodParticles = [];

// Controls mapping
let keys = {};
let tLeft = false, tRight = false;

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function setupTouch(id, downCb, upCb) {
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", e => { e.preventDefault(); downCb(); });
  btn.addEventListener("touchend", e => { e.preventDefault(); upCb(); });
  btn.addEventListener("mousedown", e => { e.preventDefault(); downCb(); });
  btn.addEventListener("mouseup", e => { e.preventDefault(); upCb(); });
  btn.addEventListener("mouseleave", e => { e.preventDefault(); upCb(); });
}

setupTouch("btnLeft", () => tLeft = true, () => tLeft = false);
setupTouch("btnRight", () => tRight = true, () => tRight = false);
setupTouch("btnPunch", () => triggerAttack(chad, "punch"), () => {});
setupTouch("btnKick", () => triggerAttack(chad, "kick"), () => {});

window.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === 'z') triggerAttack(chad, "punch");
  if (e.key.toLowerCase() === 'x') triggerAttack(chad, "kick");
});

finishBtn.onclick = finishBtn.ontouchstart = () => {
  if (!finishing && otter.health <= 0) {
    finishing = true;
    finishBtn.style.display = "none";
    otter.width = 90;
    otter.height = 60; // knocked down
    otter.y += 50;
    spawnBlood(otter.x + 45, otter.y + 25, 60);
  }
};

function triggerAttack(fighter, type) {
  if (fighter.state !== "idle" || finishing || finished) return;
  fighter.state = type;
  
  setTimeout(() => {
    if (finishing || finished) return;
    const target = (fighter === chad) ? otter : chad;
    const dist = Math.abs(fighter.x - target.x);
    if (dist < 110) {
      target.health = Math.max(0, target.health - (type === "punch" ? 12 : 18));
      updateBars();
      spawnBlood(target.x + 50, target.y + 50, 15);
      
      if (target === otter && otter.health <= 0) {
        finishBtn.style.display = "block";
      }
    }
  }, 120);

  setTimeout(() => {
    if (!finishing) fighter.state = "idle";
  }, 300);
}

function updateBars() {
  document.getElementById("chadHealth").style.width = (chad.health / chad.maxHealth * 100) + "%";
  document.getElementById("otterHealth").style.width = (otter.health / otter.maxHealth * 100) + "%";
}

function spawnBlood(x, y, count) {
  for (let i = 0; i < count; i++) {
    bloodParticles.push({
      x, y,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 1) * 12,
      life: 50 + Math.random() * 40,
      size: 4 + Math.random() * 5
    });
  }
}

function updateAI() {
  if (finishing || finished || otter.health <= 0) return;
  
  otter.aiTimer++;
  const dist = chad.x - otter.x;
  otter.facing = dist > 0 ? 1 : -1;

  if (Math.abs(dist) > 100) {
    otter.x += otter.facing * 2.2;
  } else if (otter.aiTimer % 75 === 0) {
    triggerAttack(otter, Math.random() > 0.5 ? "punch" : "kick");
  }
}

function update() {
  let moveDir = 0;
  if (tLeft || keys['arrowleft'] || keys['a']) moveDir = -1;
  if (tRight || keys['arrowright'] || keys['d']) moveDir = 1;

  if (moveDir !== 0 && chad.state === "idle") {
    chad.x += moveDir * 4.5;
    chad.facing = moveDir;
  }

  chad.x = Math.max(40, Math.min(canvas.width - 150, chad.x));
  otter.x = Math.max(40, Math.min(canvas.width - 150, otter.x));

  updateAI();

  for (let i = bloodParticles.length - 1; i >= 0; i--) {
    let p = bloodParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.8;
    p.life--;
    if (p.life <= 0) bloodParticles.splice(i, 1);
  }
}

function drawShadow(x, y, w) {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + 115, w * 0.38, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (arenaImg.complete && arenaImg.naturalWidth !== 0) {
    ctx.drawImage(arenaImg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#1b0000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  drawShadow(chad.x, chad.y, chad.width);
  drawShadow(otter.x, otter.y, otter.width);

  // Draw Chad
  ctx.save();
  if (chad.facing === -1) {
    ctx.translate(chad.x + chad.width, chad.y);
    ctx.scale(-1, 1);
    ctx.drawImage(chadImg, 0, 0, chad.width, chad.height);
  } else {
    ctx.drawImage(chadImg, chad.x, chad.y, chad.width, chad.height);
  }
  ctx.restore();

  // Draw Captain Otter
  ctx.save();
  if (otter.facing === -1) {
    ctx.translate(otter.x + otter.width, otter.y);
    ctx.scale(-1, 1);
    ctx.drawImage(otterImg, 0, 0, otter.width, otter.height);
  } else {
    ctx.drawImage(otterImg, otter.x, otter.y, otter.width, otter.height);
  }
  ctx.restore();

  // Draw Blood Particles
  ctx.fillStyle = "#cc0000";
  for (let p of bloodParticles) {
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

updateBars();
</script>
</body>
</html>
