<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RUG ARENA - MORTAL KOMBAT EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #050508;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            image-rendering: pixelated;
        }
        /* Landscape Enforcement Overlay */
        #orientation-warning {
            position: fixed;
            inset: 0;
            background: #050508;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
        .mk-panel {
            background: rgba(15, 10, 15, 0.9);
            border: 2px solid rgba(185, 28, 28, 0.7);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }
        .mk-btn {
            background: linear-gradient(135deg, rgba(153, 27, 27, 0.4), rgba(69, 10, 10, 0.6));
            border: 2px solid rgba(239, 68, 68, 0.8);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.08s, background 0.15s;
        }
        .mk-btn:active, .touch-active {
            transform: scale(0.92);
            background: rgba(220, 38, 38, 0.8);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
        }
        .mk-exit-btn {
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.3), rgba(159, 18, 57, 0.4));
            border: 1px solid rgba(244, 63, 94, 0.8);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
        }
        @keyframes pulseFinish {
            0%, 100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ef4444; }
            50% { transform: translate(-50%, -50%) scale(1.08); text-shadow: 0 0 40px #fbbf24, 0 0 60px #ef4444; }
        }
        .animate-finish {
            animation: pulseFinish 0.4s infinite alternate ease-in-out;
        }
    </style>
</head>
<body class="text-white antialiased">

<!-- LANDSCAPE WARNING BANNER -->
<div id="orientation-warning">
    <div class="font-orbitron text-2xl sm:text-4xl font-black text-rose-500 mb-3 tracking-wider">ROTATE DEVICE TO LANDSCAPE</div>
    <p class="text-slate-300 text-sm sm:text-base max-w-md">Rug Arena requires landscape orientation to display the fighting arena and arcade controls properly.</p>
</div>

<div id="app-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP MK HEALTH & HUD BAR -->
    <header class="relative z-10 w-full max-w-5xl px-4 pt-3 pointer-events-none flex flex-col gap-2">
        <div class="flex items-center justify-between gap-3 mk-panel rounded-xl px-4 py-2.5 pointer-events-auto">
            <!-- CHAD HEALTH -->
            <div class="flex flex-col w-[38%]">
                <div class="flex justify-between items-center text-xs font-orbitron font-black text-amber-400 mb-1">
                    <span>CHAD</span>
                    <span id="chadHpText">100%</span>
                </div>
                <div class="h-5 bg-slate-950 border-2 border-slate-300 rounded-sm overflow-hidden p-0.5">
                    <div id="chadHpBar" class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-amber-400 transition-all duration-75" style="width:100%"></div>
                </div>
            </div>

            <!-- EXIT BUTTON -->
            <a href="main.html" class="mk-exit-btn rounded-lg px-3 py-1.5 font-orbitron text-xs font-black text-rose-200 tracking-wider flex items-center justify-center shrink-0">
                EXIT
            </a>

            <!-- CAPTAIN OTTER HEALTH -->
            <div class="flex flex-col w-[38%]">
                <div class="flex justify-between items-center text-xs font-orbitron font-black text-rose-400 mb-1">
                    <span id="otterHpText">100%</span>
                    <span>CAPTAIN OTTER</span>
                </div>
                <div class="h-5 bg-slate-950 border-2 border-slate-300 rounded-sm overflow-hidden p-0.5">
                    <div id="otterHpBar" class="h-full bg-gradient-to-r from-amber-400 via-orange-500 to-red-600 transition-all duration-75 float-right" style="width:100%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- FINISH HIM OVERLAY BUTTON -->
    <button id="btnFinish" class="absolute top-[38%] left-1/2 -translate-x-1/2 -translate-y-1/2 font-orbitron text-3xl sm:text-6xl font-black text-amber-300 px-6 py-3 rounded-2xl mk-panel border-4 border-amber-400 z-30 hidden animate-finish cursor-pointer">
        FINISH HIM!
    </button>

    <!-- BOTTOM ARCADE CONTROLS -->
    <footer class="relative z-10 w-full max-w-5xl px-4 pb-3 flex items-center justify-between pointer-events-none">
        <div class="flex gap-3 pointer-events-auto">
            <button id="btnLeft" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-2xl font-black text-white">
                &#9664;
            </button>
            <button id="btnRight" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-2xl font-black text-white">
                &#9654;
            </button>
        </div>
        <div class="hidden md:block text-xs text-slate-400 font-orbitron text-center">
            ← → : MOVE &nbsp;|&nbsp; Z / PUNCH: ATTACK &nbsp;|&nbsp; X / KICK: HEAVY ATTACK
        </div>
        <div class="flex gap-3 pointer-events-auto">
            <button id="btnPunch" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-base font-black text-amber-300 border-amber-500/80">
                PUNCH
            </button>
            <button id="btnKick" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-base font-black text-rose-300 border-rose-500/80">
                KICK
            </button>
        </div>
    </footer>
</div>

<script>
// ============================================================================
// 1. PIXEL ART PALETTE & SPRITE GENERATORS (CHAD, OTTER, HAILEY)
// ============================================================================
const PALETTE = {
    'K': '#090a0f', 'W': '#ffffff', 'G': '#b8d8d8', 'B': '#1d38b8',
    'J': '#1e293b', 'R': '#e61919', 'S': '#eac096', 'T': '#c49668',
    'P': '#d9536f', 'O': '#e06d1a', 'N': '#6b4226', 'D': '#472a16',
    'M': '#f5deb3', 'C': '#1ca3ec', 'Y': '#f5c71a', 'V': '#111633',
    'A': '#9ca3af', 'E': '#38bdf8'
};

const CHAD_GRID = [
    "......KKKKKK....",
    "....KKBBBBWWKK..",
    "...KBWBBWBWRRRK.",
    "..KBBWBWBWBRWWRK",
    "KKKBBBBBBBBRRRRK",
    "KWWKSSSSSSSSSSK.",
    "KRRKKKKKKKKKKKK.",
    ".KKKSSKKGGKKGGKK",
    "..KTSSKKGGKKGGKK",
    "..KTSSKKKKKKSSK.",
    "...KSSSSSSPPSSK.",
    "..KKRKKKKKKKKRKK",
    ".KRRRRKSSSSKRRRR",
    ".KBBBBKORWROKWRW",
    ".KBBBBKORRROKRRR",
    ".KBBBBKOWWWOKWWW",
    "..KKKKKKKKKKKK..",
    "..KJJJJKKJJJJK..",
    "..KJJJJKKJJJJK..",
    "..KRRRRKKRRRRK..",
    "..KWWWWKKWWWWK.."
];

const OTTER_GRID = [
    ".....KKKKKKK....",
    "...KKWWWWWWWKK..",
    "..KWWWWWYWWWWWK.",
    "..KWWWWYYYWWWWK.",
    "..KVVVVYYYVVVVK.",
    "..KYYYYYYYYYYYK.",
    ".KKNNNNKKKKKKKKK",
    ".KNNNNNCCKNNCCK.",
    "..KNNNNNNMMNNNK.",
    "..KNNNMMMMMMMMK.",
    "..KNNMMKKMMKKMK.",
    "...KNNMMMMMMMMK.",
    "...KNNNMMMMMMK..",
    "..KNNNNMMMMMMNK.",
    ".KNNNNNMMMMMMNNK",
    ".KNNNNNMMMMMMNNK",
    ".KVVVVVYYYYVVVVK",
    "..KVVVVKKKKVVVVK",
    "..KVVVVK..KVVVVK",
    ".KYYYYK....KYYYY",
    ".KKKKKK....KKKKK"
];

const HAILEY_GRID = [
    ".....KKKKKKK....",
    "...KKNNNNNNNKK..",
    "..KNNYNNNNNNNNK.",
    ".KNNNYNNNNNNNNNK",
    ".KNNNKSSSSSSSSK.",
    ".KNNNKWWWWWWWWWK",
    ".KNNNKTWWCCWWRRK",
    ".KNNNKSSWWWWWWWK",
    "..KNNKSSSSSSSSK.",
    "..KNNKSSSSPPPWWK",
    "...KKKSSSSSSKK..",
    "..KWWAKKKKKKAWWK",
    ".KWAWWKYYYYKWWAK",
    ".KRRRRKYKKYKRRRR",
    ".KRRRRKYYYYKRRRR",
    ".KRRRRKYKKYKRRRR",
    ".KRRRRKYYYYKRRRR",
    "..KRRRRYYYYRRRRK",
    "..KRRRRKYYKRRRRK",
    "...KKKKKKKKKKKK.",
    "...KKKKK..KKKKK."
];

function createFighterSprite(grid, scale = 4, flipX = false) {
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = grid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

// Separate Head and Body for Decapitation Fatality!
function createHeadSprite(grid, scale = 4, flipX = false) {
    const headGrid = grid.slice(0, 6); // First 6 rows contain cap and eyes/face
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = headGrid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < headGrid.length; r++) {
        const row = headGrid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

function createBodySprite(grid, scale = 4, flipX = false) {
    const bodyGrid = grid.slice(6); // Remaining rows for torso and legs
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = bodyGrid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < bodyGrid.length; r++) {
        const row = bodyGrid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

// ============================================================================
// 2. WEB AUDIO SYNTHESIZER FOR MK COMBAT
// ============================================================================
class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, endFreq, dur, type = 'square', vol = 0.15) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        } catch (e) {}
    }
    hit() { this.tone(180, 40, 0.12, 'sawtooth', 0.2); }
    heavyHit() { this.tone(120, 25, 0.2, 'sawtooth', 0.25); }
    fatality() {
        [220, 165, 110, 80].forEach((f, i) => {
            setTimeout(() => this.tone(f, f * 0.7, 0.25, 'sawtooth', 0.22), i * 140);
        });
    }
}

// ============================================================================
// 3. RUG ARENA GAME ENGINE
// ============================================================================
class RugArenaGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        // Load Arena Background Image provided earlier
        this.arenaImg = new Image();
        this.arenaImg.crossOrigin = 'anonymous';
        this.arenaImg.src = 'https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/arena.png';

        // Generate Sprites (Scale 4 -> 64x84 fighters)
        const scale = 4;
        this.sprites = {
            chadR: createFighterSprite(CHAD_GRID, scale, false),
            chadL: createFighterSprite(CHAD_GRID, scale, true),
            otterR: createFighterSprite(OTTER_GRID, scale, false),
            otterL: createFighterSprite(OTTER_GRID, scale, true),
            otterHead: createHeadSprite(OTTER_GRID, scale, false),
            otterBody: createBodySprite(OTTER_GRID, scale, false),
            hailey: createFighterSprite(HAILEY_GRID, scale, true)
        };

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.keys = { left: false, right: false };
        this.particles = [];
        this.shake = 0;
        this.animClock = 0;

        // Fighter Objects
        this.chad = {
            x: 180, y: 0, vx: 0, vy: 0,
            w: 64, h: 84, hp: 100, maxHp: 100,
            state: 'idle', attackTimer: 0
        };
        this.otter = {
            x: 0, y: 0, vx: 0, vy: 0,
            w: 64, h: 84, hp: 100, maxHp: 100,
            state: 'idle', attackTimer: 0, aiTimer: 0, decapitated: false, headFly: null
        };
        this.hailey = { x: 0, y: 0, active: false };

        this.matchState = 'FIGHTING'; // FIGHTING -> FINISH_AVAILABLE -> FATALITY -> VICTORY

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindControls();

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        // Ground baseline on the rug arena carpet
        const floorY = this.height * 0.72;
        this.chad.y = floorY - this.chad.h;
        this.otter.y = floorY - this.otter.h;
        if (this.otter.x === 0) this.otter.x = this.width - 240;
        if (this.hailey.x === 0) this.hailey.x = this.width + 100;
        this.hailey.y = floorY - 84;
    }

    bindControls() {
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = true;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = true;
            if (['KeyZ', 'KeyJ', 'Space'].includes(e.code)) this.triggerAttack('punch');
            if (['KeyX', 'KeyK'].includes(e.code)) this.triggerAttack('kick');
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = false;
        });

        const bindTouch = (id, action) => {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                this.sfx.init();
                if (action === 'left') this.keys.left = true;
                if (action === 'right') this.keys.right = true;
                if (action === 'punch') this.triggerAttack('punch');
                if (action === 'kick') this.triggerAttack('kick');
                btn.classList.add('touch-active');
            };
            const end = (e) => {
                e.preventDefault();
                if (action === 'left') this.keys.left = false;
                if (action === 'right') this.keys.right = false;
                btn.classList.remove('touch-active');
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnPunch', 'punch');
        bindTouch('btnKick', 'kick');

        document.getElementById('btnFinish').onclick = () => {
            this.sfx.init();
            this.triggerFatality();
        };
    }

    triggerAttack(type) {
        if (this.matchState !== 'FIGHTING' || this.chad.state !== 'idle') return;
        this.chad.state = type;
        this.chad.attackTimer = 0.25;

        const dist = Math.abs(this.chad.x - this.otter.x);
        if (dist < 110) {
            const dmg = type === 'punch' ? 12 : 18;
            this.otter.hp = Math.max(0, this.otter.hp - dmg);
            this.sfx.hit();
            this.shake = 0.18;
            this.spawnBlood(this.otter.x + 32, this.otter.y + 30, 16);
            this.updateHUD();

            if (this.otter.hp <= 0) {
                this.matchState = 'FINISH_AVAILABLE';
                document.getElementById('btnFinish').classList.remove('hidden');
            }
        }
        setTimeout(() => { if (this.matchState === 'FIGHTING') this.chad.state = 'idle'; }, 250);
    }

    triggerFatality() {
        document.getElementById('btnFinish').classList.add('hidden');
        this.matchState = 'FATALITY';
        this.sfx.fatality();
        this.shake = 0.6;

        // CHAD UPPERCUT / DECAPITATION ANIMATION
        this.chad.state = 'punch';
        this.spawnBlood(this.otter.x + 32, this.otter.y + 15, 55);

        // Captain Otter Head Flies Off!
        this.otter.decapitated = true;
        this.otter.headFly = {
            x: this.otter.x + 20,
            y: this.otter.y + 10,
            vx: -90 - Math.random() * 50,
            vy: -480
        };

        // Princess Hailey walks in from the right to hug Chad!
        setTimeout(() => {
            this.hailey.active = true;
        }, 1200);
    }

    spawnBlood(x, y, count) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 60 + Math.random() * 180;
            this.particles.push({
                x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 50,
                color: '#ef4444', alpha: 1, size: 3 + Math.random() * 4
            });
        }
    }

    updateHUD() {
        const cPct = Math.max(0, Math.round((this.chad.hp / this.chad.maxHp) * 100));
        const oPct = Math.max(0, Math.round((this.otter.hp / this.otter.maxHp) * 100));
        document.getElementById('chadHpText').textContent = cPct + '%';
        document.getElementById('chadHpBar').style.width = cPct + '%';
        document.getElementById('otterHpText').textContent = oPct + '%';
        document.getElementById('otterHpBar').style.width = oPct + '%';
    }

    update(dt) {
        this.animClock += dt;
        if (this.shake > 0) this.shake -= dt;

        const c = this.chad;
        const o = this.otter;

        if (this.matchState === 'FIGHTING') {
            // Chad Movement
            let move = 0;
            if (this.keys.left) move = -1;
            if (this.keys.right) move = 1;
            c.vx = move * 310;
            c.x = Math.max(40, Math.min(this.width - 120, c.x + c.vx * dt));

            // Face each other
            c.facing = o.x > c.x ? 1 : -1;
            o.facing = c.x > o.x ? 1 : -1;

            // Otter AI Counter-Attack
            o.aiTimer += dt;
            if (o.aiTimer > 1.8 && o.hp > 0) {
                o.aiTimer = 0;
                const dist = Math.abs(c.x - o.x);
                if (dist < 130) {
                    o.state = 'attack';
                    this.sfx.hit();
                    c.hp = Math.max(0, c.hp - 10);
                    this.spawnBlood(c.x + 32, c.y + 30, 10);
                    this.updateHUD();
                    setTimeout(() => { o.state = 'idle'; }, 300);
                    if (c.hp <= 0) {
                        this.matchState = 'GAMEOVER';
                    }
                } else {
                    o.x += (c.x > o.x ? 1 : -1) * 75 * dt;
                }
            }
        }

        // Decapitated Head Physics
        if (o.headFly) {
            o.headFly.vy += 1200 * dt;
            o.headFly.x += o.headFly.vx * dt;
            o.headFly.y += o.headFly.vy * dt;
            if (o.headFly.y > this.height * 0.72) {
                o.headFly.y = this.height * 0.72;
                o.headFly.vx *= 0.6;
            }
        }

        // Princess Hailey Walking In for Victory Hug
        if (this.hailey.active) {
            if (this.hailey.x > c.x + 55) {
                this.hailey.x -= 140 * dt;
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.x += pt.vx * dt;
            pt.vy += 800 * dt; // Gravity
            pt.y += pt.vy * dt;
            pt.alpha -= 1.2 * dt;
            if (pt.alpha <= 0 || pt.y > this.height) this.particles.splice(i, 1);
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        ctx.save();
        if (this.shake > 0) {
            ctx.translate((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16);
        }

        // 1. Draw Rug Arena Background Image
        if (this.arenaImg.complete && this.arenaImg.naturalWidth !== 0) {
            ctx.drawImage(this.arenaImg, 0, 0, this.width, this.height);
        } else {
            ctx.fillStyle = '#0f0505';
            ctx.fillRect(0, 0, this.width, this.height);
        }

        const c = this.chad;
        const o = this.otter;

        // 2. Draw Chad
        const chadSpr = (c.facing === -1) ? this.sprites.chadL : this.sprites.chadR;
        ctx.drawImage(chadSpr, c.x, c.y);

        // 3. Draw Captain Otter (Decapitated Body vs Intact)
        if (o.decapitated) {
            // Draw Body slumped
            const bodySpr = (o.facing === -1) ? this.sprites.otterBody : this.sprites.otterBody;
            ctx.drawImage(bodySpr, o.x, o.y + 24);

            // Draw Flying Decapitated Head with blood spray trail!
            if (o.headFly) {
                ctx.drawImage(this.sprites.otterHead, o.headFly.x, o.headFly.y);
            }
        } else {
            const otterSpr = (o.facing === -1) ? this.sprites.otterL : this.sprites.otterR;
            ctx.drawImage(otterSpr, o.x, o.y);
        }

        // 4. Draw Princess Hailey When She Arrives
        if (this.hailey.active) {
            ctx.drawImage(this.sprites.hailey, this.hailey.x, this.hailey.y);
            // Floating Hearts Above Them
            ctx.font = '24px sans-serif';
            ctx.fillText('💖💖', c.x + 20, c.y - 25);
        }

        // 5. Blood Particles
        this.particles.forEach(pt => {
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.onload = () => new RugArenaGame();
</script>
</body>
</html>
