<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RUG ARENA - MORTAL KOMBAT EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #050508;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            image-rendering: pixelated;
        }
        #orientation-warning {
            position: fixed;
            inset: 0;
            background: #050508;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
        .mk-panel {
            background: rgba(15, 10, 15, 0.9);
            border: 2px solid rgba(185, 28, 28, 0.7);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }
        .mk-btn {
            background: linear-gradient(135deg, rgba(153, 27, 27, 0.45), rgba(69, 10, 10, 0.65));
            border: 2px solid rgba(239, 68, 68, 0.85);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.08s, background 0.15s;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .mk-btn:active, .touch-active {
            transform: scale(0.92);
            background: rgba(220, 38, 38, 0.85);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.85);
        }
        .mk-exit-btn {
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.35), rgba(159, 18, 57, 0.45));
            border: 1px solid rgba(244, 63, 94, 0.85);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
            text-decoration: none;
            pointer-events: auto;
        }
        @keyframes pulseFinish {
            0%, 100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ef4444; }
            50% { transform: translate(-50%, -50%) scale(1.08); text-shadow: 0 0 40px #fbbf24, 0 0 60px #ef4444; }
        }
        .animate-finish {
            animation: pulseFinish 0.4s infinite alternate ease-in-out;
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="orientation-warning">
    <div class="font-orbitron text-2xl sm:text-4xl font-black text-rose-500 mb-3 tracking-wider">ROTATE DEVICE TO LANDSCAPE</div>
    <p class="text-slate-300 text-sm sm:text-base max-w-md">Rug Arena requires landscape orientation so both fighters start at opposite ends of the arena.</p>
</div>

<div id="app-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP HEALTH & HUD BAR -->
    <header class="relative z-10 w-full max-w-5xl px-4 pt-3 pointer-events-none flex flex-col gap-2">
        <div class="flex items-center justify-between gap-3 mk-panel rounded-xl px-4 py-2.5 pointer-events-auto">
            <div class="flex flex-col w-[38%]">
                <div class="flex justify-between items-center text-xs font-orbitron font-black text-amber-400 mb-1">
                    <span>CHAD</span>
                    <span id="chadHpText">100%</span>
                </div>
                <div class="h-5 bg-slate-950 border-2 border-slate-300 rounded-sm overflow-hidden p-0.5">
                    <div id="chadHpBar" class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-amber-400 transition-all duration-75" style="width:100%"></div>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <a href="main.html" class="mk-exit-btn rounded-lg px-3 py-1.5 font-orbitron text-xs font-black text-rose-200 tracking-wider flex items-center justify-center">
                    EXIT
                </a>
                <button id="btnReset" type="button" class="mk-btn rounded-lg px-2.5 py-1.5 font-orbitron text-[10px] font-black text-amber-200 tracking-wider">
                    REMATCH
                </button>
            </div>

            <div class="flex flex-col w-[38%]">
                <div class="flex justify-between items-center text-xs font-orbitron font-black text-rose-400 mb-1">
                    <span id="otterHpText">100%</span>
                    <span>CAPTAIN OTTER</span>
                </div>
                <div class="h-5 bg-slate-950 border-2 border-slate-300 rounded-sm overflow-hidden p-0.5">
                    <div id="otterHpBar" class="h-full bg-gradient-to-r from-amber-400 via-orange-500 to-red-600 transition-all duration-75 float-right" style="width:100%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- FINISH HIM BUTTON -->
    <button id="btnFinish" type="button" class="absolute top-[38%] left-1/2 -translate-x-1/2 -translate-y-1/2 font-orbitron text-3xl sm:text-6xl font-black text-amber-300 px-6 py-3 rounded-2xl mk-panel border-4 border-amber-400 z-30 hidden animate-finish cursor-pointer pointer-events-auto">
        FINISH HIM!
    </button>

    <!-- BOTTOM ARCADE CONTROLS -->
    <footer class="relative z-10 w-full max-w-5xl px-4 pb-3 flex items-center justify-between pointer-events-none">
        <div class="flex gap-3 pointer-events-auto">
            <button id="btnLeft" type="button" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-2xl font-black text-white">
                &#9664;
            </button>
            <button id="btnRight" type="button" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-2xl font-black text-white">
                &#9654;
            </button>
        </div>
        <div class="hidden md:block text-xs text-slate-400 font-orbitron text-center">
            ← → : MOVE &nbsp;|&nbsp; Z / PUNCH: ATTACK &nbsp;|&nbsp; X / KICK: HEAVY ATTACK
        </div>
        <div class="flex gap-3 pointer-events-auto">
            <button id="btnPunch" type="button" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-base font-black text-amber-300 border-amber-500/80">
                PUNCH
            </button>
            <button id="btnKick" type="button" class="mk-btn w-16 h-14 sm:w-20 sm:h-16 rounded-2xl flex items-center justify-center font-orbitron text-base font-black text-rose-300 border-rose-500/80">
                KICK
            </button>
        </div>
    </footer>
</div>

<script>
const PALETTE = {
    'K': '#090a0f', 'W': '#ffffff', 'G': '#b8d8d8', 'B': '#1d38b8',
    'J': '#1e293b', 'R': '#e61919', 'S': '#eac096', 'T': '#c49668',
    'P': '#d9536f', 'O': '#e06d1a', 'N': '#6b4226', 'D': '#472a16',
    'M': '#f5deb3', 'C': '#1ca3ec', 'Y': '#f5c71a', 'V': '#111633',
    'A': '#9ca3af', 'E': '#38bdf8'
};

const CHAD_GRID = [
    "......KKKKKK....",
    "....KKBBBBWWKK..",
    "...KBWBBWBWRRRK.",
    "..KBBWBWBWBRWWRK",
    "KKKBBBBBBBBRRRRK",
    "KWWKSSSSSSSSSSK.",
    "KRRKKKKKKKKKKKK.",
    ".KKKSSKKGGKKGGKK",
    "..KTSSKKGGKKGGKK",
    "..KTSSKKKKKKSSK.",
    "...KSSSSSSPPSSK.",
    "..KKRKKKKKKKKRKK",
    ".KRRRRKSSSSKRRRR",
    ".KBBBBKORWROKWRW",
    ".KBBBBKORRROKRRR",
    ".KBBBBKOWWWOKWWW",
    "..KKKKKKKKKKKK..",
    "..KJJJJKKJJJJK..",
    "..KJJJJKKJJJJK..",
    "..KRRRRKKRRRRK..",
    "..KWWWWKKWWWWK.."
];

const OTTER_GRID = [
    ".....KKKKKKK....",
    "...KKWWWWWWWKK..",
    "..KWWWWWYWWWWWK.",
    "..KWWWWYYYWWWWK.",
    "..KVVVVYYYVVVVK.",
    "..KYYYYYYYYYYYK.",
    ".KKNNNNKKKKKKKKK",
    ".KNNNNNCCKNNCCK.",
    "..KNNNNNNMMNNNK.",
    "..KNNNMMMMMMMMK.",
    "..KNNMMKKMMKKMK.",
    "...KNNNNMMMMMMK.",
    "...KNNNMMMMMMK..",
    "..KNNNNMMMMMMNK.",
    ".KNNNNNMMMMMMNNK",
    ".KNNNNNMMMMMMNNK",
    ".KVVVVVYYYYVVVVK",
    "..KVVVVKKKKVVVVK",
    "..KVVVVK..KVVVVK",
    ".KYYYYK....KYYYY",
    ".KKKKKK....KKKKK"
];

const HAILEY_GRID = [
    ".....KKKKKKK....",
    "...KKNNNNNNNKK..",
    "..KNNYNNNNNNNNK.",
    ".KNNNYNNNNNNNNNK",
    ".KNNNKSSSSSSSSK.",
    ".KNNNKWWWWWWWWWK",
    ".KNNNKTWWCCWWRRK",
    ".KNNNKSSWWWWWWWK",
    "..KNNKSSSSSSSSK.",
    "..KNNKSSSSPPPWWK",
    "...KKKSSSSSSKK..",
    "..KWWAKKKKKKAWWK",
    ".KWAWWKYYYYKWWAK",
    ".KRRRRKYKKYKRRRR",
    ".KRRRRKYYYYKRRRR",
    ".KRRRRKYKKYKRRRR",
    ".KRRRRKYYYYKRRRR",
    "..KRRRRYYYYRRRRK",
    "..KRRRRKYYKRRRRK",
    "...KKKKKKKKKKKK.",
    "...KKKKK..KKKKK."
];

function createFighterSprite(grid, scale = 4, flipX = false) {
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = grid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

function createHeadSprite(grid, scale = 4, flipX = false) {
    const headGrid = grid.slice(0, 6);
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = headGrid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < headGrid.length; r++) {
        const row = headGrid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

function createBodySprite(grid, scale = 4, flipX = false) {
    const bodyGrid = grid.slice(6);
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = bodyGrid.length * scale;
    const ctx = c.getContext('2d');
    if (flipX) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
    }
    for (let r = 0; r < bodyGrid.length; r++) {
        const row = bodyGrid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (PALETTE[ch]) {
                ctx.fillStyle = PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    tone(freq, endFreq, dur, type = 'square', vol = 0.15) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        } catch (e) {}
    }
    hit() { this.tone(180, 40, 0.12, 'sawtooth', 0.2); }
    fatality() {
        [220, 165, 110, 80].forEach((f, i) => {
            setTimeout(() => this.tone(f, f * 0.7, 0.25, 'sawtooth', 0.22), i * 140);
        });
    }
}

class RugArenaGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        this.arenaImg = new Image();
        this.arenaImg.crossOrigin = 'anonymous';
        this.arenaImg.src = 'https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/arena.png';

        const scale = 4;
        this.sprites = {
            chadR: createFighterSprite(CHAD_GRID, scale, false),
            chadL: createFighterSprite(CHAD_GRID, scale, true),
            otterR: createFighterSprite(OTTER_GRID, scale, false),
            otterL: createFighterSprite(OTTER_GRID, scale, true),
            otterHead: createHeadSprite(OTTER_GRID, scale, false),
            otterBody: createBodySprite(OTTER_GRID, scale, false),
            hailey: createFighterSprite(HAILEY_GRID, scale, true)
        };

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.keys = { left: false, right: false };
        this.particles = [];
        this.shake = 0;
        this.introTimer = 1.4;

        this.chad = {
            x: 0, y: 0, vx: 0, vy: 0,
            w: 64, h: 84, hp: 100, maxHp: 100,
            state: 'idle', facing: 1
        };
        this.otter = {
            x: 0, y: 0, vx: 0, vy: 0,
            w: 64, h: 84, hp: 100, maxHp: 100,
            state: 'idle', facing: -1, attackCd: 0, decapitated: false, headFly: null
        };
        this.hailey = { x: 0, y: 0, active: false, walkingAway: false };

        this.matchState = 'FIGHTING';
        this.hasMoved = false;

        this.resetPositions();
        window.addEventListener('resize', () => this.handleResize());
        this.bindControls();

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    // Place fighters at opposite ends of the arena
    resetPositions() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        const floorY = this.height * 0.72;
        this.chad.x = Math.max(40, Math.round(this.width * 0.12));
        this.chad.y = floorY - this.chad.h;
        this.chad.facing = 1;

        this.otter.x = Math.min(this.width - this.otter.w - 40, Math.round(this.width * 0.88 - this.otter.w));
        this.otter.y = floorY - this.otter.h;
        this.otter.facing = -1;

        this.hailey.x = this.width + 100;
        this.hailey.y = floorY - 84;
    }

    handleResize() {
        const oldW = this.width;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        const floorY = this.height * 0.72;
        this.chad.y = floorY - this.chad.h;
        this.otter.y = floorY - this.otter.h;
        this.hailey.y = floorY - 84;

        // If rotating from portrait to landscape or match hasn't had hits yet, re-anchor to opposite sides
        if (!this.hasMoved || (this.chad.hp === 100 && this.otter.hp === 100) || oldW < 500) {
            this.resetPositions();
            this.introTimer = 1.2;
        } else {
            this.chad.x = Math.max(40, Math.min(this.width - 120, this.chad.x));
            this.otter.x = Math.max(40, Math.min(this.width - 120, this.otter.x));
        }
    }

    restartMatch() {
        this.chad.hp = 100;
        this.otter.hp = 100;
        this.chad.state = 'idle';
        this.otter.state = 'idle';
        this.otter.decapitated = false;
        this.otter.headFly = null;
        this.hailey.active = false;
        this.hailey.walkingAway = false;
        this.particles = [];
        this.matchState = 'FIGHTING';
        this.hasMoved = false;
        this.introTimer = 1.4;
        document.getElementById('btnFinish').classList.add('hidden');
        this.resetPositions();
        this.updateHUD();
    }

    bindControls() {
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) { this.keys.left = true; this.hasMoved = true; }
            if (['ArrowRight', 'KeyD'].includes(e.code)) { this.keys.right = true; this.hasMoved = true; }
            if (['KeyZ', 'KeyJ', 'Space'].includes(e.code)) this.triggerAttack('punch');
            if (['KeyX', 'KeyK'].includes(e.code)) this.triggerAttack('kick');
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = false;
        });

        const bindTouch = (id, action) => {
            const btn = document.getElementById(id);
            const start = (e) => {
                if (e.cancelable) e.preventDefault();
                this.sfx.init();
                this.hasMoved = true;
                if (action === 'left') this.keys.left = true;
                if (action === 'right') this.keys.right = true;
                if (action === 'punch') this.triggerAttack('punch');
                if (action === 'kick') this.triggerAttack('kick');
                btn.classList.add('touch-active');
            };
            const end = (e) => {
                if (e.cancelable) e.preventDefault();
                if (action === 'left') this.keys.left = false;
                if (action === 'right') this.keys.right = false;
                btn.classList.remove('touch-active');
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnPunch', 'punch');
        bindTouch('btnKick', 'kick');

        const finishBtn = document.getElementById('btnFinish');
        finishBtn.addEventListener('click', () => { this.sfx.init(); this.triggerFatality(); });
        finishBtn.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            this.sfx.init();
            this.triggerFatality();
        }, { passive: false });

        const resetBtn = document.getElementById('btnReset');
        resetBtn.addEventListener('click', () => { this.sfx.init(); this.restartMatch(); });
        resetBtn.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            this.sfx.init();
            this.restartMatch();
        }, { passive: false });
    }

    triggerAttack(type) {
        if (this.matchState !== 'FIGHTING' || this.chad.state !== 'idle') return;
        this.chad.state = type;

        const dist = Math.abs(this.chad.x - this.otter.x);
        if (dist < 105) {
            const dmg = type === 'punch' ? 12 : 18;
            this.otter.hp = Math.max(0, this.otter.hp - dmg);
            this.sfx.hit();
            this.shake = 0.18;
            this.spawnBlood(this.otter.x + 32, this.otter.y + 30, 16);
            this.updateHUD();

            if (this.otter.hp <= 0) {
                this.matchState = 'FINISH_AVAILABLE';
                document.getElementById('btnFinish').classList.remove('hidden');
            }
        }
        setTimeout(() => { if (this.matchState === 'FIGHTING') this.chad.state = 'idle'; }, 240);
    }

    triggerFatality() {
        document.getElementById('btnFinish').classList.add('hidden');
        this.matchState = 'FATALITY';
        this.sfx.fatality();
        this.shake = 0.6;

        this.chad.state = 'punch';
        this.spawnBlood(this.otter.x + 32, this.otter.y + 15, 55);

        this.otter.decapitated = true;
        this.otter.headFly = {
            x: this.otter.x + 20,
            y: this.otter.y + 10,
            vx: -90 - Math.random() * 50,
            vy: -480
        };

        setTimeout(() => {
            this.hailey.active = true;
        }, 1000);

        setTimeout(() => {
            this.hailey.walkingAway = true;
        }, 2600);
    }

    spawnBlood(x, y, count) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 60 + Math.random() * 180;
            this.particles.push({
                x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 50,
                color: '#ef4444', alpha: 1, size: 3 + Math.random() * 4
            });
        }
    }

    updateHUD() {
        const cPct = Math.max(0, Math.round((this.chad.hp / this.chad.maxHp) * 100));
        const oPct = Math.max(0, Math.round((this.otter.hp / this.otter.maxHp) * 100));
        document.getElementById('chadHpText').textContent = cPct + '%';
        document.getElementById('chadHpBar').style.width = cPct + '%';
        document.getElementById('otterHpText').textContent = oPct + '%';
        document.getElementById('otterHpBar').style.width = oPct + '%';
    }

    update(dt) {
        if (this.shake > 0) this.shake -= dt;
        if (this.introTimer > 0) {
            this.introTimer -= dt;
            return;
        }

        const c = this.chad;
        const o = this.otter;

        if (this.matchState === 'FIGHTING') {
            let move = 0;
            if (this.keys.left) move = -1;
            if (this.keys.right) move = 1;
            c.vx = move * 310;
            c.x = Math.max(30, Math.min(this.width - c.w - 30, c.x + c.vx * dt));

            c.facing = o.x > c.x ? 1 : -1;
            o.facing = c.x > o.x ? 1 : -1;

            if (o.attackCd > 0) o.attackCd -= dt;

            const dist = Math.abs(c.x - o.x);
            // Keep a minimum 72px spacing so the sprites never overlap into each other
            if (dist > 82) {
                const dir = c.x > o.x ? 1 : -1;
                o.x += dir * 135 * dt;
            } else if (o.attackCd <= 0 && o.hp > 0) {
                o.attackCd = 1.0 + Math.random() * 0.8;
                o.state = Math.random() > 0.5 ? 'punch' : 'kick';
                this.sfx.hit();
                c.hp = Math.max(0, c.hp - 12);
                this.spawnBlood(c.x + 32, c.y + 30, 14);
                this.updateHUD();

                setTimeout(() => { o.state = 'idle'; }, 240);

                if (c.hp <= 0) {
                    this.matchState = 'GAMEOVER';
                }
            }
        }

        if (o.headFly) {
            o.headFly.vy += 1200 * dt;
            o.headFly.x += o.headFly.vx * dt;
            o.headFly.y += o.headFly.vy * dt;
            if (o.headFly.y > this.height * 0.72) {
                o.headFly.y = this.height * 0.72;
                o.headFly.vx *= 0.6;
            }
        }

        if (this.hailey.active && !this.hailey.walkingAway) {
            if (this.hailey.x > c.x + 55) {
                this.hailey.x -= 140 * dt;
            }
        }

        if (this.hailey.walkingAway) {
            c.facing = 1;
            c.x += 110 * dt;
            this.hailey.x += 110 * dt;
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.x += pt.vx * dt;
            pt.vy += 800 * dt;
            pt.y += pt.vy * dt;
            pt.alpha -= 1.2 * dt;
            if (pt.alpha <= 0 || pt.y > this.height) this.particles.splice(i, 1);
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        ctx.save();
        if (this.shake > 0) {
            ctx.translate((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16);
        }

        if (this.arenaImg.complete && this.arenaImg.naturalWidth !== 0) {
            ctx.drawImage(this.arenaImg, 0, 0, this.width, this.height);
        } else {
            ctx.fillStyle = '#0f0505';
            ctx.fillRect(0, 0, this.width, this.height);
        }

        const c = this.chad;
        const o = this.otter;

        // Draw Chad (with lunge offset when punching/kicking)
        const chadLunge = (c.state !== 'idle') ? (c.facing * 12) : 0;
        const chadSpr = (c.facing === -1) ? this.sprites.chadL : this.sprites.chadR;
        ctx.drawImage(chadSpr, c.x + chadLunge, c.y);

        // Draw Captain Otter
        if (o.decapitated) {
            ctx.drawImage(this.sprites.otterBody, o.x, o.y + 24);
            if (o.headFly) {
                ctx.drawImage(this.sprites.otterHead, o.headFly.x, o.headFly.y);
            }
        } else {
            const otterLunge = (o.state !== 'idle') ? (o.facing * 12) : 0;
            const otterSpr = (o.facing === -1) ? this.sprites.otterL : this.sprites.otterR;
            ctx.drawImage(otterSpr, o.x + otterLunge, o.y);
        }

        // Draw Princess Hailey
        if (this.hailey.active) {
            ctx.drawImage(this.sprites.hailey, this.hailey.x, this.hailey.y);
            if (this.hailey.walkingAway) {
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(c.x + c.w - 10, c.y + 50);
                ctx.lineTo(this.hailey.x + 10, this.hailey.y + 50);
                ctx.stroke();
                ctx.font = '900 18px Orbitron';
                ctx.fillStyle = '#fde047';
                ctx.fillText('💖 WAGMI 💖', c.x + 10, c.y - 20);
            }
        }

        // Round Start Banner
        if (this.introTimer > 0) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(0, this.height * 0.35, this.width, 70);
            ctx.font = '900 32px Orbitron';
            ctx.fillStyle = '#facc15';
            ctx.textAlign = 'center';
            ctx.fillText(this.introTimer > 0.6 ? 'ROUND 1' : 'FIGHT!', this.width / 2, this.height * 0.35 + 46);
        }

        // Game Over Banner if Chad loses
        if (this.matchState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, this.height * 0.35, this.width, 80);
            ctx.font = '900 30px Orbitron';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText('YOU GOT RUGGED! TAP REMATCH', this.width / 2, this.height * 0.35 + 50);
        }

        this.particles.forEach(pt => {
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.onload = () => new RugArenaGame();
</script>
