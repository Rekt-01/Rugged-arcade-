<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rug Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Arial Black', Impact, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  #gameCanvas {
    width: 100%;
    height: auto;
    display: block;
    border: 4px solid #8B0000;
    box-shadow: 0 0 30px #ff0000;
    background: #111;
  }
  #ui {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 15px;
    pointer-events: none; z-index: 10;
  }
  .health-container { width: 40%; }
  .name { font-size: clamp(12px, 3vw, 18px); text-shadow: 2px 2px #000; margin-bottom: 2px; color: #ffcc00; }
  .health-bar { height: 18px; background: #222; border: 2px solid #fff; border-radius: 3px; overflow: hidden; }
  .health-fill { height: 100%; background: linear-gradient(90deg, #aa0000, #ff5500); width: 100%; transition: width 0.1s; }
  
  #exitBtn {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(139, 0, 0, 0.9); border: 2px solid #fff; color: #fff;
    padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
    border-radius: 5px; z-index: 25; text-decoration: none;
  }
  #exitBtn:hover { background: #ff0000; }

  #finishBtn {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(24px, 7vw, 48px); padding: 12px 24px;
    background: linear-gradient(#aa0000, #440000); color: #ffcc00;
    border: 4px solid #ffcc00; cursor: pointer; display: none; z-index: 100;
    text-shadow: 3px 3px #000; animation: pulse 0.4s infinite alternate; border-radius: 8px;
  }
  @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.06); } }

  #controls {
    position: absolute; bottom: 8px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; z-index: 20; pointer-events: none;
  }
  .btn-group { display: flex; gap: 8px; pointer-events: auto; }
  .ctrl-btn {
    width: 55px; height: 55px; background: rgba(30, 0, 0, 0.75); border: 2px solid rgba(255,255,255,0.9);
    color: #fff; font-size: 20px; font-weight: bold; border-radius: 10px;
    touch-action: none; user-select: none;
  }
  .ctrl-btn:active { background: rgba(200,0,0,0.9); transform: translateY(2px); }
</style>
</head>
<body>

<div id="gameWrap">
  <a href="main.html" id="exitBtn">EXIT</a>
  <div id="ui">
    <div class="health-container">
      <div class="name">CHAD</div>
      <div class="health-bar"><div class="health-fill" id="chadHealth"></div></div>
    </div>
    <div class="health-container">
      <div class="name" style="text-align:right">CAPTAIN OTTER</div>
      <div class="health-bar"><div class="health-fill" id="otterHealth" style="float:right"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="900" height="450"></canvas>
  <button id="finishBtn">FINISH HIM!</button>

  <div id="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="btnPunch">P</button>
      <button class="ctrl-btn" id="btnKick">K</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const finishBtn = document.getElementById("finishBtn");

// Load images using direct references from your uploaded project files
const arenaImg = new Image();
arenaImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/arena.png";

const chadImg = new Image();
chadImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/image_2.png"; //[span_0](start_span)[span_0](end_span)

const otterImg = new Image();
otterImg.src = "https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/image_3.png"; //[span_1](start_span)[span_1](end_span)

// Fallback safety drawers if external images block
let imagesReady = 0;
function assetLoaded() {
  imagesReady++;
  if (imagesReady >= 3) gameLoop();
}
arenaImg.onload = assetLoaded;
chadImg.onload = assetLoaded;
otterImg.onload = assetLoaded;
arenaImg.onerror = assetLoaded;
chadImg.onerror = assetLoaded;
otterImg.onerror = assetLoaded;

// Game State & Fighter Positions
let chad = { x: 150, y: 220, health: 100, maxHealth: 100, width: 120, height: 120, state: "idle", facing: 1 };
let otter = { x: 630, y: 220, health: 100, maxHealth: 100, width: 120, height: 120, state: "idle", facing: -1, aiTimer: 0 };
let finishing = false;
let bloodParticles = [];

let keys = {};
let tLeft = false, tRight = false;

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function setupTouch(id, downCb, upCb) {
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", e => { e.preventDefault(); downCb(); });
  btn.addEventListener("touchend", e => { e.preventDefault(); upCb(); });
  btn.addEventListener("mousedown", e => { e.preventDefault(); downCb(); });
  btn.addEventListener("mouseup", e => { e.preventDefault(); upCb(); });
}

setupTouch("btnLeft", () => tLeft = true, () => tLeft = false);
setupTouch("btnRight", () => tRight = true, () => tRight = false);
setupTouch("btnPunch", () => triggerAttack(chad, "punch"), () => {});
setupTouch("btnKick", () => triggerAttack(chad, "kick"), () => {});

window.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === 'z') triggerAttack(chad, "punch");
  if (e.key.toLowerCase() === 'x') triggerAttack(chad, "kick");
});

finishBtn.onclick = finishBtn.ontouchstart = () => {
  if (!finishing && otter.health <= 0) {
    finishing = true;
    finishBtn.style.display = "none";
    otter.y += 50;
    spawnBlood(otter.x + 60, otter.y + 40, 50);
  }
};

function triggerAttack(fighter, type) {
  if (fighter.state !== "idle" || finishing) return;
  fighter.state = type;
  
  setTimeout(() => {
    if (finishing) return;
    const target = (fighter === chad) ? otter : chad;
    if (Math.abs(fighter.x - target.x) < 120) {
      target.health = Math.max(0, target.health - (type === "punch" ? 12 : 18));
      updateBars();
      spawnBlood(target.x + 60, target.y + 60, 12);
      if (target === otter && otter.health <= 0) {
        finishBtn.style.display = "block";
      }
    }
  }, 100);

  setTimeout(() => { if (!finishing) fighter.state = "idle"; }, 250);
}

function updateBars() {
  document.getElementById("chadHealth").style.width = (chad.health / chad.maxHealth * 100) + "%";
  document.getElementById("otterHealth").style.width = (otter.health / otter.maxHealth * 100) + "%";
}

function spawnBlood(x, y, count) {
  for (let i = 0; i < count; i++) {
    bloodParticles.push({
      x, y,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 1) * 10,
      life: 40 + Math.random() * 30,
      size: 4 + Math.random() * 4
    });
  }
}

function updateAI() {
  if (finishing || otter.health <= 0) return;
  otter.aiTimer++;
  const dist = chad.x - otter.x;
  otter.facing = dist > 0 ? 1 : -1;

  if (Math.abs(dist) > 110) {
    otter.x += otter.facing * 2.5;
  } else if (otter.aiTimer % 70 === 0) {
    triggerAttack(otter, Math.random() > 0.5 ? "punch" : "kick");
  }
}

function update() {
  let moveDir = 0;
  if (tLeft || keys['arrowleft'] || keys['a']) moveDir = -1;
  if (tRight || keys['arrowright'] || keys['d']) moveDir = 1;

  if (moveDir !== 0 && chad.state === "idle") {
    chad.x += moveDir * 4.5;
    chad.facing = moveDir;
  }

  chad.x = Math.max(30, Math.min(canvas.width - 150, chad.x));
  otter.x = Math.max(30, Math.min(canvas.width - 150, otter.x));

  updateAI();

  for (let i = bloodParticles.length - 1; i >= 0; i--) {
    let p = bloodParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.7;
    p.life--;
    if (p.life <= 0) bloodParticles.splice(i, 1);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  if (arenaImg.complete && arenaImg.naturalWidth !== 0) {
    ctx.drawImage(arenaImg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw Chad
  ctx.save();
  if (chad.facing === -1) {
    ctx.translate(chad.x + chad.width, chad.y);
    ctx.scale(-1, 1);
    ctx.drawImage(chadImg, 0, 0, chad.width, chad.height);
  } else {
    ctx.drawImage(chadImg, chad.x, chad.y, chad.width, chad.height);
  }
  ctx.restore();

  // Draw Captain Otter
  ctx.save();
  if (otter.facing === -1) {
    ctx.translate(otter.x + otter.width, otter.y);
    ctx.scale(-1, 1);
    ctx.drawImage(otterImg, 0, 0, otter.width, otter.height);
  } else {
    ctx.drawImage(otterImg, otter.x, otter.y, otter.width, otter.height);
  }
  ctx.restore();

  // Blood
  ctx.fillStyle = "#cc0000";
  for (let p of bloodParticles) {
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

updateBars();
// Fallback kickstart in case image load events stall on mobile
setTimeout(gameLoop, 500);
</script>
</body>
</html>
