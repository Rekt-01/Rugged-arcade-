<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rugged Orphans | ApeChain</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #030108;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* iPhone / Mobile Full-Screen Arcade Container */
    .screen-wrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: 460px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(0, 84, 250, 0.28) 0%, transparent 55%),
        radial-gradient(circle at 50% 32%, #220b47 0%, #05010d 78%);
      box-shadow: 0 0 65px rgba(0, 84, 250, 0.35), inset 0 0 2px rgba(53, 212, 255, 0.3);
    }

    /* Subtle CRT Scanline + Vignette Overlay */
    .crt-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      background: 
        radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.62) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 100%, 100% 4px;
    }

    /* ==========================================
       TOP APECHAIN ARCADE HUD BAR
    ========================================== */
    .top-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .chain-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(8, 16, 42, 0.88);
      border: 1.5px solid #0054FA;
      box-shadow: 0 0 12px rgba(0, 84, 250, 0.55);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.44rem;
      color: #e2eeff;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.5; }
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-opensea-mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(32, 129, 226, 0.2);
      border: 1.5px solid #2081E2;
      box-shadow: 0 0 10px rgba(32, 129, 226, 0.45);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .hud-opensea-mini:hover,
    .hud-opensea-mini:active {
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(53, 212, 255, 0.85);
    }

    .credit-counter {
      font-size: 0.44rem;
      color: #ffd966;
      text-shadow: 0 0 8px rgba(255, 217, 102, 0.6);
      background: rgba(12, 5, 28, 0.82);
      border: 1.5px solid rgba(255, 217, 102, 0.45);
      padding: 6px 9px;
      border-radius: 6px;
    }

    /* ==========================================
       1. THREE.JS SPLASH, MINT BANNER & CHARACTER
    ========================================== */
    #intro-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      transition: opacity 0.55s ease;
    }
    #intro-layer.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #three-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ==========================================
       FREE MINT COMING SOON + OPENSEA PROMO CARD
    ========================================== */
    #mint-promo-card {
      position: absolute;
      top: 41.5%;
      left: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(14, 9, 36, 0.92) 0%, rgba(7, 3, 20, 0.95) 100%);
      border: 2px solid rgba(53, 212, 255, 0.75);
      border-radius: 10px;
      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(0, 84, 250, 0.4),
        inset 0 0 12px rgba(53, 212, 255, 0.15);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(-12px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1);
    }

    #mint-promo-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .coming-soon-ribbon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 6px 10px;
      background: linear-gradient(90deg, rgba(255, 42, 133, 0.22) 0%, rgba(255, 217, 102, 0.25) 50%, rgba(255, 42, 133, 0.22) 100%);
      border: 1.5px solid #ffd966;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 217, 102, 0.35);
    }

    .spark-dot {
      color: #ffd966;
      font-size: 0.52rem;
      animation: blink 1s infinite ease-in-out;
    }

    .coming-soon-text {
      font-size: 0.5rem;
      color: #ffd966;
      text-shadow: 1px 1px 0 #000, 0 0 8px rgba(255, 217, 102, 0.65);
      letter-spacing: 0.6px;
      text-align: center;
    }

    .mint-subtext {
      font-size: 0.42rem;
      color: #b8d9ff;
      letter-spacing: 0.4px;
      text-align: center;
      line-height: 1.4;
    }

    /* Official OpenSea CTA Button */
    .opensea-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 9px 14px;
      background: linear-gradient(90deg, #1868b7 0%, #2081E2 55%, #2b93ff 100%);
      border: 2px solid #ffffff;
      border-radius: 7px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.48rem;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 16px rgba(32, 129, 226, 0.65);
      transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .opensea-btn:hover,
    .opensea-btn:active {
      transform: translateY(-1px) scale(1.015);
      box-shadow: 0 0 24px rgba(53, 212, 255, 0.95);
      filter: brightness(1.08);
    }

    .opensea-logo-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
    }

    .ext-arrow {
      font-size: 0.52rem;
      color: #ffd966;
      margin-left: 2px;
    }

    /* ==========================================
       POP-UP CHARACTER & SPEECH BOX
    ========================================== */
    #char-popup {
      position: absolute;
      bottom: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(36px);
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.85, 0.25, 1);
    }
    #char-popup.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Character Sprite Stage */
    .sprite-stage {
      position: relative;
      width: 126px;
      height: 126px;
      margin-bottom: -8px;
      z-index: 2;
      cursor: pointer;
      filter: drop-shadow(0 0 12px rgba(53, 212, 255, 0.6));
      animation: charFloat 3s ease-in-out infinite;
    }

    @keyframes charFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    #char-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    /* Retro Arcade Dialogue Box */
    .speech-bubble {
      width: 100%;
      background: linear-gradient(180deg, rgba(16, 8, 38, 0.96) 0%, rgba(8, 3, 20, 0.98) 100%);
      border: 2.5px solid #35d4ff;
      box-shadow: 
        0 0 24px rgba(0, 84, 250, 0.45),
        inset 0 0 14px rgba(53, 212, 255, 0.22);
      border-radius: 10px;
      padding: 14px 14px 13px;
      color: #fff;
      font-size: 0.62rem;
      line-height: 1.65;
      text-align: left;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.2s ease;
    }

    .speech-bubble:active {
      transform: scale(0.98);
      border-color: #ffd966;
    }

    .speaker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .speaker-tag {
      display: inline-block;
      background: #ff2a85;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.44rem;
      border: 1.5px solid #fff;
      box-shadow: 2px 2px 0 #000;
    }

    .chain-pill {
      font-size: 0.42rem;
      color: #35d4ff;
      opacity: 0.9;
    }

    #dialogue-text {
      min-height: 40px;
      color: #ffd966;
      text-shadow: 1px 1px 0px #000;
    }

    #dialogue-text::after {
      content: '▋';
      color: #35d4ff;
      margin-left: 3px;
      animation: blink 0.6s infinite;
    }
    #dialogue-text.done::after {
      display: none;
    }

    /* Prominent CTA Button inside Speech Bubble */
    .tap-continue {
      margin-top: 10px;
      padding: 10px 12px;
      background: linear-gradient(90deg, #0054FA 0%, #35d4ff 100%);
      border: 2px solid #ffffff;
      border-radius: 6px;
      text-align: center;
      font-size: 0.54rem;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 0 15px rgba(53, 212, 255, 0.6);
      animation: pulseBtn 1.2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(53, 212, 255, 0.55); }
      50% { transform: scale(1.025); box-shadow: 0 0 22px rgba(255, 217, 102, 0.85); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* ==========================================
       2. VIDEO LAYER & ENTRANCE HOTSPOTS
    ========================================== */
    #video-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: #000;
    }

    #entrance-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .enter-hotspot {
      position: absolute;
      z-index: 30;
      display: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.01);
      -webkit-tap-highlight-color: rgba(255, 217, 102, 0.25);
    }

    .enter-hotspot.ready {
      display: block;
    }

    #coin-hotspot {
      bottom: 2%;
      left: 5%;
      width: 90%;
      height: 24%;
    }

    #door-hotspot {
      top: 30%;
      left: 55%;
      width: 40%;
      height: 40%;
    }

    /* Extra-compact screen adjustment (iPhone SE / small viewports) */
    @media (max-height: 700px) {
      #mint-promo-card {
        top: 38.5%;
        padding: 9px 12px;
        gap: 6px;
      }
      .sprite-stage {
        width: 104px;
        height: 104px;
      }
      .speech-bubble {
        padding: 11px 12px;
        font-size: 0.56rem;
      }
    }
  </style>
</head>

  <script>
    /* =====================================================
       PART 1: LOAD IMG_5633.png & BUILD LIP-SYNC MOUTH FRAMES
    ===================================================== */
    const charCanvas = document.getElementById('char-canvas');
    const charCtx = charCanvas.getContext('2d');
    charCtx.imageSmoothingEnabled = false;

    const mouthFrames = { closed: null, half: null, open: null };
    const charImg = new Image();
    charImg.crossOrigin = "anonymous";
    charImg.src = 'IMG_5633.png';

    charImg.onload = () => {
      const W = charImg.width;
      const H = charImg.height;
      charCanvas.width = W;
      charCanvas.height = H;
      charCtx.imageSmoothingEnabled = false;

      const baseCanvas = document.createElement('canvas');
      baseCanvas.width = W;
      baseCanvas.height = H;
      const bCtx = baseCanvas.getContext('2d');
      bCtx.imageSmoothingEnabled = false;
      bCtx.drawImage(charImg, 0, 0);

      let mouthBox = {
        x: Math.round(W * 0.53125),
        y: Math.round(H * 0.5625),
        w: Math.round(W * 0.15625),
        h: Math.max(2, Math.round(H * 0.03125))
      };

      try {
        const imgData = bCtx.getImageData(0, 0, W, H);
        const data = imgData.data;
        let minX = W, maxX = 0, minY = H, maxY = 0, foundMouth = false;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            if (r > 240 && g > 240 && b > 240) data[i + 3] = 0;

            if (x > W * 0.48 && x < W * 0.73 && y > H * 0.53 && y < H * 0.62) {
              if (r > 175 && g > 60 && g < 120 && b > 70 && b < 135) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
                foundMouth = true;
              }
            }
          }
        }
        bCtx.putImageData(imgData, 0, 0);

        if (foundMouth && (maxX - minX) > 4) {
          mouthBox = { x: minX, y: minY, w: maxX - minX + 1, h: Math.max(2, maxY - minY + 1) };
        }
      } catch (e) {}

      mouthFrames.closed = baseCanvas;

      function createTalkingFrame(openMultiplier) {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(baseCanvas, 0, 0);

        const pxUnit = mouthBox.h;
        const jawDrop = Math.round(pxUnit * (openMultiplier * 0.45));
        const openH = Math.round(pxUnit * openMultiplier);

        const jawX = Math.round(W * 0.40);
        const jawY = mouthBox.y + pxUnit;
        const jawW = Math.round(W * 0.32);
        const jawH = Math.round(H * 0.11);

        const jawSlice = document.createElement('canvas');
        jawSlice.width = jawW; jawSlice.height = jawH;
        jawSlice.getContext('2d').drawImage(baseCanvas, jawX, jawY, jawW, jawH, 0, 0, jawW, jawH);

        ctx.drawImage(jawSlice, jawX, jawY + jawDrop);
        ctx.fillStyle = '#1c0b19';
        ctx.fillRect(mouthBox.x, mouthBox.y + Math.round(pxUnit * 0.35), mouthBox.w, openH);
        ctx.fillStyle = '#cf5763';
        ctx.fillRect(mouthBox.x, mouthBox.y, mouthBox.w, Math.max(2, Math.round(pxUnit * 0.45)));
        ctx.fillRect(mouthBox.x, mouthBox.y + openH, mouthBox.w, Math.max(2, Math.round(pxUnit * 0.45)));

        if (openMultiplier > 1.1) {
          ctx.fillStyle = '#ff5c77';
          const tongueW = Math.round(mouthBox.w * 0.55);
          const tongueX = mouthBox.x + Math.round((mouthBox.w - tongueW) * 0.4);
          ctx.fillRect(tongueX, mouthBox.y + Math.round(openH * 0.6), tongueW, Math.max(2, Math.round(openH * 0.4)));
        }
        return c;
      }

      mouthFrames.half = createTalkingFrame(0.85);
      mouthFrames.open = createTalkingFrame(1.45);
      setMouthState('closed');
    };

    function setMouthState(state) {
      if (!mouthFrames[state]) return;
      charCtx.clearRect(0, 0, charCanvas.width, charCanvas.height);
      charCtx.drawImage(mouthFrames[state], 0, 0);
    }

    /* =====================================================
       PART 2: UPGRADED THREE.JS 3D PIXEL LOGO SLAM DROP
    ===================================================== */
    const container = document.getElementById('three-canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05010d, 0.0055);

    const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // High-contrast Arcade Cabinet Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(15, 45, 70);
    scene.add(keyLight);

    const cyanLight = new THREE.PointLight(0x35d4ff, 2.8, 260);
    cyanLight.position.set(-48, 52, 65);
    scene.add(cyanLight);

    const pinkLight = new THREE.PointLight(0xff2a85, 2.8, 260);
    pinkLight.position.set(48, 12, 65);
    scene.add(pinkLight);

    // Moving Retro Synthwave Floor Grid
    const gridHelper = new THREE.GridHelper(320, 32, 0x0054FA, 0x2d1259);
    gridHelper.position.y = -38;
    scene.add(gridHelper);

    // Rising Arcade Particles
    const starGeo = new THREE.BufferGeometry();
    const starCount = 180;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i]     = (Math.random() - 0.5) * 160;
      starPos[i + 1] = (Math.random() - 0.5) * 160;
      starPos[i + 2] = (Math.random() - 0.5) * 110 - 20;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0x35d4ff, size: 1.35, transparent: true, opacity: 0.75 })
    );
    scene.add(stars);

    const PIXEL_FONT = {
      'W': ["10001","10001","10101","11011","10001"],
      'E': ["11111","10000","11110","10000","11111"],
      'L': ["10000","10000","10000","10000","11111"],
      'C': ["01111","10000","10000","10000","01111"],
      'O': ["01110","10001","10001","10001","01110"],
      'M': ["10001","11011","10101","10001","10001"],
      'T': ["11111","00100","00100","00100","00100"],
      'R': ["11110","10001","11110","10010","10001"],
      'U': ["10001","10001","10001","10001","01110"],
      'G': ["01111","10000","10011","10001","01111"],
      'D': ["11110","10001","10001","10001","11110"],
      'P': ["11110","10001","11110","10000","10000"],
      'H': ["10001","10001","11111","10001","10001"],
      'A': ["01110","10001","11111","10001","10001"],
      'N': ["10001","11001","10101","10011","10001"],
      'S': ["01111","10000","01110","00001","11110"],
      'I': ["111","010","010","010","111"],
      ' ': ["000","000","000","000","000"]
    };

    // Positioned cleanly in the upper-top stage so the Mint Banner & Character fit below
    const lines = [
      { text: "WELCOME TO",  yOffset: 38.5, scale: 0.82, color: 0x35d4ff, rim: 0x99ecff, shade: 0x072d42, lineIndex: 0 },
      { text: "RUGGED",      yOffset: 28.0, scale: 1.52, color: 0xff2a85, rim: 0xff85b8, shade: 0x590429, lineIndex: 1 },
      { text: "ORPHANS",     yOffset: 16.5, scale: 1.38, color: 0xffd966, rim: 0xfff0b3, shade: 0x6e4200, lineIndex: 2 },
      { text: "ON APECHAIN", yOffset: 7.2,  scale: 0.80, color: 0x3b82f6, rim: 0x93c5fd, shade: 0x001f66, lineIndex: 3 }
    ];

    const voxels = [];
    lines.forEach((line) => {
      let totalUnits = 0;
      for (let ch of line.text) totalUnits += (PIXEL_FONT[ch] || PIXEL_FONT[' '])[0].length + 1;
      totalUnits -= 1;
      let cursorX = -totalUnits / 2;

      let charCounter = 0;
      for (let ch of line.text) {
        const glyph = PIXEL_FONT[ch] || PIXEL_FONT[' '];
        const gWidth = glyph[0].length;
        for (let row = 0; row < 5; row++) {
          for (let col = 0; col < gWidth; col++) {
            if (glyph[row][col] === '1') {
              const px = (cursorX + col) * line.scale;
              const py = (2 - row) * line.scale + line.yOffset;

              // Layer 1: Crisp Front Face Voxel
              voxels.push({
                tx: px, ty: py, tz: 0,
                scale: line.scale * 0.95,
                baseColor: new THREE.Color(line.color),
                isFront: true,
                lineIndex: line.lineIndex,
                charIndex: charCounter,
                row
              });
              // Layer 2: Glowing Bevel Middle Layer
              voxels.push({
                tx: px, ty: py, tz: -line.scale * 0.85,
                scale: line.scale * 0.98,
                baseColor: new THREE.Color(line.rim),
                isFront: false,
                lineIndex: line.lineIndex,
                charIndex: charCounter,
                row
              });
              // Layer 3: Deep 3D Extrusion Shadow Layer
              voxels.push({
                tx: px, ty: py, tz: -line.scale * 1.75,
                scale: line.scale * 0.96,
                baseColor: new THREE.Color(line.shade),
                isFront: false,
                lineIndex: line.lineIndex,
                charIndex: charCounter,
                row
              });
            }
          }
        }
        cursorX += gWidth + 1;
        charCounter++;
      }
    });

    const voxelMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.18, metalness: 0.52 }),
      voxels.length
    );
    scene.add(voxelMesh);

    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const flashColor = new THREE.Color(0xffffff);

    // Configure per-character arcade drop-in choreography
    voxels.forEach((v, i) => {
      v.sx = v.tx * 1.25;
      v.sy = v.ty + 56 + (4 - v.row) * 2.2;
      v.sz = v.tz + 28;
      // Staggered by line + character index for a snappy letter-by-letter slam
      v.delay = (v.lineIndex * 0.22) + (v.charIndex * 0.045) + (v.row * 0.012);

      dummy.position.set(v.sx, v.sy, v.sz);
      dummy.scale.set(0.001, 0.001, 0.001);
      dummy.updateMatrix();
      voxelMesh.setMatrixAt(i, dummy.matrix);
      voxelMesh.setColorAt(i, v.baseColor);
    });
    voxelMesh.instanceColor.needsUpdate = true;

    let baseCamY = 4;
    function updateCameraForMobile() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      camera.position.z = Math.max(84, (70 / 2) / (Math.tan((camera.fov * Math.PI) / 360) * camera.aspect));
      camera.position.y = baseCamY;
      renderer.setSize(w, h);
    }
    updateCameraForMobile();
    window.addEventListener('resize', updateCameraForMobile);

    // Snappy elastic arcade slam easing
    function easeOutBack(x) {
      const c1 = 1.95;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    let startTime = performance.now();
    let bannerTriggered = false;
    let popupTriggered = false;

    function animateThree(now) {
      requestAnimationFrame(animateThree);
      const elapsed = (now - startTime) / 1000;
      gridHelper.position.z = (elapsed * 15) % 10;
      stars.rotation.y = elapsed * 0.045;

      // Subtle camera impact shake when "RUGGED" and "ORPHANS" slam in
      let shakeY = 0;
      if (elapsed > 0.55 && elapsed < 1.15) {
        shakeY = Math.sin(elapsed * 55) * 0.45 * (1 - (elapsed - 0.55) / 0.6);
      }
      camera.position.y = baseCamY + shakeY;

      // Periodic white/gold light shimmer across the 3D letters
      const shineWaveX = ((elapsed * 48) % 160) - 80;

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        const localT = Math.max(0, Math.min(1, (elapsed - v.delay) / 0.52));

        if (localT <= 0) {
          dummy.scale.set(0.001, 0.001, 0.001);
          dummy.updateMatrix();
          voxelMesh.setMatrixAt(i, dummy.matrix);
          continue;
        }

        const ease = easeOutBack(localT);
        const idleHover = localT === 1 ? Math.sin(elapsed * 3.2 + v.tx * 0.14 + v.lineIndex) * 0.26 : 0;

        dummy.position.set(
          v.sx + (v.tx - v.sx) * ease,
          v.sy + (v.ty - v.sy) * ease + idleHover,
          v.sz + (v.tz - v.sz) * ease
        );
        dummy.rotation.set((1 - localT) * 2.1, (1 - localT) * 0.6, 0);

        // Impact squash & stretch right as the voxel locks in
        const impactPop = (localT > 0.78 && localT < 0.98) ? 1.12 : 1.0;
        dummy.scale.set(v.scale * impactPop, v.scale * impactPop, v.scale);
        dummy.updateMatrix();
        voxelMesh.setMatrixAt(i, dummy.matrix);

        // White-hot impact flash when locking into place + continuous specular sweep
        if (v.isFront) {
          if (localT > 0.8 && localT < 1.0) {
            const flashBlend = 1 - Math.abs(localT - 0.9) * 10;
            tempColor.copy(v.baseColor).lerp(flashColor, Math.max(0, flashBlend * 0.85));
            voxelMesh.setColorAt(i, tempColor);
          } else if (localT === 1) {
            const dist = Math.abs(v.tx - shineWaveX);
            if (dist < 6.5) {
              const blend = (1 - dist / 6.5) * 0.6;
              tempColor.copy(v.baseColor).lerp(flashColor, blend);
              voxelMesh.setColorAt(i, tempColor);
            } else {
              voxelMesh.setColorAt(i, v.baseColor);
            }
          }
        }
      }

      voxelMesh.instanceMatrix.needsUpdate = true;
      voxelMesh.instanceColor.needsUpdate = true;
      voxelMesh.rotation.y = Math.sin(elapsed * 1.15) * 0.09;

      // Reveal the "FREE MINT COMING SOON + OPENSEA" banner right as the logo finishes dropping
      if (elapsed > 1.15 && !bannerTriggered) {
        bannerTriggered = true;
        document.getElementById('mint-promo-card').classList.add('show');
      }

      // Trigger the talking character right after
      if (elapsed > 1.45 && !popupTriggered) {
        popupTriggered = true;
        triggerCharacterPopup();
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animateThree);

    /* =====================================================
       PART 3: SINGLE STREAMLINED SPEECH BUBBLE
    ===================================================== */
    const WELCOME_MESSAGE = "Welcome to Rugged Orphans! Free mint dropping in the coming weeks. Tap to skate in!";
    let typeInterval = null;

    function typeWelcomeMessage() {
      const dialogueEl = document.getElementById('dialogue-text');
      const tapPrompt = document.getElementById('tap-prompt');

      dialogueEl.textContent = '';
      dialogueEl.classList.remove('done');

      let charIndex = 0;
      let syllableToggle = 0;

      typeInterval = setInterval(() => {
        const ch = WELCOME_MESSAGE[charIndex];
        dialogueEl.textContent += ch;
        charIndex++;

        // Keep mouth lip-sync animation moving while typing
        if (/[a-zA-Z0-9]/.test(ch)) {
          syllableToggle++;
          if (syllableToggle % 3 === 0) setMouthState('closed');
          else if (/[aeiouAEIOU]/.test(ch)) setMouthState('open');
          else setMouthState('half');
        } else {
          setMouthState('closed');
        }

        if (charIndex >= WELCOME_MESSAGE.length) {
          clearInterval(typeInterval);
          setMouthState('closed');
          dialogueEl.classList.add('done');
          tapPrompt.style.display = 'block';
        }
      }, 38);
    }

    function triggerCharacterPopup() {
      const popup = document.getElementById('char-popup');
      popup.classList.add('show');
      typeWelcomeMessage();
    }

    /* =====================================================
       PART 4: PLAY VIDEO ONCE & NAVIGATE TO MAIN.HTML
    ===================================================== */
    const introLayer = document.getElementById('intro-layer');
    const video = document.getElementById('entrance-video');
    const coinHotspot = document.getElementById('coin-hotspot');
    const doorHotspot = document.getElementById('door-hotspot');
    let videoStarted = false;

    function startEntranceVideo(e) {
      if (videoStarted) return;
      videoStarted = true;

      if (typeInterval) clearInterval(typeInterval);

      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      setMouthState('closed');
      introLayer.classList.add('fade-out');

      setTimeout(() => {
        introLayer.style.display = 'none';
      }, 600);

      setTimeout(() => {
        coinHotspot.classList.add('ready');
        doorHotspot.classList.add('ready');
      }, 1000);

      video.currentTime = 0;
      video.loop = false;
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });
    }

    // Ensure clicking the OpenSea links opens OpenSea cleanly without triggering the video
    document.querySelectorAll('.opensea-btn, .hud-opensea-mini').forEach((link) => {
      link.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    });

    // Clicking either the speech bubble or the character starts the skate-in video
    document.querySelector('.speech-bubble').addEventListener('click', startEntranceVideo);
    document.querySelector('.sprite-stage').addEventListener('click', startEntranceVideo);

    function goToMainArcade(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + basePath + 'main.html';
    }

    coinHotspot.addEventListener('click', goToMainArcade);
    coinHotspot.addEventListener('touchend', goToMainArcade);
    doorHotspot.addEventListener('click', goToMainArcade);
    doorHotspot.addEventListener('touchend', goToMainArcade);
  </script>
</body>
</html>
