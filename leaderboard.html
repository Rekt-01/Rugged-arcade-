<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Scores — Rugged Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      color: #eee;
    }

    .display {
      width: 100%;
      max-width: 480px;
      padding: 30px 20px;
      position: relative;
    }

    .display::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.1) 0px,
        rgba(0,0,0,0.1) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 16px;
      color: #ffcc00;
      margin-bottom: 8px;
      text-shadow: 0 0 8px #ffaa00;
    }

    .sub {
      text-align: center;
      font-size: 8px;
      color: #666;
      margin-bottom: 12px;
    }

    .coming {
      text-align: center;
      font-size: 10px;
      color: #ff3366;
      margin-bottom: 22px;
      text-shadow: 0 0 8px #ff3366;
      animation: flash 0.7s steps(1) infinite;
    }

    @keyframes flash {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    th {
      text-align: left;
      color: #00aaff;
      padding: 8px 6px;
      border-bottom: 2px solid #333;
      font-size: 9px;
    }

    td {
      padding: 10px 6px;
      border-bottom: 1px solid #222;
    }

    tr:nth-child(1) td { color: #ffdd44; }
    tr:nth-child(2) td { color: #ddd; }
    tr:nth-child(3) td { color: #cc8844; }

    .rank { width: 40px; color: #555; }
    .score { text-align: right; }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #00aaff;
      font-size: 9px;
      text-decoration: none;
    }
    .back:hover { color: #ffcc00; }
  </style>
</head>
<body>
  <div class="display">
    <h1>HIGH SCORES</h1>
    <div class="sub">RUGGED ARCADE</div>
    <div class="coming">COMING SOON</div>

    <table>
      <thead>
        <tr>
          <th class="rank">RANK</th>
          <th>NAME</th>
          <th class="score">SCORE</th>
        </tr>
      </thead>
      <tbody>
        <tr><td class="rank">1</td><td>REKT</td><td class="score">999999</td></tr>
        <tr><td class="rank">2</td><td>MARK 🐊</td><td class="score">850420</td></tr>
        <tr><td class="rank">3</td><td>SAL</td><td class="score">777777</td></tr>
        <tr><td class="rank">4</td><td>TRUE G</td><td class="score">650000</td></tr>
        <tr><td class="rank">5</td><td>APE LORD</td><td class="score">420069</td></tr>
        <tr><td class="rank">6</td><td>RUG PULL</td><td class="score">333333</td></tr>
        <tr><td class="rank">7</td><td>DEGEN</td><td class="score">250000</td></tr>
        <tr><td class="rank">8</td><td>WAGMI</td><td class="score">180000</td></tr>
        <tr><td class="rank">9</td><td>NGMI</td><td class="score">100000</td></tr>
        <tr><td class="rank">10</td><td>----</td><td class="score">000000</td></tr>
      </tbody>
    </table>

    <a href="main.html" class="back">← BACK TO ARCADE</a>
  </div>
</body>
</html>
