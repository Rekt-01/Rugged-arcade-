<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DON'T FUMBLE THE BAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #030712;
            font-family: 'Rajdhani', sans-serif;
            touch-action: manipulation;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            image-rendering: pixelated;
        }
        .dex-panel {
            background: rgba(3, 7, 18, 0.94);
            border: 1px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            backdrop-filter: blur(10px);
        }
        .dex-btn {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(59, 130, 246, 0.45));
            border: 2px solid rgba(52, 211, 153, 1);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .dex-btn:active, .touch-active {
            transform: scale(0.95);
            background: rgba(16, 185, 129, 0.85);
        }
        .dex-exit-btn {
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.4), rgba(159, 18, 57, 0.5));
            border: 1px solid rgba(244, 63, 94, 0.9);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
            text-decoration: none;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .is-hidden {
            display: none !important;
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="app-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP PORTRAIT DEX HUD BAR -->
    <header class="relative z-10 w-full px-3 pt-3 pointer-events-none flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2 dex-panel rounded-xl px-3 py-2 pointer-events-auto">
            <div class="flex items-center gap-2.5">
                <a href="main.html" class="dex-exit-btn rounded-lg px-2.5 py-1.5 font-orbitron text-[10px] font-black text-rose-200 tracking-wider flex items-center justify-center shrink-0">
                    EXIT
                </a>
                <div>
                    <div class="text-[9px] text-emerald-400 font-orbitron font-bold">BAG VALUE</div>
                    <div id="scoreDisplay" class="font-orbitron text-xs sm:text-base font-black text-emerald-300">$0</div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div>
                    <div class="text-[9px] text-amber-400 font-orbitron font-bold">BANANAS 🍌</div>
                    <div id="bananasDisplay" class="font-orbitron text-xs sm:text-base font-black text-amber-300">0</div>
                </div>
                <div class="border-l border-slate-700 pl-3">
                    <div class="text-[9px] text-rose-400 font-orbitron font-bold">TIME</div>
                    <div id="timerDisplay" class="font-orbitron text-xs sm:text-base font-black text-rose-400">30s</div>
                </div>
            </div>
        </div>
    </header>

    <!-- START MODAL -->
    <div id="startModal" class="absolute inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 pointer-events-auto">
        <div class="dex-panel rounded-2xl p-6 max-w-sm w-full text-center flex flex-col items-center gap-4 border-emerald-500/60 pointer-events-auto">
            <div class="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs font-orbitron">
                30-SECOND RUSH
            </div>
            <h1 class="font-orbitron text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-cyan-300 to-amber-300">
                DON'T FUMBLE THE BAG
            </h1>
            <p class="text-xs text-slate-300 leading-relaxed">
                Catch as many falling bananas 🍌 as you can before the 30-second timer runs out. Watch out—Captain Otter is waiting to rug the chart!
            </p>
            <div class="w-full flex flex-col gap-2.5 pointer-events-auto">
                <button id="btnStart" type="button" onclick="window.startTradingGame(event)" class="dex-btn w-full py-3.5 rounded-xl font-orbitron text-sm font-black text-emerald-200 tracking-wider">
                    START TRADING
                </button>
                <a href="main.html" class="dex-exit-btn w-full py-2.5 rounded-xl font-orbitron text-xs font-bold text-rose-200 block text-center">
                    EXIT TO MAIN MENU
                </a>
            </div>
        </div>
    </div>

    <!-- GAME OVER BOTTOM PANEL -->
    <div id="gameOverPanel" class="is-hidden relative z-40 w-full max-w-sm px-4 pb-4 pointer-events-auto mt-auto">
        <div class="dex-panel rounded-2xl p-4 text-center flex flex-col items-center gap-3 border-rose-500/80 shadow-2xl">
            <p id="gameOverText" class="text-xs sm:text-sm text-slate-200 font-bold"></p>
            <div class="w-full flex gap-2.5">
                <button id="btnPlayAgain" type="button" onclick="window.startTradingGame(event)" class="dex-btn flex-1 py-3 rounded-xl font-orbitron text-xs sm:text-sm font-black text-emerald-200 tracking-wider">
                    PLAY AGAIN
                </button>
                <a href="main.html" class="dex-exit-btn flex-1 py-3 rounded-xl font-orbitron text-xs sm:text-sm font-bold text-rose-200 flex items-center justify-center">
                    EXIT
                </a>
            </div>
        </div>
    </div>

    <!-- PORTRAIT TOUCH CONTROLS -->
    <footer id="touchFooter" class="relative z-10 w-full px-4 pb-4 flex items-center justify-between pointer-events-none">
        <button id="btnLeft" type="button" class="dex-btn w-24 h-20 rounded-2xl flex items-center justify-center font-orbitron text-3xl font-black text-white pointer-events-auto">
            &#9664;
        </button>
        <button id="btnRight" type="button" class="dex-btn w-24 h-20 rounded-2xl flex items-center justify-center font-orbitron text-3xl font-black text-white pointer-events-auto">
            &#9654;
        </button>
    </footer>
</div>

function buildSprite(grid, palette, scale) {
    const c = document.createElement('canvas');
    c.width = grid[0].length * scale;
    c.height = grid.length * scale;
    const ctx = c.getContext('2d');
    for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (palette[ch]) {
                ctx.fillStyle = palette[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    tone(freq, endFreq, dur, type = 'sine', vol = 0.12) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        } catch (e) {}
    }
    catchBanana() { this.tone(540, 920, 0.1, 'sine', 0.15); }
    rugCrash() {
        [200, 140, 80, 45].forEach((f, i) => {
            setTimeout(() => this.tone(f, f * 0.5, 0.28, 'sawtooth', 0.22), i * 130);
        });
    }
}

class DontFumbleTheBagGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        this.chadSprite = buildSprite(CHAD_GRID, CHAD_PALETTE, 3.5);
        // Scale 5 -> 160x160 crisp 32x32 pixel-art Captain Otter
        this.otterLaugh1 = buildSprite(OTTER_32_SMIRK, OTTER_PALETTE, 5);
        this.otterLaugh2 = buildSprite(OTTER_32_LAUGH, OTTER_PALETTE, 5);

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.keys = { left: false, right: false };
        this.bananas = [];
        this.particles = [];
        this.popups = [];
        this.chartPoints = [];

        this.gameState = 'MENU';
        this.score = 0;
        this.bananasCaught = 0;
        this.timeLeft = 30.0;
        this.spawnTimer = 0;
        this.chartTimer = 0;
        this.rugAnim = 0;
        this.candleHeight = 0;

        this.chad = {
            x: this.width / 2 - 28,
            y: 0,
            w: 56,
            h: 74,
            speed: 480
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindControls();

        let val = this.height * 0.48;
        for (let x = 0; x <= this.width + 40; x += 25) {
            val += (Math.random() - 0.47) * 32;
            val = Math.max(this.height * 0.22, Math.min(this.height * 0.7, val));
            this.chartPoints.push({ x, y: val });
        }

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.chad.y = this.height * 0.75 - this.chad.h;
    }

    bindControls() {
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = true;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = false;
        });

        const bindHold = (id, dir) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const down = (e) => {
                if (e.cancelable) e.preventDefault();
                this.sfx.init();
                this.keys[dir] = true;
                btn.classList.add('touch-active');
            };
            const up = (e) => {
                if (e.cancelable) e.preventDefault();
                this.keys[dir] = false;
                btn.classList.remove('touch-active');
            };
            btn.addEventListener('touchstart', down, { passive: false });
            btn.addEventListener('touchend', up, { passive: false });
            btn.addEventListener('touchcancel', up, { passive: false });
            btn.addEventListener('mousedown', down);
            btn.addEventListener('mouseup', up);
            btn.addEventListener('mouseleave', up);
        };

        bindHold('btnLeft', 'left');
        bindHold('btnRight', 'right');
    }

    startNewGame() {
        this.sfx.init();
        document.getElementById('startModal').classList.add('is-hidden');
        document.getElementById('gameOverPanel').classList.add('is-hidden');
        document.getElementById('touchFooter').classList.remove('is-hidden');

        this.score = 0;
        this.bananasCaught = 0;
        this.timeLeft = 30.0;
        this.bananas = [];
        this.particles = [];
        this.popups = [];
        this.rugAnim = 0;
        this.candleHeight = 0;
        this.chad.x = this.width / 2 - 28;
        this.gameState = 'PLAYING';
        this.updateHUD();
    }

    triggerRugPull() {
        this.timeLeft = 0;
        this.gameState = 'GAMEOVER';
        this.sfx.rugCrash();
        this.bananas = [];

        document.getElementById('touchFooter').classList.add('is-hidden');
        document.getElementById('gameOverText').textContent =
            `You stacked ${this.bananasCaught} bananas ($${this.score.toLocaleString()}) before Captain Otter rugged the chart!`;
        document.getElementById('gameOverPanel').classList.remove('is-hidden');
    }

    updateHUD() {
        document.getElementById('scoreDisplay').textContent = '$' + this.score.toLocaleString();
        document.getElementById('bananasDisplay').textContent = this.bananasCaught;
        document.getElementById('timerDisplay').textContent = Math.ceil(this.timeLeft) + 's';
    }

    spawnBanana() {
        const x = 30 + Math.random() * (this.width - 60);
        this.bananas.push({
            x,
            y: -30,
            vy: 230 + Math.random() * 140 + this.bananasCaught * 4,
            size: 26,
            rot: Math.random() * Math.PI
        });
    }

    spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 40 + Math.random() * 90;
            this.particles.push({
                x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 30,
                color, alpha: 1, size: 3 + Math.random() * 3
            });
        }
    }

    update(dt) {
        this.chartTimer += dt;
        if (this.chartTimer > 0.07) {
            this.chartTimer = 0;
            this.chartPoints.forEach(pt => pt.x -= 3);
            if (this.chartPoints.length > 0 && this.chartPoints[0].x < -30) {
                this.chartPoints.shift();
                const last = this.chartPoints[this.chartPoints.length - 1];
                let nextY = last.y + (Math.random() - 0.48) * 38;
                nextY = Math.max(this.height * 0.22, Math.min(this.height * 0.7, nextY));
                this.chartPoints.push({ x: last.x + 25, y: nextY });
            }
        }

        if (this.gameState === 'PLAYING') {
            this.timeLeft -= dt;
            if (this.timeLeft <= 0) {
                this.triggerRugPull();
                return;
            }
            this.updateHUD();

            let move = 0;
            if (this.keys.left) move = -1;
            if (this.keys.right) move = 1;
            this.chad.x += move * this.chad.speed * dt;
            this.chad.x = Math.max(10, Math.min(this.width - this.chad.w - 10, this.chad.x));

            this.spawnTimer += dt;
            if (this.spawnTimer > Math.max(0.32, 1.15 - this.bananasCaught * 0.025)) {
                this.spawnTimer = 0;
                this.spawnBanana();
            }

            const bagBox = {
                x: this.chad.x - 4,
                y: this.chad.y + 20,
                w: this.chad.w + 24,
                h: 50
            };

            for (let i = this.bananas.length - 1; i >= 0; i--) {
                const b = this.bananas[i];
                b.y += b.vy * dt;
                b.rot += dt * 2.5;

                if (b.x + b.size / 2 > bagBox.x && b.x - b.size / 2 < bagBox.x + bagBox.w &&
                    b.y + b.size / 2 > bagBox.y && b.y - b.size / 2 < bagBox.y + bagBox.h) {
                    this.bananasCaught++;
                    this.score += 300;
                    this.sfx.catchBanana();
                    this.spawnParticles(b.x, b.y, '#f5c71a');
                    this.popups.push({ x: b.x, y: b.y, text: '+$300', alpha: 1 });
                    this.bananas.splice(i, 1);
                    this.updateHUD();
                    continue;
                }

                if (b.y > this.height * 0.78) {
                    this.spawnParticles(b.x, this.height * 0.75, '#ef4444');
                    this.bananas.splice(i, 1);
                }
            }
        } else if (this.gameState === 'GAMEOVER') {
            this.rugAnim += dt;
            this.candleHeight = Math.min(this.height * 0.85, this.candleHeight + this.height * 1.8 * dt);
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.x += pt.vx * dt;
            pt.vy += 400 * dt;
            pt.y += pt.vy * dt;
            pt.alpha -= 1.5 * dt;
            if (pt.alpha <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.popups.length - 1; i >= 0; i--) {
            const p = this.popups[i];
            p.y -= 45 * dt;
            p.alpha -= 1.2 * dt;
            if (p.alpha <= 0) this.popups.splice(i, 1);
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        // 1. DEX Dark Grid Background
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.strokeStyle = 'rgba(16, 185, 129, 0.09)';
        ctx.lineWidth = 1;
        for (let x = 0; x < this.width; x += 55) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.height); ctx.stroke();
        }
        for (let y = 0; y < this.height; y += 55) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke();
        }

        // 2. Live DEX Line Chart
        ctx.save();
        ctx.strokeStyle = this.gameState === 'GAMEOVER' ? '#ef4444' : '#10b981';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 14;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        for (let i = 0; i < this.chartPoints.length; i++) {
            const pt = this.chartPoints[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.restore();

        // Floor Line
        const floorY = this.height * 0.75;
        ctx.strokeStyle = this.gameState === 'GAMEOVER' ? '#ef4444' : '#34d399';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(this.width, floorY);
        ctx.stroke();

        // 3. Falling Bananas
        this.bananas.forEach(b => {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            ctx.font = '26px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍌', 0, 0);
            ctx.restore();
        });

        // 4. Chad Carrying The Money Bag
        ctx.drawImage(this.chadSprite, this.chad.x, this.chad.y);
        ctx.save();
        ctx.translate(this.chad.x + 22, this.chad.y + 40);
        ctx.fillStyle = '#d97706';
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        ctx.fillRect(0, 0, 32, 30);
        ctx.strokeRect(0, 0, 32, 30);
        ctx.fillStyle = '#fef08a';
        ctx.font = '900 14px Orbitron';
        ctx.textAlign = 'center';
        ctx.fillText('$', 16, 20);
        ctx.restore();

        // Floating Score Popups
        this.popups.forEach(p => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.font = '900 14px Orbitron';
            ctx.fillStyle = '#34d399';
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
            ctx.restore();
        });

        // 5. GAME OVER: GIANT RED CANDLE CRASH + EXACT 32x32 LAUGHING CAPTAIN OTTER + SIGN
        if (this.gameState === 'GAMEOVER') {
            ctx.save();
            ctx.fillStyle = 'rgba(127, 29, 29, 0.55)';
            ctx.fillRect(0, 0, this.width, this.height);

            // Giant Red Candlestick Wick & Body
            const candleW = Math.min(180, this.width * 0.44);
            const candleX = this.width / 2 - candleW / 2;
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(this.width / 2 - 6, 40, 12, this.candleHeight + 40);

            ctx.fillStyle = '#ef4444';
            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = 3;
            ctx.fillRect(candleX, 75, candleW, this.candleHeight);
            ctx.strokeRect(candleX, 75, candleW, this.candleHeight);

            // Bouncing Laughing 32x32 Captain Otter (Transparent Background!)
            const bounce = Math.abs(Math.sin(this.rugAnim * 10)) * 14;
            const otterY = this.height * 0.35 - bounce;
            const otterSpr = Math.floor(this.rugAnim * 7) % 2 === 0 ? this.otterLaugh1 : this.otterLaugh2;
            ctx.drawImage(otterSpr, this.width / 2 - otterSpr.width / 2, otterY);

            // Laughing Text Bubbles
            ctx.fillStyle = '#fde047';
            ctx.font = '900 15px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('HAHAHA!', this.width / 2 - 95, otterY + 35);
            ctx.fillText('RUGGED!', this.width / 2 + 95, otterY + 55);

            // Sign Above Otter: "THE DEV RUGGED!"
            const signW = Math.min(310, this.width - 30);
            const signH = 58;
            const signX = this.width / 2 - signW / 2;
            const signY = otterY - 65;

            ctx.fillStyle = '#090d16';
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 4;
            ctx.fillRect(signX, signY, signW, signH);
            ctx.strokeRect(signX, signY, signW, signH);

            ctx.fillStyle = '#ef4444';
            ctx.font = '900 20px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('THE DEV RUGGED!', this.width / 2, signY + 37);
            ctx.restore();
        }

        // Particles
        this.particles.forEach(pt => {
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        });
        ctx.globalAlpha = 1;
    }

    loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

const game = new DontFumbleTheBagGame();

window.startTradingGame = function(e) {
    if (e && e.cancelable) e.preventDefault();
    game.startNewGame();
};

document.getElementById('btnStart').addEventListener('touchstart', window.startTradingGame, { passive: false });
document.getElementById('btnPlayAgain').addEventListener('touchstart', window.startTradingGame, { passive: false });
</script>
