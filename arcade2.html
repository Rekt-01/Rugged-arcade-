<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DON'T FUMBLE THE BAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #030712;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #app-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            image-rendering: pixelated;
        }
        .dex-panel {
            background: rgba(3, 7, 18, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(8px);
        }
        .dex-btn {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(59, 130, 246, 0.35));
            border: 2px solid rgba(52, 211, 153, 0.9);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            pointer-events: auto;
        }
        .dex-btn:active {
            transform: scale(0.95);
            background: rgba(16, 185, 129, 0.7);
        }
        .dex-exit-btn {
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.3), rgba(159, 18, 57, 0.4));
            border: 1px solid rgba(244, 63, 94, 0.8);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
            text-decoration: none;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-white antialiased">

<div id="app-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- TOP PORTRAIT DEX HUD BAR -->
    <header class="relative z-10 w-full px-3 pt-3 pointer-events-none flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2 dex-panel rounded-xl px-3 py-2 pointer-events-auto">
            <div class="flex items-center gap-2.5">
                <a href="main.html" class="dex-exit-btn rounded-lg px-2.5 py-1.5 font-orbitron text-[10px] font-black text-rose-200 tracking-wider flex items-center justify-center shrink-0">
                    EXIT
                </a>
                <div>
                    <div class="text-[9px] text-emerald-400 font-orbitron font-bold">BAG VALUE</div>
                    <div id="scoreDisplay" class="font-orbitron text-xs sm:text-base font-black text-emerald-300">$0</div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div>
                    <div class="text-[9px] text-amber-400 font-orbitron font-bold">BANANAS 🍌</div>
                    <div id="bananasDisplay" class="font-orbitron text-xs sm:text-base font-black text-amber-300">0</div>
                </div>
                <div class="border-l border-slate-700 pl-3">
                    <div class="text-[9px] text-rose-400 font-orbitron font-bold">TIME</div>
                    <div id="timerDisplay" class="font-orbitron text-xs sm:text-base font-black text-rose-400">30s</div>
                </div>
            </div>
        </div>
    </header>

    <!-- START / GAME OVER MODAL -->
    <div id="modalScreen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 pointer-events-auto">
        <div class="dex-panel rounded-2xl p-6 max-w-sm w-full text-center flex flex-col items-center gap-4 border-emerald-500/60 pointer-events-auto">
            <div id="modalBadge" class="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs font-orbitron">
                30-SECOND RUSH
            </div>
            <h1 id="modalTitle" class="font-orbitron text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-cyan-300 to-amber-300">
                DON'T FUMBLE THE BAG
            </h1>
            <p id="modalText" class="text-xs text-slate-300 leading-relaxed">
                Catch as many falling bananas 🍌 as you can before the 30-second timer runs out. Watch out for the rug pull!
            </p>
            <div class="w-full flex flex-col gap-2.5">
                <button id="btnAction" class="dex-btn w-full py-3 rounded-xl font-orbitron text-sm font-black text-emerald-200 tracking-wider">
                    START TRADING
                </button>
                <a href="main.html" class="dex-exit-btn w-full py-2.5 rounded-xl font-orbitron text-xs font-bold text-rose-200 block text-center">
                    EXIT TO MAIN MENU
                </a>
            </div>
        </div>
    </div>

    <!-- PORTRAIT TOUCH CONTROLS -->
    <footer class="relative z-10 w-full px-4 pb-4 flex items-center justify-between pointer-events-none">
        <button id="btnLeft" class="dex-btn w-24 h-20 rounded-2xl flex items-center justify-center font-orbitron text-3xl font-black text-white pointer-events-auto">
            &#9664;
        </button>
        <button id="btnRight" class="dex-btn w-24 h-20 rounded-2xl flex items-center justify-center font-orbitron text-3xl font-black text-white pointer-events-auto">
            &#9654;
        </button>
    </footer>
</div>

<script>
const CHAD_PALETTE = {
    'K': '#090a0f', 'W': '#ffffff', 'G': '#b8d8d8', 'B': '#1d38b8',
    'J': '#1e293b', 'R': '#e61919', 'S': '#eac096', 'T': '#c49668',
    'P': '#d9536f', 'O': '#e06d1a'
};

const CHAD_GRID = [
    "......KKKKKK....",
    "....KKBBBBWWKK..",
    "...KBWBBWBWRRRK.",
    "..KBBWBWBWBRWWRK",
    "KKKBBBBBBBBRRRRK",
    "KWWKSSSSSSSSSSK.",
    "KRRKKKKKKKKKKKK.",
    ".KKKSSKKGGKKGGKK",
    "..KTSSKKGGKKGGKK",
    "..KTSSKKKKKKSSK.",
    "...KSSSSSSPPSSK.",
    "..KKRKKKKKKKKRKK",
    ".KRRRRKSSSSKRRRR",
    ".KBBBBKORWROKWRW",
    ".KBBBBKORRROKRRR",
    ".KBBBBKOWWWOKWWW",
    "..KKKKKKKKKKKK..",
    "..KJJJJKKJJJJK..",
    "..KJJJJKKJJJJK..",
    "..KRRRRKKRRRRK..",
    "..KWWWWKKWWWWK.."
];

function createChadSprite(scale = 3.5) {
    const c = document.createElement('canvas');
    c.width = 16 * scale;
    c.height = CHAD_GRID.length * scale;
    const ctx = c.getContext('2d');
    for (let r = 0; r < CHAD_GRID.length; r++) {
        const row = CHAD_GRID[r];
        for (let col = 0; col < row.length; col++) {
            const ch = row[col];
            if (CHAD_PALETTE[ch]) {
                ctx.fillStyle = CHAD_PALETTE[ch];
                ctx.fillRect(col * scale, r * scale, scale, scale);
            }
        }
    }
    return c;
}

class SoundFX {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, endFreq, dur, type = 'sine', vol = 0.12) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
            g.gain.setValueAtTime(vol, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        } catch (e) {}
    }
    catchBanana() { this.tone(520, 880, 0.1, 'sine', 0.15); }
    rugCrash() {
        [150, 90, 45].forEach((f, i) => {
            setTimeout(() => this.tone(f, f * 0.5, 0.3, 'sawtooth', 0.25), i * 150);
        });
    }
}

class DontFumbleTheBagGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sfx = new SoundFX();

        this.chadSprite = createChadSprite(3.5);

        this.otterImg = new Image();
        this.otterImg.crossOrigin = 'anonymous';
        this.otterImg.onload = () => {
            this.otterSprite = this.removeBackground(this.otterImg);
        };
        this.otterImg.src = 'https://raw.githubusercontent.com/Rekt-01/Rugged-arcade-/main/image_3.png';[span_0](start_span)[span_0](end_span)
        this.otterSprite = null;

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.keys = { left: false, right: false };
        this.bananas = [];
        this.particles = [];
        this.chartPoints = [];

        this.gameState = 'MENU';
        this.score = 0;
        this.bananasCaught = 0;
        this.timeLeft = 30.0;
        this.spawnTimer = 0;
        this.chartTimer = 0;
        this.rugAnim = 0;

        this.chad = {
            x: this.width / 2 - 28,
            y: 0,
            w: 56,
            h: 74,
            vx: 0,
            speed: 460
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindControls();

        let val = this.height * 0.5;
        for (let x = 0; x <= this.width + 40; x += 25) {
            val += (Math.random() - 0.48) * 30;
            val = Math.max(this.height * 0.25, Math.min(this.height * 0.75, val));
            this.chartPoints.push({ x, y: val });
        }

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    removeBackground(img) {
        const c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, c.width, c.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            if (r > 160 && g > 200 && b > 220) {
                data[i+3] = 0;
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return c;
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.chad.y = this.height * 0.76 - this.chad.h;
    }

    bindControls() {
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = true;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) this.keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) this.keys.right = false;
        });

        const bindTouch = (id, action) => {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                this.sfx.init();
                if (action === 'left') this.keys.left = true;
                if (action === 'right') this.keys.right = true;
                btn.classList.add('touch-active');
            };
            const end = (e) => {
                e.preventDefault();
                if (action === 'left') this.keys.left = false;
                if (action === 'right') this.keys.right = false;
                btn.classList.remove('touch-active');
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');

        // Robust start button listener for both click and touch
        const startBtn = document.getElementById('btnAction');
        const triggerStart = (e) => {
            e.preventDefault();
            this.sfx.init();
            document.getElementById('modalScreen').classList.add('hidden');
            this.startNewGame();
        };
        startBtn.addEventListener('click', triggerStart);
        startBtn.addEventListener('touchend', triggerStart);
    }

    startNewGame() {
        this.score = 0;
        this.bananasCaught = 0;
        this.timeLeft = 30.0;
        this.bananas = [];
        this.particles = [];
        this.rugAnim = 0;
        this.chad.x = this.width / 2 - 28;
        this.gameState = 'PLAYING';
        this.updateHUD();
    }

    updateHUD() {
        document.getElementById('scoreDisplay').textContent = '$' + this.score.toLocaleString();
        document.getElementById('bananasDisplay').textContent = this.bananasCaught;
        document.getElementById('timerDisplay').textContent = Math.ceil(this.timeLeft) + 's';
    }

    spawnBanana() {
        const x = 30 + Math.random() * (this.width - 60);
        this.bananas.push({
            x,
            y: -30,
            vy: 240 + Math.random() * 120 + this.bananasCaught * 3,
            size: 26,
            rot: Math.random() * Math.PI
        });
    }

    spawnParticles(x, y, color) {
        for (let i = 0; i < 7; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 30 + Math.random() * 80;
            this.particles.push({
                x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 25,
                color, alpha: 1, size: 2.5 + Math.random() * 2.5
            });
        }
    }

    update(dt) {
        this.chartTimer += dt;
        if (this.chartTimer > 0.08) {
            this.chartTimer = 0;
            this.chartPoints.forEach(pt => pt.x -= 3);
            if (this.chartPoints[0].x < -30) {
                this.chartPoints.shift();
                const last = this.chartPoints[this.chartPoints.length - 1];
                let nextY = last.y + (Math.random() - 0.47) * 40;
                nextY = Math.max(this.height * 0.25, Math.min(this.height * 0.75, nextY));
                this.chartPoints.push({ x: last.x + 25, y: nextY });
            }
        }

        if (this.gameState === 'PLAYING') {
            this.timeLeft -= dt;
            if (this.timeLeft <= 0) {
                this.timeLeft = 0;
                this.gameState = 'GAMEOVER';
                this.sfx.rugCrash();
                document.getElementById('modalScreen').classList.remove('hidden');
                document.getElementById('modalBadge').className = "px-3 py-1 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-300 text-xs font-orbitron";
                document.getElementById('modalBadge').textContent = "TOTAL RUG PULL";
                document.getElementById('modalTitle').textContent = "THE DEV RUGGED!";
                document.getElementById('modalText').textContent = `Time's up! You secured ${this.bananasCaught} bananas ($${this.score.toLocaleString()}) before Captain Otter pulled the liquidity.`;
                document.getElementById('btnAction').textContent = "PLAY AGAIN";
            }
            this.updateHUD();

            let move = 0;
            if (this.keys.left) move = -1;
            if (this.keys.right) move = 1;
            this.chad.x += move * this.chad.speed * dt;
            this.chad.x = Math.max(10, Math.min(this.width - this.chad.w - 10, this.chad.x));

            this.spawnTimer += dt;
            if (this.spawnTimer > Math.max(0.4, 1.3 - this.bananasCaught * 0.03)) {
                this.spawnTimer = 0;
                this.spawnBanana();
            }

            const bagBox = {
                x: this.chad.x + 22,
                y: this.chad.y + 40,
                w: 32,
                h: 30
            };

            for (let i = this.bananas.length - 1; i >= 0; i--) {
                const b = this.bananas[i];
                b.y += b.vy * dt;
                b.rot += dt * 2;

                if (b.x + b.size/2 > bagBox.x && b.x - b.size/2 < bagBox.x + bagBox.w &&
                    b.y + b.size/2 > bagBox.y && b.y - b.size/2 < bagBox.y + bagBox.h) {
                    this.bananasCaught++;
                    this.score += 300;
                    this.sfx.catchBanana();
                    this.spawnParticles(b.x, b.y, '#f5c71a');
                    this.bananas.splice(i, 1);
                    this.updateHUD();
                    continue;
                }

                if (b.y > this.height * 0.79) {
                    this.spawnParticles(b.x, this.height * 0.76, '#ef4444');
                    this.bananas.splice(i, 1);
                }
            }
        } else if (this.gameState === 'GAMEOVER') {
            this.rugAnim += dt * 3;
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.x += pt.vx * dt;
            pt.vy += 400 * dt;
            pt.y += pt.vy * dt;
            pt.alpha -= 1.5 * dt;
            if (pt.alpha <= 0) this.particles.splice(i, 1);
        }
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < this.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.height); ctx.stroke();
        }
        for (let y = 0; y < this.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke();
        }

        ctx.save();
        ctx.strokeStyle = this.gameState === 'GAMEOVER' ? '#ef4444' : '#10b981';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        for (let i = 0; i < this.chartPoints.length; i++) {
            const pt = this.chartPoints[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.restore();

        const floorY = this.height * 0.76;
        ctx.strokeStyle = this.gameState === 'GAMEOVER' ? '#ef4444' : '#34d399';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(this.width, floorY);
        ctx.stroke();

        this.bananas.forEach(b => {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍌', 0, 0);
            ctx.restore();
        });

        ctx.drawImage(this.chadSprite, this.chad.x, this.chad.y);
        ctx.save();
        ctx.translate(this.chad.x + 22, this.chad.y + 40);
        ctx.fillStyle = '#d97706';
        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 2;
        ctx.fillRect(0, 0, 32, 30);
        ctx.strokeRect(0, 0, 32, 30);
        ctx.fillStyle = '#fef08a';
        ctx.font = '900 14px Orbitron';
        ctx.textAlign = 'center';
        ctx.fillText('$', 16, 20);
        ctx.restore();

        if (this.gameState === 'GAMEOVER') {
            ctx.save();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.fillRect(0, 0, this.width, this.height);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.width * 0.35, this.height * 0.1, this.width * 0.3, this.height * 0.8);

            const otterY = this.height * 0.45 + Math.sin(this.rugAnim * 8) * 15;
            if (this.otterSprite) {
                ctx.drawImage(this.otterSprite, this.width / 2 - 70, otterY - 50, 140, 140);
            }

            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.fillRect(this.width / 2 - 145, otterY - 120, 290, 55);
            ctx.strokeRect(this.width / 2 - 145, otterY - 120, 290, 55);

            ctx.fillStyle = '#f8fafc';
            ctx.font = '900 18px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('THE DEV RUGGED!', this.width / 2, otterY - 84);
            ctx.restore();
        }

        this.particles.forEach(pt => {
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        });
        ctx.globalAlpha = 1;
    }

    loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

window.onload = () => new DontFumbleTheBagGame();
</script>
</body>
</html>
