<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows XP Emulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Tahoma, sans-serif; background-color: #3a6ea5; }

        /* --- DESKTOP --- */
        #desktop { width: 100%; height: calc(100% - 40px); position: relative; padding: 10px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 15px; }
        .desktop-icon { width: 75px; text-align: center; color: white; text-shadow: 1px 1px 2px black; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11px; }
        .desktop-icon img { width: 32px; height: 32px; margin-bottom: 4px; }

        /* --- TASKBAR --- */
        #taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 3%, #245edb 10%, #1a4bc5 100%); display: flex; align-items: center; border-top: 1px solid #0831d9; z-index: 9999; }
        #start-btn { background: linear-gradient(to bottom, #3c9d3c 0%, #287a28 50%, #1e5c1e 100%); border: 1px solid #103810; border-radius: 0 10px 10px 0; color: white; font-weight: bold; font-style: italic; padding: 0 15px 0 10px; height: 100%; display: flex; align-items: center; cursor: pointer; text-shadow: 1px 1px 1px rgba(0,0,0,0.5); font-size: 14px; }
        #start-btn:hover { background: linear-gradient(to bottom, #45af45 0%, #2e8b2e 50%, #226922 100%); }
        #taskbar-apps { display: flex; flex-grow: 1; padding: 0 5px; gap: 4px; }
        .taskbar-task { background: linear-gradient(to bottom, #3c81f3 0%, #1b63dc 50%, #1152bd 100%); border: 1px solid #0831d9; color: white; padding: 0 10px; height: 30px; display: flex; align-items: center; gap: 6px; border-radius: 3px; font-size: 12px; cursor: pointer; max-width: 150px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        #tray { color: white; padding: 0 10px; font-size: 11px; display: flex; align-items: center; }

        /* --- WINDOWS --- */
        .window { position: absolute; top: 50px; left: 50px; width: 85vw; max-width: 600px; height: 75vh; max-height: 450px; background: #ece9d8; border: 3px solid #0055ea; border-top-left-radius: 6px; border-top-right-radius: 6px; display: flex; flex-direction: column; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); display: none; z-index: 10; }
        .window.active { display: flex; }
        .title-bar { background: linear-gradient(to right, #0055ea 0%, #5c87e6 100%); color: white; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 12px; border-top-left-radius: 3px; border-top-right-radius: 3px; cursor: move; }
        .title-btns { display: flex; gap: 3px; }
        .win-btn { width: 18px; height: 18px; background: linear-gradient(to bottom, #e4e3d9 0%, #bcbeae 100%); border: 1px solid #716f64; color: black; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; }
        .win-btn.close { background: linear-gradient(to bottom, #e87b72 0%, #c53323 100%); color: white; border-color: #832015; }
        .window-content { flex-grow: 1; background: white; border: 1px solid #716f64; display: flex; flex-direction: column; overflow: hidden; }

        /* --- INTERNET EXPLORER --- */
        .ie-toolbar { background: #ece9d8; padding: 5px; border-bottom: 1px solid #aca899; display: flex; gap: 5px; align-items: center; }
        .ie-toolbar input { flex-grow: 1; padding: 3px 6px; border: 1px solid #716f64; font-size: 12px; }
        .ie-toolbar button { padding: 3px 10px; font-size: 11px; cursor: pointer; }
        .ie-content { flex-grow: 1; width: 100%; border: none; }

        /* --- CMD TERMINAL --- */
        .cmd-body { background: black; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 8px; flex-grow: 1; overflow-y: auto; font-size: 13px; }
        .cmd-input-line { display: flex; align-items: center; background: black; color: #00ff00; border-top: 1px solid #222; padding: 4px; }
        .cmd-input-line span { margin-right: 5px; }
        .cmd-input-line input { background: transparent; border: none; color: #00ff00; outline: none; font-family: 'Courier New', Courier, monospace; font-size: 13px; flex-grow: 1; }

        /* --- START MENU --- */
        #start-menu { position: absolute; bottom: 40px; left: 0; width: 250px; background: white; border: 2px solid #0055ea; border-top-left-radius: 8px; border-top-right-radius: 8px; display: none; z-index: 10000; box-shadow: 3px 3px 10px rgba(0,0,0,0.4); }
        .start-header { background: linear-gradient(to right, #245edb 0%, #3f8cf3 100%); color: white; padding: 10px; font-weight: bold; display: flex; align-items: center; gap: 10px; border-top-left-radius: 6px; border-top-right-radius: 6px; }
        .start-items { padding: 5px 0; }
        .start-item { padding: 8px 15px; display: flex; align-items: center; gap: 10px; font-size: 12px; cursor: pointer; }
        .start-item:hover { background: #2f71db; color: white; }
        .start-footer { background: #d3e5fc; padding: 8px 15px; display: flex; justify-content: flex-end; border-top: 1px solid #b3d1f9; }
        .start-footer button { padding: 4px 10px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="desktop">
        <!-- Desktop Shortcuts -->
        <div class="desktop-icon" onclick="openWindow('ie-win')">
            <span style="font-size:24px;">🌐</span>
            <span>Internet Explorer</span>
        </div>
        <div class="desktop-icon" onclick="openWindow('cmd-win')">
            <span style="font-size:24px;">💻</span>
            <span>Command Prompt</span>
        </div>
        <div class="desktop-icon" onclick="closeEmulator()">
            <span style="font-size:24px;">🚪</span>
            <span>Exit to Main</span>
        </div>
    </div>

    <!-- START MENU -->
    <div id="start-menu">
        <div class="start-header">
            <span style="font-size: 18px;">👤</span> User
        </div>
        <div class="start-items">
            <div class="start-item" onclick="openWindow('ie-win'); toggleStartMenu();">🌐 Internet Explorer</div>
            <div class="start-item" onclick="openWindow('cmd-win'); toggleStartMenu();">💻 Command Prompt</div>
        </div>
        <div class="start-footer">
            <button onclick="closeEmulator()">Log Off / Exit</button>
        </div>
    </div>

    <!-- TASKBAR -->
    <div id="taskbar">
        <div id="start-btn" onclick="toggleStartMenu()">start</div>
        <div id="taskbar-apps"></div>
        <div id="tray">12:00 PM</div>
    </div>

    <!-- INTERNET EXPLORER WINDOW -->
    <div id="ie-win" class="window">
        <div class="title-bar">
            <span>Internet Explorer</span>
            <div class="title-btns">
                <div class="win-btn" onclick="minimizeWindow('ie-win')">_</div>
                <div class="win-btn" onclick="closeWindow('ie-win')">X</div>
            </div>
        </div>
        <div class="window-content">
            <div class="ie-toolbar">
                <input type="text" id="ie-url" value="https://en.wikipedia.org">
                <button onclick="navigateIE()">Go</button>
            </div>
            <!-- Note: Some external websites block iframes due to security (X-Frame-Options). Wikipedia works well. -->
            <iframe id="ie-frame" class="ie-content" src="https://en.wikipedia.org"></iframe>
        </div>
    </div>

    <!-- CMD TERMINAL WINDOW -->
    <div id="cmd-win" class="window">
        <div class="title-bar">
            <span>Command Prompt</span>
            <div class="title-btns">
                <div class="win-btn" onclick="minimizeWindow('cmd-win')">_</div>
                <div class="win-btn" onclick="closeWindow('cmd-win')">X</div>
            </div>
        </div>
        <div class="window-content">
            <div id="cmd-body" class="cmd-body">
                Microsoft Windows XP [Version 5.1.2600]<br>
                (C) Copyright 1985-2001 Microsoft Corp.<br><br>
                Type <b>help</b> for available commands.<br><br>
            </div>
            <div class="cmd-input-line">
                <span>C:\></span>
                <input type="text" id="cmd-input" autofocus onkeypress="handleCmd(event)">
            </div>
        </div>
    </div>

    <script>
        // --- CLOCK & NAVIGATION ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('tray').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function closeEmulator() {
            window.location.href = 'main.html';
        }

        // --- WINDOW MANAGEMENT ---
        function openWindow(winId) {
            const win = document.getElementById(winId);
            win.classList.add('active');
            document.getElementById('start-menu').style.display = 'none';
            updateTaskbar();
        }

        function closeWindow(winId) {
            const win = document.getElementById(winId);
            win.classList.remove('active');
            updateTaskbar();
        }

        function minimizeWindow(winId) {
            const win = document.getElementById(winId);
            win.classList.remove('active');
        }

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbar-apps');
            container.innerHTML = '';
            document.querySelectorAll('.window').forEach(win => {
                if (win.classList.contains('active')) {
                    const title = win.querySelector('.title-bar span').innerText;
                    const task = document.createElement('div');
                    task.className = 'taskbar-task';
                    task.innerText = title;
                    task.onclick = () => {
                        win.classList.toggle('active');
                    };
                    container.appendChild(task);
                }
            });
        }

        // --- INTERNET EXPLORER LOGIC ---
        function navigateIE() {
            let url = document.getElementById('ie-url').value;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            document.getElementById('ie-frame').src = url;
        }

        // --- CMD TERMINAL LOGIC ---
        function handleCmd(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('cmd-input');
                const body = document.getElementById('cmd-body');
                const cmdText = input.value.trim();

                body.innerHTML += `C:\\>${cmdText}<br>`;

                // Command Processing
                const args = cmdText.split(' ');
                const command = args[0].toLowerCase();

                if (command === 'help') {
                    body.innerHTML += `Available commands:<br>&nbsp;&nbsp;<b>help</b> - Displays this help message<br>&nbsp;&nbsp;<b>cls</b> - Clears the screen<br>&nbsp;&nbsp;<b>echo [text]</b> - Prints text<br>&nbsp;&nbsp;<b>exit</b> - Returns to main.html<br><br>`;
                } else if (command === 'cls') {
                    body.innerHTML = '';
                } else if (command === 'echo') {
                    body.innerHTML += `${args.slice(1).join(' ')}<br><br>`;
                } else if (command === 'exit') {
                    closeEmulator();
                } else if (cmdText !== '') {
                    body.innerHTML += `'${command}' is not recognized as an internal or external command.<br><br>`;
                }

                input.value = '';
                body.scrollTop = body.scrollHeight;
            }
        }

        // Close start menu when clicking outside
        window.onclick = function(e) {
            if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
                document.getElementById('start-menu').style.display = 'none';
            }
        }
    </script>
</body>
</html>
