<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Arcade Jukebox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 20%, #1a102f 0%, #030305 80%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 100%, 100% 4px;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
        }
        .arcade-font { font-family: 'Press Start 2P', monospace; }
        
        /* Rugged Arcade Cabinet Shell */
        .arcade-cabinet {
            background: linear-gradient(145deg, #121019 0%, #08070b 100%);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2), inset 0 0 25px rgba(255, 255, 255, 0.04);
            border: 5px solid #2a223d;
        }
        
        .marquee-glow {
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff0055, 0 0 40px #ff0055;
        }

        /* Vinyl Spin Animation */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 3px; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-3 md:p-6 select-none">

    <!-- Top Navigation -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center bg-black/80 backdrop-blur-md p-4 rounded-xl border border-purple-500/30 shadow-lg">
        <a href="main.html" class="arcade-font text-[9px] md:text-xs bg-red-600 hover:bg-red-500 text-white px-4 py-3 rounded-lg shadow-[0_0_15px_rgba(220,38,38,0.5)] transition flex items-center gap-2">
            <span>◄</span> BACK TO ARCADE
        </a>
        <div class="text-center hidden sm:block">
            <span class="text-[10px] text-pink-400 arcade-font tracking-widest">RUGGED SOUND SYSTEMS</span>
        </div>
        <div class="flex items-center gap-2 bg-purple-950/60 px-3 py-1.5 rounded-lg border border-purple-500/40">
            <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-ping"></span>
            <span id="live-text" class="text-[10px] arcade-font text-yellow-400">LOADING</span>
        </div>
    </header>

    <!-- Main Arcade Cabinet -->
    <main class="max-w-3xl mx-auto w-full my-4 arcade-cabinet rounded-2xl p-4 md:p-6 flex flex-col gap-5 relative">
        
        <!-- Marquee Header -->
        <div class="text-center bg-black/90 border-2 border-pink-500/60 rounded-xl p-4 shadow-[inset_0_0_15px_rgba(255,0,85,0.2)]">
            <h1 class="arcade-font text-base md:text-2xl text-pink-500 marquee-glow tracking-wider">RUGGED ARCADE JUKEBOX</h1>
            <p class="text-[10px] text-cyan-400 mt-2 tracking-widest uppercase">Flagship Live Radio Channels</p>
        </div>

        <!-- Genre Arcade Buttons -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <button onclick="switchGenre('hiphop')" id="btn-hiphop" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-pink-600 text-white border-b-4 border-pink-900 active:border-b-0 active:translate-y-1 shadow-lg transition">
                HIP-HOP
            </button>
            <button onclick="switchGenre('dance')" id="btn-dance" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                DANCE / RAVE
            </button>
            <button onclick="switchGenre('country')" id="btn-country" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                COUNTRY
            </button>
            <button onclick="switchGenre('rock')" id="btn-rock" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                ROCK / HITS
            </button>
        </div>

        <!-- Jukebox Screen & Active Player HUD -->
        <div class="bg-black/80 border-2 border-pink-500/40 rounded-xl p-6 flex flex-col items-center justify-between text-center relative overflow-hidden">
            
            <!-- Background Glow -->
            <div class="absolute inset-0 bg-gradient-to-b from-pink-950/20 to-transparent pointer-events-none"></div>

            <!-- Spinning Vinyl Graphic -->
            <div class="relative w-28 h-28 my-2">
                <div id="vinyl-disc" class="w-full h-full rounded-full bg-black border-4 border-gray-800 shadow-[0_0_20px_rgba(255,0,85,0.4)] flex items-center justify-center">
                    <div class="w-10 h-10 rounded-full bg-cyan-500 border-2 border-black flex items-center justify-center">
                        <div class="w-3 h-3 rounded-full bg-black"></div>
                    </div>
                </div>
            </div>

            <!-- Now Playing Text Display -->
            <div class="w-full z-10 my-2">
                <div id="now-playing-name" class="arcade-font text-xs md:text-sm text-pink-400 truncate">INITIALIZING...</div>
                <div id="now-playing-status" class="text-[10px] text-gray-400 mt-1">Connecting to live feed</div>
            </div>

            <!-- Volume Bar -->
            <div class="w-full max-w-md flex items-center gap-3 bg-gray-900/80 px-4 py-2.5 rounded-lg border border-white/5 z-10 mt-2">
                <span class="text-[10px] text-cyan-400 arcade-font">VOL</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-pink-500 cursor-pointer">
            </div>
        </div>

        <!-- Cabinet Coin Slot Footer -->
        <div class="flex justify-between items-center px-4 py-2 bg-black/60 rounded-lg border border-white/5 text-[9px] text-gray-400 arcade-font">
            <span>CREDIT: FREE PLAY</span>
            <span class="text-pink-500 animate-pulse">● STEREO AUDIO ACTIVE</span>
            <span>RUGGED OS v4.3</span>
        </div>

    </main>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audio-element" preload="auto"></audio>

    <script>
        // The #1 most reliable, high-uptime direct stream station for each major genre
        const flagshipStations = {
            hiphop: { name: "181.fm The Beat (Classic & Modern Hip-Hop)", url: "https://listen.181fm.com/181-beat_128k.mp3" },
            dance: { name: "SomaFM Groove Salad (Ambient & Chill Rave)", url: "https://ice2.somafm.com/groovesalad-128-mp3" },
            country: { name: "181.fm Kickin' Country (Top Country Hits)", url: "https://listen.181fm.com/181-kickin_128k.mp3" },
            rock: { name: "181.fm The Eagle (Classic Rock Anthems)", url: "https://listen.181fm.com/181-eagle_128k.mp3" }
        };

        const audio = document.getElementById('audio-element');
        const volumeSlider = document.getElementById('volume-slider');
        const nowPlayingName = document.getElementById('now-playing-name');
        const nowPlayingStatus = document.getElementById('now-playing-status');
        const liveDot = document.getElementById('live-dot');
        const liveText = document.getElementById('live-text');
        const vinylDisc = document.getElementById('vinyl-disc');

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function switchGenre(genreKey) {
            // Style active buttons
            ['hiphop', 'dance', 'country', 'rock'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if (k === genreKey) {
                    btn.className = "arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-pink-600 text-white border-b-4 border-pink-900 active:border-b-0 active:translate-y-1 shadow-lg transition";
                } else {
                    btn.className = "arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition";
                }
            });

            playStation(flagshipStations[genreKey]);
        }

        function playStation(station) {
            nowPlayingName.innerText = station.name;
            nowPlayingStatus.innerText = "BUFFERING STREAM...";
            liveDot.className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-ping";
            liveText.innerText = "CONNECTING";
            liveText.className = "text-[10px] arcade-font text-yellow-400";

            audio.src = station.url;
            audio.play().then(() => {
                nowPlayingStatus.innerText = "LIVE BROADCAST";
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse";
                liveText.innerText = "ONLINE";
                liveText.className = "text-[10px] arcade-font text-green-400";
                vinylDisc.classList.add('spinning');
            }).catch(err => {
                console.warn("Autoplay blocked or stream error:", err);
                nowPlayingStatus.innerText = "CLICK ANYWHERE TO START AUDIO";
                liveDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
                liveText.innerText = "PAUSED";
                liveText.className = "text-[10px] arcade-font text-red-400";
                vinylDisc.classList.remove('spinning');
            });
        }

        // Auto-play Hip-Hop immediately upon page load
        window.addEventListener('DOMContentLoaded', () => {
            audio.volume = 0.8;
            switchGenre('hiphop');
        });

        // Fallback helper in case browser blocks unprompted audio autoplay
        document.body.addEventListener('click', () => {
            if (audio.paused && audio.src) {
                audio.play().catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
