<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Jukebox - Radio</title>
    <!-- Three.js & Tailwind CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: 'Orbitron', sans-serif; }
        .lcd-font { font-family: 'VT323', monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        /* Custom Scrollbar for Station List */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 3px; }
    </style>
</head>
<body class="text-white h-screen flex flex-col justify-between select-none">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-layer flex flex-col h-full justify-between p-4 md:p-6">
        
        <!-- Top Navigation & Title Bar -->
        <header class="flex justify-between items-center bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-pink-500/30 shadow-[0_0_20px_rgba(236,72,153,0.2)] interactive">
            <a href="main.html" class="flex items-center gap-2 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white px-4 py-2 rounded-xl font-bold transition shadow-lg text-sm md:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Main Menu
            </a>
            
            <div class="text-center">
                <h1 class="text-xl md:text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400">CYBER JUKEBOX</h1>
                <p id="geo-location-label" class="text-xs text-cyan-400 lcd-font tracking-wider">Detecting Location IP...</p>
            </div>

            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-ping"></span>
                <span class="text-xs text-gray-300 hidden md:inline">Live Stream Active</span>
            </div>
        </header>

        <!-- Middle Section: Visualizer HUD & Station Selector Drawer -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 my-auto max-w-7xl mx-auto w-full items-center">
            
            <!-- Left Info Panel / Now Playing LCD -->
            <div class="bg-black/70 backdrop-blur-md border border-cyan-500/30 p-5 rounded-2xl shadow-[0_0_25px_rgba(6,182,212,0.15)] interactive flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-cyan-500/20 pb-3">
                    <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest">System Display</h2>
                    <span class="text-xs px-2 py-0.5 bg-cyan-950 text-cyan-300 border border-cyan-500/40 rounded lcd-font">TUNER v2.6</span>
                </div>
                
                <!-- LCD Screen -->
                <div class="bg-gray-950 border-2 border-cyan-500/40 rounded-xl p-4 shadow-inner relative overflow-hidden">
                    <div class="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%)] bg-[length:100%_4px] pointer-events-none"></div>
                    <div class="text-cyan-400 lcd-font text-3xl md:text-4xl tracking-wider truncate" id="lcd-station-name">SELECT A STATION</div>
                    <div class="text-pink-400 lcd-font text-xl md:text-2xl mt-1 truncate" id="lcd-genre">Ready to play...</div>
                    <div class="flex justify-between items-center mt-3 text-xs text-gray-400 lcd-font">
                        <span id="lcd-codec">CODEC: AAC/MP3</span>
                        <span id="lcd-status" class="text-green-400 animate-pulse">● STANDBY</span>
                    </div>
                </div>

                <!-- Volume & Controls -->
                <div class="flex items-center gap-4 bg-gray-900/60 p-3 rounded-xl border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-pink-500 cursor-pointer">
                </div>
            </div>

            <!-- Center Spacer for 3D Jukebox Object (Visible cleanly on desktop) -->
            <div class="hidden lg:block h-64 pointer-events-none"></div>

            <!-- Right Station Directory Panel -->
            <div class="bg-black/70 backdrop-blur-md border border-pink-500/30 p-5 rounded-2xl shadow-[0_0_25px_rgba(236,72,153,0.15)] interactive flex flex-col h-[380px]">
                <div class="flex justify-between items-center border-b border-pink-500/20 pb-3 mb-3">
                    <h2 class="text-sm font-bold text-pink-400 uppercase tracking-widest">Station Presets</h2>
                    <div class="flex gap-1">
                        <button onclick="switchTab('geo')" id="tab-geo" class="text-xs px-2.5 py-1 rounded bg-pink-600 text-white font-bold transition">Local IP</button>
                        <button onclick="switchTab('global')" id="tab-global" class="text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition">Global</button>
                    </div>
                </div>

                <!-- Station Scrollable Container -->
                <div id="station-list" class="overflow-y-auto flex flex-col gap-2 pr-1 flex-grow">
                    <!-- Dynamic stations populated via script -->
                    <div class="text-center text-gray-500 py-10 lcd-font text-lg">Loading stations via IP Geolocation...</div>
                </div>
            </div>

        </main>

        <!-- Footer / Audio Element -->
        <footer class="text-center text-xs text-gray-500 pb-2 interactive">
            <p>Powered by HTML5 Web Audio API, Three.js & Public Internet Radio Networks.</p>
        </footer>
    </div>

    <!-- Hidden Audio Stream Handler -->
    <audio id="audio-stream" crossorigin="anonymous"></audio>

    <script>
        // --- 1. THREE.JS 3D RETRO JUKEBOX SCENE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xec4899, 3, 50); // Pink neon light
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x06b6d4, 3, 50); // Cyan neon light
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        // Jukebox Body Group
        const jukeboxGroup = new THREE.Group();

        // Main Cabinet Glass Frame
        const cabinetGeo = new THREE.BoxGeometry(3, 4.2, 1.2);
        const cabinetMat = new THREE.MeshPhysicalMaterial({
            color: 0x111118,
            metalness: 0.8,
            roughness: 0.2,
            transmission: 0.2,
            transparent: true,
            opacity: 0.9
        });
        const cabinet = new THREE.Mesh(cabinetGeo, cabinetMat);
        jukeboxGroup.add(cabinet);

        // Glowing Neon Border Tubes
        const tubeGeo = new THREE.CylinderGeometry(0.04, 0.04, 4.3, 16);
        const neonMat = new THREE.MeshBasicMaterial({ color: 0xec4899 });
        
        const tube1 = new THREE.Mesh(tubeGeo, neonMat);
        tube1.position.set(-1.52, 0, 0.61);
        jukeboxGroup.add(tube1);

        const tube2 = new THREE.Mesh(tubeGeo, neonMat);
        tube2.position.set(1.52, 0, 0.61);
        jukeboxGroup.add(tube2);

        // Spinning Vinyl Record inside the Jukebox
        const vinylGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.02, 32);
        const vinylMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3, metalness: 0.8 });
        const vinyl = new THREE.Mesh(vinylGeo, vinylMat);
        vinyl.rotation.x = Math.PI / 2.5;
        vinyl.position.set(0, 0.3, 0.1);
        jukeboxGroup.add(vinyl);

        // Vinyl Center Label
        const labelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.03, 32);
        const labelMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
        const label = new THREE.Mesh(labelGeo, labelMat);
        label.rotation.x = Math.PI / 2.5;
        label.position.set(0, 0.3, 0.11);
        jukeboxGroup.add(label);

        scene.add(jukeboxGroup);
        camera.position.z = 6;

        // Mouse interaction tilt
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Animation Loop
        let isPlayingAnim = false;
        function animate() {
            requestAnimationFrame(animate);

            // Smooth idle rotation + mouse parallax tilt
            jukeboxGroup.rotation.y = THREE.MathUtils.lerp(jukeboxGroup.rotation.y, mouseX * 0.3, 0.05);
            jukeboxGroup.rotation.x = THREE.MathUtils.lerp(jukeboxGroup.rotation.x, -mouseY * 0.3, 0.05);

            // Spin vinyl if playing music
            if (isPlayingAnim) {
                vinyl.rotation.z += 0.05;
                label.rotation.z += 0.05;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // --- 2. RADIO STATIONS & IP GEOLOCATION LOGIC ---
        const audio = document.getElementById('audio-stream');
        const volumeSlider = document.getElementById('volume-slider');
        const lcdStationName = document.getElementById('lcd-station-name');
        const lcdGenre = document.getElementById('lcd-genre');
        const lcdStatus = document.getElementById('lcd-status');
        const stationListContainer = document.getElementById('station-list');
        const geoLabel = document.getElementById('geo-location-label');

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Fallback global stations list (TuneIn/Icecast direct streaming links)
        const globalStations = [
            { name: "Chillhop Radio", genre: "Lo-Fi Beats / Chill", url: "https://stream.chillhop.com/mp3", country: "Global" },
            { name: "SomaFM: Groove Salad", genre: "Ambient Downtempo", url: "https://ice2.somafm.com/groovesalad-128-mp3", country: "USA" },
            { name: "BBC World Service", genre: "News & Talk", url: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service", country: "UK" },
            { name: "Jazz Radio - Smooth Jazz", genre: "Smooth Jazz", url: "https://jazzradio.ice.infomaniak.ch/jazzradio-high.mp3", country: "France" },
            { name: "NRJ Hits France", genre: "Top 40 / Pop", url: "https://stream.nrj.fr/nrj-hits-mp3-128", country: "France" },
            { name: "Absolute Classic Rock", genre: "Classic Rock", url: "https://stream.absoluteradio.co.uk/aclassicrock.mp3", country: "UK" }
        ];

        let currentStations = [];
        let activeTab = 'geo';

        function switchTab(tab) {
            activeTab = tab;
            if (tab === 'geo') {
                document.getElementById('tab-geo').className = "text-xs px-2.5 py-1 rounded bg-pink-600 text-white font-bold transition";
                document.getElementById('tab-global').className = "text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
                renderStations(currentStations);
            } else {
                document.getElementById('tab-global').className = "text-xs px-2.5 py-1 rounded bg-pink-600 text-white font-bold transition";
                document.getElementById('tab-geo').className = "text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 transition";
                renderStations(globalStations);
            }
        }

        function renderStations(stations) {
            stationListContainer.innerHTML = '';
            stations.forEach((station, index) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 rounded-xl bg-gray-900/80 hover:bg-pink-950/40 border border-white/5 hover:border-pink-500/40 transition cursor-pointer group";
                item.innerHTML = `
                    <div class="truncate pr-2">
                        <div class="font-bold text-sm text-gray-200 group-hover:text-pink-400 transition">${station.name}</div>
                        <div class="text-xs text-gray-400">${station.genre} • <span class="text-cyan-400">${station.country || 'Local'}</span></div>
                    </div>
                    <button class="bg-pink-600/30 group-hover:bg-pink-600 text-pink-300 group-hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0">
                        PLAY
                    </button>
                `;
                item.onclick = () => playStation(station);
                stationListContainer.appendChild(item);
            });
        }

        function playStation(station) {
            lcdStationName.innerText = station.name;
            lcdGenre.innerText = station.genre;
            lcdStatus.innerText = "● BUFFERING...";
            lcdStatus.className = "text-yellow-400 animate-pulse";

            audio.src = station.url;
            audio.play().then(() => {
                lcdStatus.innerText = "● LIVE STREAM";
                lcdStatus.className = "text-green-400 animate-pulse";
                isPlayingAnim = true;
            }).catch(err => {
                console.error("Playback error:", err);
                lcdStatus.innerText = "● STREAM ERROR";
                lcdStatus.className = "text-red-400";
                isPlayingAnim = false;
            });
        }

        // Fetch User IP Geolocation and find nearby radio stations via free API (Radio-Browser.info)
        async function fetchGeoStations() {
            try {
                // Get user IP & Country info
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                const countryCode = ipData.country_code || 'US';
                const countryName = ipData.country_name || 'United States';
                
                geoLabel.innerText = `LOCATION: ${countryName.toUpperCase()}`;

                // Query Radio Browser API for stations matching the user's country code
                const radioRes = await fetch(`https://de1.api.radio-browser.info/json/stations/bycountrycodeexact/${countryCode}?limit=15`);
                const radioData = await radioRes.json();

                if (radioData && radioData.length > 0) {
                    currentStations = radioData.map(s => ({
                        name: s.name.trim(),
                        genre: s.tags ? s.tags.split(',')[0].trim() : 'Live Radio',
                        url: s.url_resolved || s.url,
                        country: countryName
                    })).filter(s => s.url); // filter out broken stream links
                }

                if (currentStations.length === 0) {
                    currentStations = globalStations; // fallback if country has no API results
                }

                if (activeTab === 'geo') {
                    renderStations(currentStations);
                }
            } catch (e) {
                console.warn("Geolocation station fetch failed, loading defaults:", e);
                geoLabel.innerText = "LOCATION: GLOBAL MODE";
                currentStations = globalStations;
                renderStations(currentStations);
            }
        }

        // Initialize geolocation detection on load
        fetchGeoStations();
    </script>
</body>
</html>
