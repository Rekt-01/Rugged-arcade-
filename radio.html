<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Arcade Jukebox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 20%, #1a102f 0%, #030305 80%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 100%, 100% 4px;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
        }
        .arcade-font { font-family: 'Press Start 2P', monospace; }
        
        .arcade-cabinet {
            background: linear-gradient(145deg, #121019 0%, #08070b 100%);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2), inset 0 0 25px rgba(255, 255, 255, 0.04);
            border: 5px solid #2a223d;
        }
        
        .marquee-glow {
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff0055, 0 0 40px #ff0055;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 3s linear infinite; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 3px; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-3 md:p-6 select-none">

    <!-- Top Navigation -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center bg-black/80 backdrop-blur-md p-4 rounded-xl border border-purple-500/30 shadow-lg">
        <a href="main.html" class="arcade-font text-[9px] md:text-xs bg-red-600 hover:bg-red-500 text-white px-4 py-3 rounded-lg shadow-[0_0_15px_rgba(220,38,38,0.5)] transition flex items-center gap-2">
            <span>◄</span> BACK
        </a>
        <div class="text-center hidden sm:block">
            <span class="text-[10px] text-pink-400 arcade-font tracking-widest">RUGGED SOUND SYSTEMS</span>
        </div>
        <div class="flex items-center gap-2 bg-purple-950/60 px-3 py-1.5 rounded-lg border border-purple-500/40">
            <span id="live-dot" class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
            <span id="live-text" class="text-[10px] arcade-font text-green-400">ONLINE</span>
        </div>
    </header>

    <!-- Main Arcade Cabinet -->
    <main class="max-w-3xl mx-auto w-full my-4 arcade-cabinet rounded-2xl p-4 md:p-6 flex flex-col gap-5 relative">
        
        <!-- Marquee Header -->
        <div class="text-center bg-black/90 border-2 border-pink-500/60 rounded-xl p-4 shadow-[inset_0_0_15px_rgba(255,0,85,0.2)]">
            <h1 class="arcade-font text-base md:text-2xl text-pink-500 marquee-glow tracking-wider">RUGGED ARCADE JUKEBOX</h1>
            <p class="text-[10px] text-cyan-400 mt-2 tracking-widest uppercase">Live Global Radio Network</p>
        </div>

        <!-- Genre Arcade Buttons -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <button onclick="fetchStations('hip hop')" id="btn-hiphop" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-pink-600 text-white border-b-4 border-pink-900 active:border-b-0 active:translate-y-1 shadow-lg transition">
                HIP-HOP
            </button>
            <button onclick="fetchStations('dance')" id="btn-dance" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                DANCE / RAVE
            </button>
            <button onclick="fetchStations('country')" id="btn-country" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                COUNTRY
            </button>
            <button onclick="fetchStations('rock')" id="btn-rock" class="arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition">
                ROCK / HITS
            </button>
        </div>

        <!-- Jukebox Screen & Station Picker Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Left Side: Dynamic Station List -->
            <div class="bg-black/80 border-2 border-cyan-500/40 rounded-xl p-3 flex flex-col h-[240px]">
                <div class="flex justify-between items-center border-b border-cyan-500/20 pb-2 mb-2">
                    <span id="list-title" class="text-[10px] text-cyan-400 arcade-font">STATIONS: HIP HOP</span>
                    <span class="text-[9px] bg-cyan-950 text-cyan-300 px-1.5 py-0.5 rounded arcade-font">LIVE</span>
                </div>
                <div id="station-list" class="overflow-y-auto flex flex-col gap-2 pr-1 flex-grow">
                    <div class="text-xs text-gray-400 text-center py-10 arcade-font">Loading database...</div>
                </div>
            </div>

            <!-- Right Side: Player HUD & Spinning Vinyl -->
            <div class="bg-black/80 border-2 border-pink-500/40 rounded-xl p-4 flex flex-col items-center justify-between text-center relative overflow-hidden h-[240px]">
                
                <div class="absolute inset-0 bg-gradient-to-b from-pink-950/20 to-transparent pointer-events-none"></div>

                <!-- Spinning Vinyl Graphic -->
                <div class="relative w-20 h-20 my-1">
                    <div id="vinyl-disc" class="w-full h-full rounded-full bg-black border-4 border-gray-800 shadow-[0_0_15px_rgba(255,0,85,0.4)] flex items-center justify-center">
                        <div class="w-7 h-7 rounded-full bg-cyan-500 border-2 border-black flex items-center justify-center">
                            <div class="w-2 h-2 rounded-full bg-black"></div>
                        </div>
                    </div>
                </div>

                <!-- Now Playing Text Display -->
                <div class="w-full z-10">
                    <div id="now-playing-name" class="arcade-font text-[10px] text-pink-400 truncate">SELECT A STATION</div>
                    <div id="now-playing-status" class="text-[9px] text-gray-400 mt-1">Ready</div>
                </div>

                <!-- Volume Bar -->
                <div class="w-full flex items-center gap-2 bg-gray-900/80 px-3 py-1.5 rounded-lg border border-white/5 z-10">
                    <span class="text-[9px] text-cyan-400 arcade-font">VOL</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-pink-500 cursor-pointer">
                </div>
            </div>

        </div>

        <!-- Cabinet Coin Slot Footer -->
        <div class="flex justify-between items-center px-4 py-2 bg-black/60 rounded-lg border border-white/5 text-[9px] text-gray-400 arcade-font">
            <span>CREDIT: FREE PLAY</span>
            <span class="text-pink-500 animate-pulse">● STEREO AUDIO ACTIVE</span>
            <span>RUGGED OS v6.0</span>
        </div>

    </main>

    <!-- HTML5 Audio Element -->
    <audio id="audio-element" preload="none"></audio>

    <script>
        const audio = document.getElementById('audio-element');
        const volumeSlider = document.getElementById('volume-slider');
        const nowPlayingName = document.getElementById('now-playing-name');
        const nowPlayingStatus = document.getElementById('now-playing-status');
        const vinylDisc = document.getElementById('vinyl-disc');
        const stationListContainer = document.getElementById('station-list');

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        async function fetchStations(tag) {
            // Update button styles
            ['hiphop', 'dance', 'country', 'rock'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if (btn) {
                    if (tag.includes(k === 'hiphop' ? 'hip hop' : k)) {
                        btn.className = "arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-pink-600 text-white border-b-4 border-pink-900 active:border-b-0 active:translate-y-1 shadow-lg transition";
                    } else {
                        btn.className = "arcade-font text-[9px] md:text-[11px] py-3 px-2 rounded-xl bg-purple-900 text-gray-300 border-b-4 border-purple-950 active:border-b-0 active:translate-y-1 shadow-lg transition";
                    }
                }
            });

            document.getElementById('list-title').innerText = `STATIONS: ${tag.toUpperCase()}`;
            stationListContainer.innerHTML = `<div class="text-xs text-gray-400 text-center py-10 arcade-font">Searching streams...</div>`;

            try {
                // Fetch verified active streams from Radio Browser open registry
                const response = await fetch(`https://de1.api.radio-browser.info/json/stations/bytag/${encodeURIComponent(tag)}?limit=8&order=votes&reverse=true`);
                const data = await response.json();

                stationListContainer.innerHTML = '';
                
                const validStations = data.filter(s => s.url_resolved && s.url_resolved.startsWith('https'));

                if (validStations.length === 0) {
                    stationListContainer.innerHTML = `<div class="text-xs text-red-400 text-center py-10 arcade-font">No secure streams found. Try another genre.</div>`;
                    return;
                }

                validStations.forEach((station, index) => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-2 rounded-lg bg-gray-900/90 hover:bg-pink-950/40 border border-white/5 hover:border-pink-500/40 transition cursor-pointer group";
                    item.innerHTML = `
                        <span class="text-[10px] text-gray-200 group-hover:text-pink-400 font-bold truncate pr-2">${station.name}</span>
                        <span class="text-[9px] bg-pink-600/30 group-hover:bg-pink-600 text-pink-300 group-hover:text-white px-2 py-1 rounded arcade-font transition shrink-0">PLAY ▶</span>
                    `;
                    item.onclick = () => playStream(station.url_resolved, station.name);
                    stationListContainer.appendChild(item);
                });

                // Auto-play the top voted station immediately
                playStream(validStations[0].url_resolved, validStations[0].name);

            } catch (err) {
                console.error(err);
                stationListContainer.innerHTML = `<div class="text-xs text-red-400 text-center py-10 arcade-font">Network error loading stations.</div>`;
            }
        }

        function playStream(url, name) {
            nowPlayingName.innerText = name;
            nowPlayingStatus.innerText = "CONNECTING...";
            
            audio.src = url;
            audio.play().then(() => {
                nowPlayingStatus.innerText = "LIVE BROADCAST";
                vinylDisc.classList.add('spinning');
            }).catch(e => {
                nowPlayingStatus.innerText = "CLICK TO UNLOCK AUDIO";
                vinylDisc.classList.remove('spinning');
            });
        }

        // Global click unlock listener to bypass browser autoplay restrictions
        document.body.addEventListener('click', () => {
            if (audio.paused && audio.src) {
                audio.play().catch(() => {});
            }
        }, { once: true });

        // Load Hip-Hop on initial startup
        window.addEventListener('DOMContentLoaded', () => {
            audio.volume = 0.8;
            fetchStations('hip hop');
        });
    </script>
</body>
</html>
