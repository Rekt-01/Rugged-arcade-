<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugged Arcade</title>
  <!-- Retro Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d061a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow-x: hidden;
    }

    /* Main container that locks hotspots to the image proportions */
    .arcade-container {
      position: relative;
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      user-select: none;
    }

    .arcade-bg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ==========================================
       TEAM WALLET RETRO HUD (TOP LEFT)
       ========================================== */
    .treasury-hud {
      position: absolute;
      top: 2.5%;
      left: 3%;
      z-index: 35;
      background: rgba(13, 6, 26, 0.92);
      border: 2px solid #00ffff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6), 3px 3px 0px #ff00ff;
      padding: 7px 10px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .treasury-hud:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.95), 3px 3px 0px #ff00ff;
      border-color: #ff00ff;
    }

    .treasury-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 7px;
      color: #ff00ff;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #00ff66;
      box-shadow: 0 0 6px #00ff66;
      display: inline-block;
      animation: blinkDot 1.5s infinite;
    }

    .treasury-balance {
      font-size: 10px;
      color: #00ffff;
      text-shadow: 1px 1px 0px #000;
      white-space: nowrap;
    }

    .treasury-usd {
      font-size: 6.5px;
      color: #b3a4c9;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Clickable Hotspots */
    .hotspot {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
      transition: all 0.15s ease-in-out;
      border-radius: 4px;
    }

    .hotspot:hover {
      background-color: rgba(255, 0, 255, 0.18);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.8), inset 0 0 8px rgba(255, 0, 255, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.8);
    }

    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 6, 26, 0.9);
      color: #00ffff;
      border: 1px solid #ff00ff;
      padding: 4px 6px;
      font-size: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      margin-bottom: 4px;
      box-shadow: 2px 2px 0px #000;
      z-index: 30;
    }

    .hotspot:hover::after {
      opacity: 1;
    }

    /* ==========================================
       HOTSPOT COORDINATES
       ========================================== */
    .leaderboard { top: 21%; left: 2%; width: 22%; height: 23%; }
    .spaceman { top: 3%; left: 76%; width: 22%; height: 29%; }
    .shop-sign { top: 29%; left: 75%; width: 24%; height: 12%; }
    .info-sign { top: 39%; left: 63.5%; width: 10.5%; height: 7%; }
    .toilet-door { top: 38%; left: 43%; width: 13.5%; height: 14.5%; }
    .jukebox { top: 46.5%; left: 63.5%; width: 11.5%; height: 9.5%; }
    .retro-pc { top: 48%; left: 29%; width: 13%; height: 10%; }
    .arcade-1 { top: 51%; left: 1%; width: 19%; height: 36%; }
    .arcade-2 { top: 49.5%; left: 16%; width: 15%; height: 27%; }
    .arcade-3 { top: 52.5%; left: 24%; width: 20%; height: 10%; }
    .arcade-4 { top: 53%; left: 65%; width: 24%; height: 28%; }
    .arcade-5 { top: 58%; left: 83%; width: 16%; height: 36%; }

    /* ==========================================
       SHOPKEEPER GIRL & PIXEL SPEECH BUBBLE
       ========================================== */
    .shopkeeper-trigger {
      position: absolute;
      top: 47%;
      left: 84%;
      width: 11%;
      height: 7%;
      cursor: pointer;
      z-index: 20;
    }

    .speech-bubble {
      position: absolute;
      top: 40.5%;
      right: 12%;
      width: 44%;
      background: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      padding: 8px;
      font-size: 7.5px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.75);
      z-index: 25;
      cursor: pointer;
      animation: floatBubble 2.5s ease-in-out infinite;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      right: 18px;
      border-width: 10px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
      z-index: 2;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -14px;
      right: 15px;
      border-width: 13px 11px 0;
      border-style: solid;
      border-color: #000000 transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="arcade-container">
    <!-- Main Background Image -->
    <img src="IMG_5676.jpeg" alt="Rugged Arcade" class="arcade-bg">

    <!-- Links directly to wallet.html -->
    <a href="wallet.html" 
       class="treasury-hud"
       title="Open Team Vault & NFT Inventory">
      <div class="treasury-header">
        <span class="status-dot"></span>
        <span>TEAM VAULT</span>
      </div>
      <div class="treasury-balance">
        <span id="ape-balance">...</span> APE
      </div>
      <div class="treasury-usd" id="ape-usd">
        OPEN VAULT ▸
      </div>
    </a>

    <!-- Speech Bubble for the Girl Behind the Counter -->
    <div class="speech-bubble" id="speechBubble" title="Click for next message">
      WELCOME TO THE ARCADE! WAGMI DEGENS! 🚀
    </div>
    <div class="shopkeeper-trigger" id="shopkeeper" title="Talk to Clerk"></div>

    <!-- Clickable Links -->
    <a href="leaderboard.html" class="hotspot leaderboard" data-label="LEADERBOARD"></a>
    <a href="nft.html" class="hotspot spaceman" data-label="NFTs"></a>
    <a href="shop.html" class="hotspot shop-sign" data-label="PRIZES / SHOP"></a>
    <a href="discord.html" class="hotspot info-sign" data-label="DISCORD / INFO"></a>
    <a href="toilet.html" class="hotspot toilet-door" data-label="TOILETS"></a>
    <a href="radio.html" class="hotspot jukebox" data-label="RADIO JUKEBOX"></a>
    <a href="pc.html" class="hotspot retro-pc" data-label="PC TERMINAL (pc.html)"></a>

    <!-- Arcade Machines 1 - 5 -->
    <a href="arcade1.html" class="hotspot arcade-1" data-label="ARCADE 1"></a>
    <a href="arcade2.html" class="hotspot arcade-2" data-label="ARCADE 2"></a>
    <a href="arcade3.html" class="hotspot arcade-3" data-label="ARCADE 3"></a>
    <a href="arcade4.html" class="hotspot arcade-4" data-label="ARCADE 4"></a>
    <a href="arcade5.html" class="hotspot arcade-5" data-label="ARCADE 5"></a>
  </div>

  <script>
    const phrases = [
      "WELCOME TO THE ARCADE! WAGMI DEGENS! 🚀",
      "SWEEP THE FLOOR BEFORE YOU GET REKT! 🧹💎",
      "DIAMOND HANDS ONLY IN THIS ARCADE! 💎🙌",
      "SOLD MY RENT MONEY FOR PIXEL JPEGS! 🦍🔥",
      "NGMI IF YOU DON'T MINT RIGHT NOW! 📈",
      "1 NFT = 1 NFT. NO CRYING IN THE CASINO! 🎰",
      "WEN LAMBO? PLAY SOME GAMES FIRST DEGEN! 🏎️💨"
    ];

    let currentIndex = 0;
    const bubble = document.getElementById('speechBubble');
    const clerk = document.getElementById('shopkeeper');

    function nextPhrase() {
      currentIndex = (currentIndex + 1) % phrases.length;
      bubble.textContent = phrases[currentIndex];
    }

    let dialogueInterval = setInterval(nextPhrase, 4500);

    bubble.addEventListener('click', () => {
      clearInterval(dialogueInterval);
      nextPhrase();
      dialogueInterval = setInterval(nextPhrase, 4500);
    });

    clerk.addEventListener('click', () => {
      clearInterval(dialogueInterval);
      nextPhrase();
      dialogueInterval = setInterval(nextPhrase, 4500);
    });

    // ==========================================
    // LIVE APECHAIN TEAM WALLET FETCHER
    // ==========================================
    const TEAM_WALLET = "0xf3e5ec8b4aaab49186486965529e07b5f61f9020";
    const APECHAIN_RPC = "https://rpc.apechain.com/http";
    let clerkPhraseAdded = false;

    async function fetchTeamVault() {
      const balanceEl = document.getElementById("ape-balance");
      const usdEl = document.getElementById("ape-usd");

      try {
        const response = await fetch(APECHAIN_RPC, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "eth_getBalance",
            params: [TEAM_WALLET, "latest"],
            id: 1
          })
        });

        const data = await response.json();
        const balanceWei = BigInt(data.result);
        const balanceApe = Number(balanceWei) / 1e18;

        const formattedApe = balanceApe.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

        balanceEl.textContent = formattedApe;

        if (!clerkPhraseAdded) {
          phrases.push(`TEAM VAULT IS STACKED WITH ${formattedApe} APE! 🦍💰`);
          clerkPhraseAdded = true;
        }

        try {
          const priceRes = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=apecoin&vs_currencies=usd"
          );
          const priceData = await priceRes.json();
          const apeUsd = priceData?.apecoin?.usd;

          if (apeUsd) {
            const totalUsd = (balanceApe * apeUsd).toLocaleString(undefined, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            });
            usdEl.textContent = `≈ $${totalUsd} ▸ VAULT`;
          }
        } catch {
          usdEl.textContent = "OPEN VAULT ▸";
        }
      } catch (err) {
        console.error("Failed to load ApeChain balance:", err);
        balanceEl.textContent = "ERR";
      }
    }

    fetchTeamVault();
    setInterval(fetchTeamVault, 60000);
  </script>

</body>
</html>
